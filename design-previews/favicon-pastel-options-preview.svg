<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#FAF7F4"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#2D2926">חלופות פסטל לאייקון האתר</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#7A6F6A">צבעוניות רגועה עם סמל כהה שנשאר ברור גם בלשונית</text>

  <g transform="translate(70 150)">
    <rect width="245" height="460" rx="24" fill="#fff" stroke="#E5E1DD" stroke-width="2"/>
    <image href="favicon-options/option-e-pastel-embrace.svg" x="42.5" y="38" width="160" height="160"/>
    <image href="favicon-options/option-e-pastel-embrace.svg" x="104.5" y="218" width="36" height="36"/>
    <text x="122.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2D2926">ה — חיבוק</text>
    <text x="122.5" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">ורוד־אבקתי</text>
    <text x="122.5" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">חם, אנושי ורך</text>
  </g>

  <g transform="translate(335 150)">
    <rect width="245" height="460" rx="24" fill="#fff" stroke="#E5E1DD" stroke-width="2"/>
    <image href="favicon-options/option-f-pastel-sprout.svg" x="42.5" y="38" width="160" height="160"/>
    <image href="favicon-options/option-f-pastel-sprout.svg" x="104.5" y="218" width="36" height="36"/>
    <text x="122.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2D2926">ו — צמיחה</text>
    <text x="122.5" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">ירוק מרווה</text>
    <text x="122.5" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">רגוע ומקצועי</text>
  </g>

  <g transform="translate(600 150)">
    <rect width="245" height="460" rx="24" fill="#fff" stroke="#E5E1DD" stroke-width="2"/>
    <image href="favicon-options/option-g-pastel-dialogue.svg" x="42.5" y="38" width="160" height="160"/>
    <image href="favicon-options/option-g-pastel-dialogue.svg" x="104.5" y="218" width="36" height="36"/>
    <text x="122.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2D2926">ז — דיאלוג</text>
    <text x="122.5" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">לבנדר</text>
    <text x="122.5" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">טיפולי ומודרני</text>
  </g>

  <g transform="translate(865 150)">
    <rect width="245" height="460" rx="24" fill="#fff" stroke="#E5E1DD" stroke-width="2"/>
    <image href="favicon-options/option-h-pastel-heart-link.svg" x="42.5" y="38" width="160" height="160"/>
    <image href="favicon-options/option-h-pastel-heart-link.svg" x="104.5" y="218" width="36" height="36"/>
    <text x="122.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2D2926">ח — קשר ולב</text>
    <text x="122.5" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">תכלת פסטלית</text>
    <text x="122.5" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7A6F6A">הכי מזוהה עם המותג</text>
  </g>
</svg>
