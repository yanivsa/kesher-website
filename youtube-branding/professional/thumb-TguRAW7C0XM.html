<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Kesher Thumbnail</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: Arial, "Noto Sans Hebrew", sans-serif;
        background: #1f322b;
      }

      .frame {
        position: relative;
        width: 1280px;
        height: 720px;
        color: #fff;
        background:
          radial-gradient(circle at 18% 26%, rgba(237, 186, 139, 0.85) 0 9%, transparent 20%),
          linear-gradient(90deg, rgba(24, 42, 35, 0.1), rgba(18, 35, 29, 0.92) 58%, rgba(18, 35, 29, 0.98)),
          linear-gradient(135deg, #b98a62 0%, #d6b78e 32%, #7f8d75 58%, #20392f 100%);
      }

      .room {
        position: absolute;
        inset: 0;
        opacity: 0.9;
      }

      .window {
        position: absolute;
        left: 86px;
        top: 76px;
        width: 330px;
        height: 220px;
        border: 18px solid rgba(255, 246, 224, 0.42);
        border-radius: 4px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }

      .window::before,
      .window::after {
        content: "";
        position: absolute;
        background: rgba(255, 246, 224, 0.32);
      }

      .window::before {
        left: 50%;
        top: 0;
        width: 14px;
        height: 100%;
        transform: translateX(-50%);
      }

      .window::after {
        top: 50%;
        left: 0;
        width: 100%;
        height: 14px;
        transform: translateY(-50%);
      }

      .sofa {
        position: absolute;
        left: 80px;
        bottom: 92px;
        width: 560px;
        height: 190px;
        border-radius: 52px 52px 20px 20px;
        background: rgba(46, 70, 58, 0.5);
        filter: blur(1px);
      }

      .table {
        position: absolute;
        left: 110px;
        bottom: 62px;
        width: 480px;
        height: 86px;
        border-radius: 44px;
        background: rgba(102, 69, 44, 0.5);
      }

      .parent-card,
      .child-card {
        position: absolute;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(5px);
      }

      .parent-card {
        left: 188px;
        bottom: 182px;
        width: 124px;
        height: 124px;
      }

      .child-card {
        left: 320px;
        bottom: 158px;
        width: 98px;
        height: 98px;
      }

      .person {
        position: absolute;
        left: 50%;
        top: 28px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        transform: translateX(-50%);
        background: #f0c7a1;
      }

      .person::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 46px;
        width: 68px;
        height: 44px;
        border-radius: 44px 44px 10px 10px;
        transform: translateX(-50%);
        background: #2f5f4c;
      }

      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(16, 34, 28, 0.12), rgba(14, 31, 25, 0.78) 50%, rgba(14, 31, 25, 0.96));
      }

      .topic {
        position: absolute;
        top: 38px;
        right: 48px;
        padding: 15px 24px 16px;
        border-radius: 8px;
        background: #edb188;
        color: #fff;
        font-size: 30px;
        font-weight: 900;
      }

      .brand {
        position: absolute;
        top: 178px;
        right: 54px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        border-radius: 34px;
        color: #1f3c31;
        background: rgba(255, 255, 255, 0.94);
        font-weight: 900;
        font-size: 30px;
      }

      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }

      .title {
        position: absolute;
        right: 54px;
        top: 280px;
        width: 760px;
        text-align: right;
      }

      h1 {
        margin: 0;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: 0;
        font-weight: 900;
        text-shadow: 0 5px 18px rgba(0, 0, 0, 0.34);
      }

      h2 {
        margin: 26px 0 0;
        font-size: 44px;
        line-height: 1.15;
        letter-spacing: 0;
        font-weight: 900;
        color: #fff4e7;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.36);
      }

      .line {
        position: absolute;
        right: 54px;
        top: 575px;
        width: 242px;
        height: 12px;
        border-radius: 999px;
        background: #edb188;
      }

      .site {
        position: absolute;
        left: 46px;
        bottom: 35px;
        direction: ltr;
        padding: 12px 22px 14px;
        border-radius: 13px;
        background: rgba(32, 64, 51, 0.88);
        color: #fff;
        font-size: 31px;
        line-height: 1;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="room">
        <div class="window"></div>
        <div class="sofa"></div>
        <div class="table"></div>
        <div class="parent-card"><span class="person"></span></div>
        <div class="child-card"><span class="person"></span></div>
      </div>
      <div class="shade"></div>
      <div class="topic">הורות</div>
      <div class="brand">
        <span>קשר</span>
        <img src="./profile-kesher-logo.png" alt="" />
      </div>
      <section class="title">
        <h1>הילד לא הבעיה</h1>
        <h2>הגבול שהבית באמת צריך</h2>
      </section>
      <div class="line"></div>
      <div class="site">kesher.saharoni.com</div>
    </main>
  </body>
</html>
