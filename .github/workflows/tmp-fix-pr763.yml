name: Temporary PR 763 patch

on:
  push:
    branches:
      - fix/remotion-enhancement-contract
    paths:
      - .github/workflows/tmp-fix-pr763.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remotion-enhancement-contract
      - name: Patch enhancement manifest guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/kesher_daily_pipeline.py")
          text = p.read_text(encoding="utf-8")
          start_marker = '    manifest["enhancement"] = build_enhancement_manifest(\n'
          end_marker = '\n    if technical_failures:\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f"enhancement start marker count={text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = "\n".join([
              '    if item.get("visual_pipeline") == "remotion-v1-notebooklm-audio":',
              '        motion_plan_name = str(item.get("motion_plan_path") or "").strip()',
              '        enhancement_status = str(item.get("enhancement_status") or "").strip()',
              '        if not motion_plan_name or not enhancement_status:',
              '            raise PipelineError("Remotion enhancement evidence is incomplete")',
              '        manifest["enhancement"] = build_enhancement_manifest(',
              '            source_path=raw_path,',
              '            final_path=final_path,',
              '            edit_plan_path=STATE_DIR / motion_plan_name,',
              '            enhancement_status=enhancement_status,',
              '            assets_used=item.get("enhancement_assets_used") or [],',
              '            assets_dropped=item.get("enhancement_assets_dropped") or [],',
              '            fallback_reason=item.get("enhancement_fallback_reason"),',
              '        )',
              '',
          ])
          p.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/kesher_daily_pipeline.py
          git diff --cached --check
          git commit -m "fix: keep enhancement evidence fail-closed"
          git push origin HEAD:fix/remotion-enhancement-contract
