name: Kesher Gifted Short Exact Dispatch

on:
  push:
    paths:
      - '.github/workflows/kesher-gifted-short-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse duplicate active production Short run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/${REPO}/actions/workflows/349292838/runs?per_page=100" --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress" or .status == "pending"))] | length')"
          if [ "$active" -gt 0 ]; then
            echo "An active production Short workflow already exists; refusing duplicate dispatch."
            exit 0
          fi

          # Full mode is intentional: restore durable Short state, resume the
          # already-existing exact-source provider task, validate, upload once,
          # and publicly verify. Do not adopt the long-form Overview identity;
          # Shorts are independent vertical artifacts from the same article.
          gh workflow run kesher-short-v4.yml \
            --repo "$REPO" \
            --ref main \
            -f operation=full \
            -f derive_slug=gifted-children-social-difficulties

          echo "Exact existing Short resume dispatch accepted."
