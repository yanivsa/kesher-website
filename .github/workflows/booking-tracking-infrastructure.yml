name: Provision booking tracking infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/booking-tracking-infrastructure.yml'
      - 'scripts/provision_booking_tracking.py'
      - 'migrations/0001_booking_attribution.sql'
      - 'functions/api/booking/**'
      - 'functions/api/calendly/**'
  workflow_dispatch:

concurrency:
  group: booking-tracking-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Provision booking storage and Pages binding
        id: cloudflare
        run: python3 scripts/provision_booking_tracking.py cloudflare

      - name: Check Calendly webhook state
        id: calendly
        if: ${{ env.CALENDLY_API_TOKEN != '' }}
        run: python3 scripts/provision_booking_tracking.py calendly-status

      - name: Create and store Calendly webhook signing key
        id: signing_key
        if: ${{ env.CALENDLY_API_TOKEN != '' && steps.calendly.outputs.webhook_exists == 'false' }}
        run: |
          set -euo pipefail
          signing_key="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_key"
          echo "CALENDLY_WEBHOOK_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"
          printf '%s' "$signing_key" | npx --yes wrangler@4.100.0 pages secret put CALENDLY_WEBHOOK_SIGNING_KEY --project-name=kesher-website

      - name: Register Calendly booking webhook
        id: webhook_create
        if: ${{ env.CALENDLY_API_TOKEN != '' && steps.calendly.outputs.webhook_exists == 'false' }}
        run: python3 scripts/provision_booking_tracking.py calendly-create

      - name: Report missing Calendly API token
        if: ${{ env.CALENDLY_API_TOKEN == '' }}
        run: |
          echo "::notice::CALENDLY_API_TOKEN is not configured. Browser booking reconciliation storage is active, but Calendly server-side verification remains pending."

      - name: Redeploy Pages after binding or webhook activation
        id: redeploy
        if: ${{ steps.cloudflare.outputs.binding_changed == 'true' || (env.CALENDLY_API_TOKEN != '' && steps.calendly.outputs.webhook_exists == 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow=deploy.yml \
              --branch=main \
              --event=workflow_dispatch \
              --limit=20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not locate the post-provision deployment for $GITHUB_SHA"
            exit 1
          fi

          echo "Watching Cloudflare deployment workflow run $run_id"
          set +e
          gh run watch "$run_id" --exit-status
          watch_exit=$?
          set -e

          if [ "$watch_exit" -eq 0 ]; then
            exit 0
          fi

          conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion // ""')"
          if [ "$conclusion" != "cancelled" ]; then
            echo "::error::Post-provision deployment $run_id concluded as ${conclusion:-unknown}"
            exit "$watch_exit"
          fi

          echo "::notice::Deployment $run_id was superseded by a newer main deployment; verifying the replacement deployment."
          replacement_id=""
          for attempt in $(seq 1 60); do
            replacement_id="$(gh run list \
              --workflow=deploy.yml \
              --branch=main \
              --limit=30 \
              --json databaseId,status,conclusion \
              --jq ".[] | select(.databaseId > $run_id and .status == \"completed\" and .conclusion == \"success\") | .databaseId" \
              | head -n 1)"
            if [ -n "$replacement_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$replacement_id" ]; then
            echo "::error::The post-provision deployment was cancelled and no newer successful main deployment was observed"
            exit 1
          fi

          echo "A newer successful production deployment ($replacement_id) superseded cancelled run $run_id."

      - name: Publish booking infrastructure statuses
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CALENDLY_TOKEN_PRESENT: ${{ env.CALENDLY_API_TOKEN != '' }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          STORAGE_TYPE: ${{ steps.cloudflare.outputs.storage_type }}
          WEBHOOK_EXISTS: ${{ steps.calendly.outputs.webhook_exists }}
          WEBHOOK_CHECK_OUTCOME: ${{ steps.calendly.outcome }}
          WEBHOOK_CREATE_OUTCOME: ${{ steps.webhook_create.outcome }}
          REDEPLOY_OUTCOME: ${{ steps.redeploy.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          publish_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }

          if [ "$CLOUDFLARE_OUTCOME" = "success" ]; then
            publish_status success "booking-tracking/cloudflare" "Cloudflare $STORAGE_TYPE booking storage and Pages binding are ready"
          else
            publish_status failure "booking-tracking/cloudflare" "Cloudflare booking storage or Pages binding provisioning failed"
          fi

          if [ "$CALENDLY_TOKEN_PRESENT" != "true" ]; then
            publish_status pending "booking-tracking/calendly-webhook" "CALENDLY_API_TOKEN is required to activate server verification"
          elif [ "$WEBHOOK_CHECK_OUTCOME" != "success" ]; then
            publish_status failure "booking-tracking/calendly-webhook" "Calendly webhook state check failed"
          elif [ "$WEBHOOK_EXISTS" = "true" ]; then
            publish_status success "booking-tracking/calendly-webhook" "Calendly booking webhook is already active"
          elif [ "$WEBHOOK_CREATE_OUTCOME" = "success" ]; then
            publish_status success "booking-tracking/calendly-webhook" "Calendly booking webhook was created"
          else
            publish_status failure "booking-tracking/calendly-webhook" "Calendly webhook activation failed"
          fi

          if [ "$REDEPLOY_OUTCOME" = "failure" ]; then
            publish_status failure "booking-tracking/post-provision-deploy" "Post-provision Cloudflare deployment failed"
          elif [ "$REDEPLOY_OUTCOME" = "success" ]; then
            publish_status success "booking-tracking/post-provision-deploy" "Post-provision Cloudflare deployment succeeded"
          else
            publish_status success "booking-tracking/post-provision-deploy" "No additional post-provision deployment was required"
          fi

      - name: Infrastructure summary
        if: ${{ always() }}
        run: |
          echo "Booking storage type: ${{ steps.cloudflare.outputs.storage_type || 'unavailable' }}"
          echo "Booking storage resource: ${{ steps.cloudflare.outputs.storage_created == 'true' && 'created' || 'existing/unavailable' }}"
          echo "Pages binding changed: ${{ steps.cloudflare.outputs.binding_changed || 'unknown' }}"
          if [ -z "$CALENDLY_API_TOKEN" ]; then
            echo "Calendly webhook: pending token"
          elif [ "${{ steps.calendly.outputs.webhook_exists }}" = "true" ]; then
            echo "Calendly webhook: already active"
          else
            echo "Calendly webhook: activation attempted"
          fi
