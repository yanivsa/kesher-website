name: S3 V5 Upload Target Repair

on:
  push:
    branches:
      - fix/v5-upload-target-binding-20260915
    paths:
      - .github/workflows/s3-v5-upload-target-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v5-upload-target-binding-20260915
          fetch-depth: 0

      - name: Bind upload reconciliation to exact target identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/kesher_video_reconcile.py')
          text = path.read_text(encoding='utf-8')
          old = '''def prepare_upload(target_slug: str | None = None) -> int:
              state = pipeline.load_state()
              unresolved = unresolved_items(state)
              target = (target_slug or os.environ.get("TARGET_SLUG") or os.environ.get("DERIVE_SLUG") or "").strip()
              if target:
                  unresolved = [item for item in unresolved if source_slug(item) == target]
              if not unresolved:
                  workflow_output("ready", "false")
                  print("VIDEO_RECONCILED_UPLOAD candidate=none")
                  return 0
          '''.replace('              ', '')
          new = '''def prepare_upload(target_slug: str | None = None) -> int:
              state = pipeline.load_state()
              unresolved = unresolved_items(state)
              target_item_id = (os.environ.get("TARGET_ITEM_ID") or "").strip()
              target = (target_slug or os.environ.get("TARGET_SLUG") or os.environ.get("DERIVE_SLUG") or "").strip()
              if target_item_id:
                  exact = [
                      item for item in unresolved
                      if str(item.get("id") or "").strip() == target_item_id
                  ]
                  if exact and target and source_slug(exact[0]) != target:
                      raise pipeline.PipelineError(
                          f"Exact target item {target_item_id} belongs to {source_slug(exact[0])}, not {target}"
                      )
                  if not exact:
                      workflow_output("ready", "false")
                      print(f"VIDEO_RECONCILED_UPLOAD candidate=none target_item={target_item_id}")
                      return 0
                  unresolved = exact
              elif target:
                  unresolved = [item for item in unresolved if source_slug(item) == target]
              if not unresolved:
                  workflow_output("ready", "false")
                  print("VIDEO_RECONCILED_UPLOAD candidate=none")
                  return 0
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('prepare_upload anchor not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_video_reconcile.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in tests:
              raise SystemExit('test insertion anchor not found')
          regression = '''
              def test_prepare_upload_honors_exact_target_item_before_fifo_backlog(self) -> None:
                  current = post("current", "2026-08-19")
                  stale = post("stale", "2026-08-18")
                  self.write_posts([current, stale])

                  stale_item = pipeline.new_item(pipeline.source_metadata(stale))
                  stale_item.update({
                      "status": "rejected",
                      "technical_verified": False,
                      "review_notes": {"technical": "נפסל טכנית: stale failure"},
                  })
                  current_item = pipeline.new_item(pipeline.source_metadata(current))
                  technically_verified(current_item, status="rejected")
                  pipeline.save_state({
                      "version": 1,
                      "items": [stale_item, current_item],
                      "updated_at": pipeline.utc_now(),
                  })

                  with mock.patch.dict(os.environ, {"TARGET_ITEM_ID": current_item["id"]}, clear=False), mock.patch.object(
                      reconcile, "validate_upload_candidate"
                  ):
                      self.assertEqual(reconcile.prepare_upload(), 0)

                  saved = {item["id"]: item for item in pipeline.load_state()["items"]}
                  self.assertEqual(saved[current_item["id"]]["status"], "approved")
                  self.assertEqual(saved[current_item["id"]]["advisory_review_status_before_upload"], "rejected")
                  self.assertEqual(saved[stale_item["id"]]["status"], "rejected")
          '''.replace('              ', '    ')
          test_path.write_text(tests.replace(marker, '\n' + regression + marker, 1), encoding='utf-8')
          PY

      - name: Run focused regression suite
        run: python3 -m unittest tests.test_video_reconcile tests.test_v5_video_source_binding -v

      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/s3-v5-upload-target-repair.yml
          git config user.name "KESHER S3 Direct"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kesher_video_reconcile.py tests/test_video_reconcile.py .github/workflows/s3-v5-upload-target-repair.yml
          git commit -m "Fix V5 upload target binding"
          git push origin HEAD:fix/v5-upload-target-binding-20260915
