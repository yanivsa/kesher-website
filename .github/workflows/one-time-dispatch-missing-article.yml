# Retry after durable video-state restore hardening on main.
name: One-time resume Kesher article then video

on:
  push:
    branches:
      - ops/run-missing-article-20260818
    paths:
      - .github/workflows/one-time-dispatch-missing-article.yml

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Verify merged article is public, then resume one video run
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SLUG: gifted-adhd-executive-functions-struggle
          STATUS_BRANCH: ops/run-missing-article-20260818
          STATUS_PATH: .ops/kesher-content-recovery-status.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          baseline = os.environ["BASELINE_SLUG"]
          branch = os.environ["STATUS_BRANCH"]
          status_path = os.environ["STATUS_PATH"]
          api = f"https://api.github.com/repos/{repo}"

          def call(method, path, body=None, timeout=45):
              data = None if body is None else json.dumps(body).encode()
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "kesher-unified-recovery",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else {}

          def write_status(payload):
              payload = {"updated_at": dt.datetime.now(dt.UTC).isoformat(), **payload}
              encoded = base64.b64encode((json.dumps(payload, ensure_ascii=False, indent=2) + "\n").encode()).decode()
              query = urllib.parse.urlencode({"ref": branch})
              sha = None
              try:
                  current = call("GET", f"/contents/{status_path}?{query}")
                  sha = current.get("sha")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              body = {"message": "Update Kesher unified recovery status", "content": encoded, "branch": branch}
              if sha:
                  body["sha"] = sha
              call("PUT", f"/contents/{status_path}", body)

          posts_file = call("GET", "/contents/src/data/posts.json?ref=main")
          posts = json.loads(base64.b64decode(posts_file["content"]).decode())
          if not posts:
              raise SystemExit("posts.json is empty")
          latest = posts[0]
          slug = latest.get("slug")
          title = latest.get("title")
          if not slug or slug == baseline:
              write_status({"stage": "article", "ok": False, "reason": "latest article did not advance", "slug": slug})
              raise SystemExit("Latest article did not advance beyond baseline")

          public_url = f"https://kesher.saharoni.com/blog/{slug}"
          write_status({"stage": "article_live_check", "ok": False, "slug": slug, "title": title, "article_url": public_url})
          live = False
          last_error = ""
          deadline = time.monotonic() + 15 * 60
          while time.monotonic() < deadline:
              try:
                  req = urllib.request.Request(public_url, headers={"User-Agent": "KesherRecovery/2.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      html = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and (title in html or slug in html):
                          live = True
                          break
                      last_error = f"http={response.status} title_match={title in html} slug_match={slug in html}"
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"[:500]
              time.sleep(20)
          if not live:
              write_status({"stage": "article_live_check", "ok": False, "slug": slug, "title": title, "article_url": public_url, "reason": last_error})
              raise SystemExit("Merged article did not become publicly verifiable")

          write_status({"stage": "article_live", "ok": True, "slug": slug, "title": title, "article_url": public_url})

          def parse_time(value):
              return dt.datetime.fromisoformat(value.replace("Z", "+00:00"))

          query = urllib.parse.urlencode({"event": "workflow_dispatch", "branch": "main", "per_page": "30"})
          runs = call("GET", f"/actions/workflows/kesher-daily-video.yml/runs?{query}").get("workflow_runs", [])
          active = [r for r in runs if r.get("status") in {"queued", "in_progress", "waiting", "pending", "requested"}]
          if active:
              video_run = sorted(active, key=lambda r: parse_time(r["created_at"]), reverse=True)[0]
              action = "reused"
          else:
              dispatch_time = dt.datetime.now(dt.UTC)
              call("POST", "/actions/workflows/kesher-daily-video.yml/dispatches", {"ref": "main", "inputs": {"operation": "full"}})
              video_run = None
              for _ in range(30):
                  time.sleep(4)
                  runs = call("GET", f"/actions/workflows/kesher-daily-video.yml/runs?{query}").get("workflow_runs", [])
                  fresh = [r for r in runs if parse_time(r["created_at"]) >= dispatch_time - dt.timedelta(seconds=15)]
                  if fresh:
                      video_run = sorted(fresh, key=lambda r: parse_time(r["created_at"]), reverse=True)[0]
                      break
              if not video_run:
                  write_status({"stage": "video_dispatch", "ok": False, "article_url": public_url, "reason": "dispatch accepted but run not found"})
                  raise SystemExit("Video dispatch accepted but run not found")
              action = "dispatched"

          run_id = video_run["id"]
          run_url = video_run["html_url"]
          write_status({"stage": "video_running", "ok": True, "article_url": public_url, "video_action": action, "video_run_id": run_id, "video_run_url": run_url})

          deadline = time.monotonic() + 165 * 60
          while True:
              run = call("GET", f"/actions/runs/{run_id}")
              if run.get("status") == "completed":
                  conclusion = run.get("conclusion")
                  write_status({"stage": "video_completed", "ok": conclusion == "success", "article_url": public_url, "video_action": action, "video_run_id": run_id, "video_run_url": run_url, "video_conclusion": conclusion})
                  if conclusion != "success":
                      raise SystemExit(f"Video workflow completed with {conclusion}")
                  break
              time.sleep(30)
          PY