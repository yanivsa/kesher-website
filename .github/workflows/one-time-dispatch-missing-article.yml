          text=text.replace('and item.get("status") in {"approved", "uploading"}','and item.get("status") in {"pending_review", "approved", "rejected", "uploading"}',1)
          text=text.replace('    verify_authenticated_channel(token)\n    session_uri = item.get("upload_session_uri")\n','    session_uri = item.get("upload_session_uri")\n',1)
          put_file(path,text,sha,'fix: enforce newest live article for video generation')

