name: One-time resume current Kesher video

on:
  push:
    branches: [ops/run-missing-article-20260818]
    paths: [.github/workflows/one-time-dispatch-missing-article.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: kesher-content-recovery-controller
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh production video run from current main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY' >/tmp/dispatch.json
          import json
          print(json.dumps({"ref": "main", "inputs": {"operation": "full"}}))
          PY
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/kesher-daily-video.yml/dispatches" \
            --input /tmp/dispatch.json

          run_id=""
          for _ in $(seq 1 30); do
            sleep 2
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/kesher-daily-video.yml/runs?event=workflow_dispatch&per_page=30")"
            run_id="$(jq -r --arg sha "$current_main_sha" --arg since "$dispatched_at" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $since)] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$runs")"
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "Fresh current-main video run was not observed after dispatch." >&2
            exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "main_sha=$current_main_sha"
          } >> "$GITHUB_OUTPUT"
          echo "FRESH_VIDEO_RUN id=$run_id sha=$current_main_sha"

      - name: Record dispatched run for unified recovery
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          CURRENT_MAIN_SHA: ${{ steps.dispatch.outputs.main_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          from datetime import datetime, timezone
          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "stage": "video_fresh_run_dispatched",
              "ok": True,
              "video_run_id": os.environ["VIDEO_RUN_ID"],
              "current_main_sha": os.environ["CURRENT_MAIN_SHA"],
              "reason": "fresh workflow_dispatch after minimal Jules evidence branch fix",
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          path='.ops/kesher-content-recovery-status.json'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ops/run-missing-article-20260818" --jq .sha 2>/dev/null || true)"
          content="$(base64 -w0 /tmp/status.json)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='ops: dispatch fresh current-main video run' \
              -f content="$content" -f sha="$sha" -f branch='ops/run-missing-article-20260818' >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='ops: dispatch fresh current-main video run' \
              -f content="$content" -f branch='ops/run-missing-article-20260818' >/dev/null
          fi
