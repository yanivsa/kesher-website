name: One-time resume Kesher article then video

on:
  push:
    branches: [ops/run-missing-article-20260818]
    paths: [.github/workflows/one-time-dispatch-missing-article.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: kesher-content-recovery-controller
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Locate the already-dispatched current-main video run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/kesher-daily-video.yml/runs?per_page=50")"
          row="$(jq -c --arg sha "$current_main_sha" '[.workflow_runs[] | select(.event != "pull_request" and .head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"$runs")"
          if [ -z "$row" ]; then
            echo "No current-main production run is visible after the accepted dispatch." >&2
            exit 1
          fi
          run_id="$(jq -r .id <<<"$row")"
          status="$(jq -r .status <<<"$row")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
          event="$(jq -r .event <<<"$row")"
          {
            echo "run_id=$run_id"
            echo "status=$status"
            echo "conclusion=$conclusion"
            echo "event=$event"
            echo "current_main_sha=$current_main_sha"
          } >> "$GITHUB_OUTPUT"
          echo "CURRENT_MAIN_VIDEO_RUN id=$run_id status=$status conclusion=$conclusion event=$event sha=$current_main_sha"

      - name: Record active run for unified recovery
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_STATUS: ${{ steps.locate.outputs.status }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.conclusion }}
          RUN_EVENT: ${{ steps.locate.outputs.event }}
          CURRENT_MAIN_SHA: ${{ steps.locate.outputs.current_main_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          from datetime import datetime, timezone
          status = os.environ.get('RUN_STATUS', '')
          conclusion = os.environ.get('RUN_CONCLUSION', '')
          payload = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'stage': 'video_upload_complete' if status == 'completed' else 'video_upload_running',
              'ok': status == 'completed' and conclusion == 'success',
              'article_url': 'https://kesher.saharoni.com/blog/first-grade-preparation-morning-routine',
              'article_slug': 'first-grade-preparation-morning-routine',
              'video_item_id': 'video-20260819-011621-abab0957a6',
              'video_run_id': os.environ.get('VIDEO_RUN_ID', ''),
              'video_run_sha': os.environ.get('CURRENT_MAIN_SHA', ''),
              'current_main_sha': os.environ.get('CURRENT_MAIN_SHA', ''),
              'run_is_current_main': True,
              'run_status': status,
              'run_conclusion': conclusion,
              'run_event': os.environ.get('RUN_EVENT', ''),
              'reason': 'monitoring already-dispatched current-main upload continuation',
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.ops/kesher-content-recovery-status.json?ref=ops/run-missing-article-20260818" --jq .sha)"
          content="$(base64 -w0 /tmp/status.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.ops/kesher-content-recovery-status.json" \
            -f message='ops: monitor current-main video upload run' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch='ops/run-missing-article-20260818' >/dev/null
