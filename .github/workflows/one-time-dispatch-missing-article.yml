name: One-time resume Kesher article then video

on:
  push:
    branches:
      - ops/run-missing-article-20260818
    paths:
      - .github/workflows/one-time-dispatch-missing-article.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Create focused strict-source recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          branch='fix/strict-latest-kesher-video-source'

          def call(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kesher-unified-recovery'}
              if body is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(api+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); return json.loads(raw) if raw else {}

          main_sha=call('GET','/git/ref/heads/main')['object']['sha']
          try:
              call('GET',f'/git/ref/heads/{branch}')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
              call('POST','/git/refs',{'ref':f'refs/heads/{branch}','sha':main_sha})

          def get_file(path):
              row=call('GET',f'/contents/{path}?'+urllib.parse.urlencode({'ref':branch}))
              return base64.b64decode(row['content']).decode('utf-8'), row['sha']

          def put_file(path,text,sha,message):
              call('PUT',f'/contents/{path}',{'message':message,'content':base64.b64encode(text.encode()).decode(),'sha':sha,'branch':branch})

          path='scripts/kesher_daily_pipeline.py'
          text,sha=get_file(path)

          # 1) New article schema uses id as the canonical slug when slug is absent.
          text=text.replace(
              '    required = ("id", "slug", "title", "date", "category", "excerpt", "content")\n    missing = [field for field in required if not str(post.get(field, "")).strip()]\n    if missing:\n        raise PipelineError(f"Article is missing authoritative fields: {\', \'.join(missing)}")\n    title = str(post["title"]).strip()\n',
              '    required = ("id", "title", "date", "category", "excerpt", "content")\n    missing = [field for field in required if not str(post.get(field, "")).strip()]\n    if missing:\n        raise PipelineError(f"Article is missing authoritative fields: {\', \'.join(missing)}")\n    slug = str(post.get("slug") or post.get("id") or "").strip()\n    if not slug:\n        raise PipelineError("Article is missing an authoritative slug/id")\n    title = str(post["title"]).strip()\n'
          )
          text=text.replace('    canonical_url = f"{SITE_URL}/blog/{post[\'slug\']}"\n','    canonical_url = f"{SITE_URL}/blog/{slug}"\n')
          text=text.replace('        "slug": str(post["slug"]),\n','        "slug": slug,\n')

          # 2) Never silently backfill older posts. The only generation candidate is
          # the newest published article; invalid newest metadata fails loudly.
          start=text.index('def select_newest_unused_article(')
          end=text.index('\ndef notebooklm_env()',start)
          replacement='''def latest_published_article() -> dict[str, Any]:
    if not POSTS_FILE.exists():
        raise PipelineError(f"Article source does not exist: {POSTS_FILE}")
    posts = json.loads(POSTS_FILE.read_text(encoding="utf-8"))
    if not isinstance(posts, list):
        raise PipelineError("posts.json must contain a list")
    today = israel_now().date()
    dated: list[tuple[date, int, dict[str, Any]]] = []
    for index, post in enumerate(posts):
        try:
            published = date.fromisoformat(str(post.get("date", "")))
        except (ValueError, TypeError):
            continue
        if published <= today:
            dated.append((published, -index, post))
    if not dated:
        raise PipelineError("No published article is available")
    dated.sort(reverse=True, key=lambda row: (row[0], row[1]))
    return source_metadata(dated[0][2])


def select_newest_unused_article(state: dict[str, Any]) -> dict[str, Any] | None:
    metadata = latest_published_article()
    used_hashes = {item.get("source", {}).get("content_sha256") for item in state["items"]}
    used_slugs = {item.get("source", {}).get("slug") for item in state["items"] if item.get("uploaded") is True}
    if metadata["content_sha256"] in used_hashes or metadata["slug"] in used_slugs:
        return None
    return metadata


def verify_article_public(source: dict[str, Any]) -> None:
    response = requests.get(source["canonical_url"], headers={"User-Agent": "KesherVideoPipeline/1.0"}, timeout=30)
    if response.status_code != 200:
        raise PipelineError(f"Newest article is not publicly deployed: HTTP {response.status_code}")
    if source["title"] not in response.text:
        raise PipelineError("Newest public article does not expose the expected title")
