def select_newest_unused_article(state: dict[str, Any]) -> dict[str, Any] | None:
    metadata = latest_published_article()
    used_hashes = {item.get("source", {}).get("content_sha256") for item in state["items"]}
    used_slugs = {item.get("source", {}).get("slug") for item in state["items"] if item.get("uploaded") is True}
    if metadata["content_sha256"] in used_hashes or metadata["slug"] in used_slugs:
        return None
    return metadata


def verify_article_public(source: dict[str, Any]) -> None:
