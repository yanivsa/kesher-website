          pulls=call('GET','/pulls?'+urllib.parse.urlencode({'state':'open','head':f'yanivsa:{branch}','base':'main','per_page':'20'}))
          if pulls:
              print(f"PR_EXISTS {pulls[0]['html_url']}")
          else:
              pr=call('POST','/pulls',{
                  'title':'fix: enforce newest live article in Kesher video chain',
                  'head':branch,'base':'main',
                  'body':'Fixes the source-selection regression discovered during unified recovery. The video pipeline now accepts id as slug fallback, generates only for the newest published article, verifies that page is publicly live with the expected title before creating NotebookLM work, supersedes the erroneous older backfill task, and restores Jules to advisory while retaining technical and post-upload YouTube safeguards.'
