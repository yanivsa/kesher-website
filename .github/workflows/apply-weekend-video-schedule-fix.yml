name: Request Jules Weekend Video Schedule Fix

on:
  push:
    paths:
      - .github/workflows/apply-weekend-video-schedule-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Request minimal protected-workflow fix from Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"
          cat > payload.json <<'JSON'
          {
            "title": "Finalize Kesher weekend video schedule",
            "prompt": "Run fully autonomously and do not ask the user for approval. Repository: yanivsa/kesher-website, start from current main. Make one minimal scheduling repair only. In .github/workflows/kesher-daily-video.yml, restrict the existing regular evening schedule entries from every day to Sunday-Thursday only: change `5,20,35,50 16 * * *` to `5,20,35,50 16 * * 0,1,2,3,4` and `5,20,35,50 17 * * *` to `5,20,35,50 17 * * 0,1,2,3,4`. Update the nearby schedule comment truthfully to say the regular evening slices are Sunday-Thursday and weekend runs are handled separately by .github/workflows/kesher-weekend-video-scheduler.yml: Friday morning and Saturday beginning one hour after Ashdod sunset. Do not change the NotebookLM, Remotion, Jules review, state, upload, or other pipeline logic. Do not modify the weekend scheduler. Remove .github/workflows/apply-weekend-video-schedule-fix.yml from the final PR because it is only a temporary migration helper. Run the repository's required validation/status checks that apply to workflow changes. Create a non-draft PR automatically with only these minimal changes. Do not merge before required checks pass; do not claim success unless the remote PR contains the exact change.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {"startingBranch": "main"},
              "environmentVariablesEnabled": true
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON
          status=$(curl -w "%{http_code}" -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)
          if [ "$status" -ge 400 ]; then
            echo "Jules API failed with HTTP $status"
            cat response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          data = json.load(open('response.json', encoding='utf-8'))
          session = data.get('name') or data.get('id')
          url = data.get('url') or data.get('agentUrl') or data.get('sessionUrl')
          if not session or not url:
              raise SystemExit('Jules response missing session identity or URL')
          print(f'Jules session started: {session}')
          print(f'URL: {url}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'### Jules weekend schedule repair\n\n- Session: `{session}`\n- URL: {url}\n')
          PY
