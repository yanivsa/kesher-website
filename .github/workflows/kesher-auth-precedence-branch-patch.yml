name: Kesher NotebookLM Auth Precedence Branch Patch

on:
  push:
    paths:
      - .github/workflows/kesher-auth-precedence-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Apply narrow auth precedence and preflight repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          daily = Path('.github/workflows/kesher-daily-video.yml')
          short = Path('.github/workflows/kesher-short-v4.yml')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_if_after_step(path: Path, step_name: str, expression_body: str) -> None:
              lines = path.read_text(encoding='utf-8').splitlines()
              step = f'      - name: {step_name}'
              try:
                  index = lines.index(step)
              except ValueError as exc:
                  raise SystemExit(f'{path}: step not found: {step_name}') from exc
              if index + 1 >= len(lines) or not lines[index + 1].startswith('        if: '):
                  raise SystemExit(f'{path}: expected if line immediately after {step_name}')
              # Build the GitHub expression at runtime so this helper workflow does not evaluate it.
              lines[index + 1] = '        if: ' + '$' + '{{ ' + expression_body + ' }}'
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Fresh GitHub secret wins. Encrypted durable state is fallback only.
          for path in (daily, short):
              replace_once(
                  path,
                  '          if [ -s "$sealed_path" ]; then',
                  '          if [ -z "${NOTEBOOKLM_STORAGE_STATE_SECRET:-}" ] && [ -s "$sealed_path" ]; then',
              )

          # Read-only auth preflight must run before any NotebookLM provider operation.
          replace_if_after_step(
              daily,
              'NotebookLM read-only preflight',
              "github.event_name != 'pull_request' && (inputs.operation == 'preflight' || inputs.operation == 'full' || inputs.operation == 'generate' || inputs.operation == 'rebuild')",
          )
          replace_if_after_step(
              short,
              'NotebookLM read-only Short preflight',
              "github.event_name != 'pull_request' && (inputs.operation == 'preflight' || inputs.operation == 'full' || inputs.operation == 'generate' || inputs.operation == 'rebuild' || inputs.operation == 'derive' || inputs.operation == 'historical')",
          )

          # Run the new regression guard in both workflow-specific PR suites.
          replace_once(
              daily,
              'tests.test_video_reconcile tests.test_production_contract_v3 -v',
              'tests.test_video_reconcile tests.test_production_contract_v3 tests.test_notebooklm_auth_precedence -v',
          )
          replace_once(
              short,
              '            tests.test_v4_runtime_activation \\\n            -v',
              '            tests.test_v4_runtime_activation \\\n            tests.test_notebooklm_auth_precedence \\\n            -v',
          )

          test_path = Path('tests/test_notebooklm_auth_precedence.py')
          test_path.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\nDAILY = ROOT / ".github/workflows/kesher-daily-video.yml"\nSHORT = ROOT / ".github/workflows/kesher-short-v4.yml"\n\n\nclass NotebookLMAuthPrecedenceTests(unittest.TestCase):\n    def test_github_secret_precedes_durable_state(self):\n        guard = 'if [ -z "${NOTEBOOKLM_STORAGE_STATE_SECRET:-}" ] && [ -s "$sealed_path" ]; then'\n        for path in (DAILY, SHORT):\n            text = path.read_text(encoding="utf-8")\n            self.assertIn(guard, text, path)\n            self.assertNotIn('if [ -s "$sealed_path" ]; then', text, path)\n\n    def test_generation_paths_run_read_only_preflight(self):\n        daily = DAILY.read_text(encoding="utf-8")\n        short = SHORT.read_text(encoding="utf-8")\n        self.assertIn("inputs.operation == 'full' || inputs.operation == 'generate'", daily)\n        self.assertIn('scripts/kesher_daily_pipeline.py --preflight', daily)\n        self.assertIn("inputs.operation == 'full' || inputs.operation == 'generate'", short)\n        self.assertIn('scripts/kesher_short_pipeline_v4.py --preflight', short)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          python -m unittest tests.test_notebooklm_auth_precedence -v

          git config user.name 'Kesher Active Supervisor'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/kesher-daily-video.yml .github/workflows/kesher-short-v4.yml tests/test_notebooklm_auth_precedence.py
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Auth precedence repair already present.'
            exit 0
          fi
          git commit -m 'fix(kesher): prefer fresh NotebookLM auth state'
          git push origin HEAD:${GITHUB_REF_NAME}
