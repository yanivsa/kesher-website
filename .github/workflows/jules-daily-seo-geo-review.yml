name: Jules Daily Kesher SEO GEO Review

on:
  schedule:
    # 02:30 Israel time during daylight saving.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-daily-kesher-seo-geo-review
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if SEO/GEO review PR is already open
        id: backlog_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          title_pattern = re.compile(r"^\[jules-automerge\] Kesher SEO GEO review:", re.I)
          branch_pattern = re.compile(r"(?:^|[-_/])kesher-seo-geo-review(?:[-_/]|$)|(?:^|[-_/])seo-geo-review(?:[-_/]|$)", re.I)
          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if title_pattern.search(pr.get("title") or "")
              or branch_pattern.search((pr.get("head") or {}).get("ref") or "")
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")
          if blockers:
              print("Open SEO/GEO-review PR exists; no Jules session will be started.")
              print("\n".join(blockers[:20]))
          PY

      - name: Start Jules SEO/GEO review session
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Daily Kesher SEO and GEO review",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, or implementation choices. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue.\n\nOnce a plan is generated or auto-approved, execute it immediately; never restate the plan and ask 'may I proceed', 'does this look good', or any equivalent question. Forbid progress/status questions and AWAITING_USER_FEEDBACK at every point after plan generation or file modification. After any edit and successful validation, you must continue directly through current-main refresh/rebase, exact origin/main diff cleanup, commit, push, and one non-draft ready-for-review PR; branch name, commit message, approved prefix, code review, and submission are deterministic automation details and never user decisions. If cleanup/rebase cannot preserve the one-issue allowed file scope, require a true clean no-op with no changeSet/branch/commit/PR. Any submit/rebase/tool/API failure must be explicitly logged with the concrete failing step and remote state; it must not silently become FAILED or claim success. When recovery is safe, retry boundedly and continue; otherwise restore a clean workspace and finish as a clearly logged no-op/failure with no branch/commit/PR. If uncertainty remains, choose the smallest safe repo-consistent focused fix or finish a true no-op with no branch/commit/PR.\n\nA green command is not sufficient when the change introduces a new lint/compiler/React Hooks warning. Before opening the audit PR, you must run npm run build and npm run check, inspect their output, and resolve any new warning caused by the selected change. Specifically, when adding a field read inside useMemo/useEffect/useCallback, update the hook dependency list or refactor safely; never call a PR ready-for-review with a new missing-dependency warning.\n\nEvery SEO/GEO output PR must be ready-for-review and non-draft; before opening/updating it, run 'git diff --name-only origin/main...HEAD', revert all inherited/incidental/unreported files, and require the PR body file list to exactly match the final GitHub diff. A mismatch, unrelated CSS/mobile/content churn, or inability to clean the branch must produce a true no-op with no PR rather than a false-success draft.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nGoal: perform a recurring SEO and GEO / AI optimization review for the Kesher website. This is not an article-publishing task.\n\nRead first:\n- seo.md\n- geo.md\n- public/robots.txt\n- public/sitemap.xml\n- public/llms.txt\n- src/components/SEO/*\n- src/pages/Home/Home.tsx\n- src/pages/FAQ/FAQ.tsx\n- src/pages/Blog/*\n- src/data/posts.json\n\nInspect canonical URLs, meta titles/descriptions, Open Graph/Twitter tags, sitemap accuracy, robots AI-search policy, llms.txt / llms-full.txt availability, Schema.org structured data, blog article discoverability, service-page metadata, and AI-answer readiness for Hebrew queries about parenting guidance, couples counseling, ADHD parenting, and Ashdod/online service.\n\nFix at most ONE coherent SEO/GEO issue per run. Prefer high-impact technical correctness first: wrong canonical URLs, stale sitemap entries, missing real routes, broken llms-full.txt, missing Article/Service/Breadcrumb schema, or metadata that prevents service/blog pages from being represented independently. Do not do a full architecture migration unless it is small and safe. Do not invent credentials or unsupported claims.\n\nContent guardrail: Do not add, expand, promote, or re-introduce content about divorce (גירושין) or separation-as-breakup. Do not create new articles, sections, or copy that frame the service as divorce-related.\n\nRequired checks before PR:\n- Run npm run check.\n- If sitemap or llms files changed, verify they contain only real current routes/data.\n- If metadata/schema changed, explain the route-level impact.\n\nCreate one ready-for-review PR automatically only if a focused improvement was made. Do not create a draft PR. PR title must start with `[jules-automerge] Kesher SEO GEO review:` so the repository auto-merge workflow can validate and merge it without waiting for user approval. PR summary must include: SEO/GEO area reviewed, issue found, changed files, validation command, and remaining larger recommendations such as prerender/SSG if not handled.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          python3 - <<'PY'
          import json
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["prompt"] += "\n\nFinal live-duplicate gate: immediately before commit and again immediately before PR creation, fetch current origin/main and verify both that the chosen issue is still unfixed on current main and that `git diff --name-only origin/main...HEAD` is non-empty. If an equivalent fix merged while this session was running, or the remote diff has zero files, delete/reset the stale branch state and finish as a factual clean no-op with no changeSet, commit, push, or PR. A stale base, cached branch list, earlier plan, or successful local test must never justify a zero-file or duplicate PR. Log the superseding PR/commit when known."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions
