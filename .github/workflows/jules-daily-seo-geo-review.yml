name: Jules Daily Kesher SEO GEO Review

on:
  schedule:
    # 02:30 Israel time during daylight saving.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-daily-kesher-seo-geo-review
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if SEO/GEO review PR is already open
        id: backlog_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          pattern = re.compile(r"(seo|geo|ai optimization|llms|sitemap|robots|canonical|schema|structured data)", re.I)
          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if pattern.search((pr.get("title") or "") + "\n" + ((pr.get("head") or {}).get("ref") or "") + "\n" + (pr.get("body") or ""))
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")
          if blockers:
              print("Open SEO/GEO-review PR exists; no Jules session will be started.")
              print("\n".join(blockers[:20]))
          PY

      - name: Start Jules SEO/GEO review session
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Daily Kesher SEO and GEO review",
"prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, or implementation choices. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nGoal: perform a recurring SEO and GEO / AI optimization review for the Kesher website. This is not an article-publishing task.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT optimize for, add, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere in sitemaps, schema metadata, or SEO/GEO profiles. Preserve the canonical spelling already used in src/constants/siteConfig.ts and visible site copy.\n\nRead first:\n- public/robots.txt\n- public/sitemap.xml\n- public/llms.txt\n- src/components/SEO/*\n- src/pages/Home/Home.tsx\n- src/pages/FAQ/FAQ.tsx\n- src/pages/Blog/*\n- src/data/posts.json\n\nInspect canonical URLs, meta titles/descriptions, Open Graph/Twitter tags, sitemap accuracy, robots AI-search policy, llms.txt / llms-full.txt availability, Schema.org structured data, blog article discoverability, service-page metadata, and AI-answer readiness for Hebrew queries about parenting guidance, couples counseling, ADHD parenting, and Ashdod/online service.\n\nFix at most ONE coherent SEO/GEO issue per run. Prefer high-impact technical correctness first: wrong canonical URLs, stale sitemap entries, missing real routes, broken llms-full.txt, missing Article/Service/Breadcrumb schema, or metadata that prevents service/blog pages from being represented independently. Do not do a full architecture migration unless it is small and safe. Do not invent credentials or unsupported claims.\n\nRequired checks before PR:\n- Run npm run build.\n- If sitemap or llms files changed, verify they contain only real current routes/data.\n- If metadata/schema changed, explain the route-level impact.\n\nCreate one ready-for-review PR automatically only if a focused improvement was made. Do not create a draft PR. PR title must start with `[jules-automerge] Kesher SEO GEO review:` so the repository auto-merge workflow can validate and merge it without waiting for user approval. PR summary must include: SEO/GEO area reviewed, issue found, changed files, validation command, and remaining larger recommendations such as prerender/SSG if not handled.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          curl --fail-with-body -sS \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions
