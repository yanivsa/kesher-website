name: Kesher Publish Request
run-name: Kesher Publish (${{ inputs.action }}) - ${{ inputs.slot || 'today' }}

"on":
  workflow_dispatch:
    inputs:
      action:
        description: Publishing action to execute
        required: true
        default: daily
        type: choice
        options:
          - daily
          - run_now
          - resume
          - audit
          - repair
      slot:
        description: Publication slot (YYYY-MM-DD, defaults to today in Israel)
        required: false
        default: ""
        type: string
      topic_brief:
        description: Optional topic brief or user prompt
        required: false
        default: ""
        type: string
      idea_id:
        description: Optional unique idea ID / slug
        required: false
        default: ""
        type: string
      primary_keyword:
        description: Optional required Hebrew primary keyword
        required: false
        default: ""
        type: string
      article_json:
        description: Optional raw article JSON string
        required: false
        default: ""
        type: string
      target_slug:
        description: Optional target article slug
        required: false
        default: ""
        type: string
      stage_only:
        description: Stage PR and dispatch CI only; do not merge, deploy or generate media
        required: false
        default: false
        type: boolean
      dry_run:
        description: Validate without mutating repository, deploying, or creating media
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: kesher-publish-request
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python3 -m pip install -r scripts/requirements-article.txt
          npm --version

      - name: Configure Git author for Cloud Publisher
        run: |
          git config --global user.name "Kesher Automation Bot"
          git config --global user.email "bot@kesher.saharoni.com"

      - name: Execute Kesher Cloud Publisher
        id: publisher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          SLOT: ${{ inputs.slot }}
          TOPIC_BRIEF: ${{ inputs.topic_brief }}
          IDEA_ID: ${{ inputs.idea_id }}
          PRIMARY_KEYWORD: ${{ inputs.primary_keyword }}
          ARTICLE_JSON: ${{ inputs.article_json }}
          TARGET_SLUG: ${{ inputs.target_slug }}
          STAGE_ONLY: ${{ inputs.stage_only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "$SLOT" ]; then extra_args+=(--slot "$SLOT"); fi
          if [ -n "$TARGET_SLUG" ]; then extra_args+=(--target-slug "$TARGET_SLUG"); fi
          if [ -n "$TOPIC_BRIEF" ]; then extra_args+=(--topic-brief "$TOPIC_BRIEF"); fi
          if [ -n "$IDEA_ID" ]; then extra_args+=(--idea-id "$IDEA_ID"); fi
          if [ -n "$PRIMARY_KEYWORD" ]; then extra_args+=(--primary-keyword "$PRIMARY_KEYWORD"); fi
          if [ -n "$ARTICLE_JSON" ]; then extra_args+=(--article-json "$ARTICLE_JSON"); fi
          if [ "$STAGE_ONLY" = "true" ]; then extra_args+=(--stage-only); fi
          if [ "$DRY_RUN" = "true" ]; then extra_args+=(--dry-run); fi

          python3 scripts/kesher_cloud_publisher.py "$ACTION" "${extra_args[@]}"

      - name: Upload Publisher Result Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-publish-result-${{ github.run_id }}
          path: kesher-publish-result.json
          if-no-files-found: ignore
          retention-days: 7
