name: Kesher Publish Request
run-name: >-
  ${{ github.event_name == 'issues' && format('Kesher Publish from Issue #{0}: {1}', github.event.issue.number, github.event.issue.title) || format('Kesher Publish ({0}) - {1}', inputs.action, inputs.slot || 'today') }}

"on":
  workflow_dispatch:
    inputs:
      action:
        description: Publishing action to execute
        required: true
        default: daily
        type: choice
        options:
          - daily
          - run_now
          - resume
          - audit
          - repair
      slot:
        description: Publication slot (YYYY-MM-DD, defaults to today in Israel)
        required: false
        default: ""
        type: string
      topic_brief:
        description: Optional topic brief or user prompt
        required: false
        default: ""
        type: string
      idea_id:
        description: Optional unique idea ID / slug
        required: false
        default: ""
        type: string
      primary_keyword:
        description: Optional required Hebrew primary keyword
        required: false
        default: ""
        type: string
      article_json:
        description: Optional raw article JSON string
        required: false
        default: ""
        type: string
      target_slug:
        description: Optional target article slug
        required: false
        default: ""
        type: string
      stage_only:
        description: Stage PR and dispatch CI only; do not merge, deploy or generate media
        required: false
        default: false
        type: boolean
      dry_run:
        description: Validate without mutating repository, deploying, or creating media
        required: false
        default: false
        type: boolean
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: kesher-publish-request
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.repository == 'yanivsa/kesher-website' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'issues' &&
            (contains(github.event.issue.title, '[Publish]') ||
             contains(github.event.issue.title, '[publish]') ||
             contains(github.event.issue.title, 'publish:') ||
             contains(github.event.issue.title, 'הפעלת פרסום') ||
             contains(github.event.issue.labels.*.name, 'publish-request')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python3 -m pip install -r scripts/requirements-article.txt
          npm --version

      - name: Configure Git author for Cloud Publisher
        run: |
          git config --global user.name "Kesher Automation Bot"
          git config --global user.email "bot@kesher.saharoni.com"

      - name: Resolve execution parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_TOPIC_BRIEF: ${{ inputs.topic_brief }}
          INPUT_IDEA_ID: ${{ inputs.idea_id }}
          INPUT_PRIMARY_KEYWORD: ${{ inputs.primary_keyword }}
          INPUT_ARTICLE_JSON: ${{ inputs.article_json }}
          INPUT_TARGET_SLUG: ${{ inputs.target_slug }}
          INPUT_STAGE_ONLY: ${{ inputs.stage_only }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os, re

          event = os.environ.get("EVENT_NAME")
          if event == "workflow_dispatch":
              action = os.environ.get("INPUT_ACTION") or "daily"
              slot = os.environ.get("INPUT_SLOT") or ""
              topic_brief = os.environ.get("INPUT_TOPIC_BRIEF") or ""
              idea_id = os.environ.get("INPUT_IDEA_ID") or ""
              primary_keyword = os.environ.get("INPUT_PRIMARY_KEYWORD") or ""
              article_json = os.environ.get("INPUT_ARTICLE_JSON") or ""
              target_slug = os.environ.get("INPUT_TARGET_SLUG") or ""
              stage_only = os.environ.get("INPUT_STAGE_ONLY") or "false"
              dry_run = os.environ.get("INPUT_DRY_RUN") or "false"
              issue_number = ""
          else:
              title = (os.environ.get("ISSUE_TITLE") or "").strip()
              body = (os.environ.get("ISSUE_BODY") or "").strip()
              issue_number = str(os.environ.get("ISSUE_NUMBER") or "").strip()

              clean_topic = re.sub(r"^\[(?:publish|Publish)\]\s*", "", title, flags=re.IGNORECASE)
              clean_topic = re.sub(r"^publish:\s*", "", clean_topic, flags=re.IGNORECASE)
              clean_topic = re.sub(r"^הפעלת פרסום:\s*", "", clean_topic, flags=re.IGNORECASE).strip()

              action = "run_now"
              slot = ""
              topic_brief = clean_topic
              idea_id = ""
              primary_keyword = ""
              article_json = ""
              target_slug = ""
              stage_only = "false"
              dry_run = "false"

              for raw_line in body.splitlines():
                  line = raw_line.strip()
                  if ":" in line:
                      k, v = line.split(":", 1)
                      k = k.strip().lower()
                      v = v.strip()
                      if k == "action" and v in ("daily", "run_now", "resume", "audit", "repair"):
                          action = v
                      elif k == "slot":
                          slot = v
                      elif k in ("topic_brief", "topic", "brief") and v:
                          topic_brief = v
                      elif k in ("idea_id", "slug"):
                          idea_id = v
                      elif k in ("primary_keyword", "keyword"):
                          primary_keyword = v
                      elif k == "target_slug":
                          target_slug = v
                      elif k == "stage_only":
                          stage_only = "true" if v.lower() == "true" else "false"
                      elif k == "dry_run":
                          dry_run = "true" if v.lower() == "true" else "false"

          out_path = os.environ.get("GITHUB_OUTPUT")
          if out_path:
              with open(out_path, "a", encoding="utf-8") as out:
                  out.write(f"action={action}\n")
                  out.write(f"slot={slot}\n")
                  out.write(f"topic_brief={topic_brief}\n")
                  out.write(f"idea_id={idea_id}\n")
                  out.write(f"primary_keyword={primary_keyword}\n")
                  out.write(f"article_json={article_json}\n")
                  out.write(f"target_slug={target_slug}\n")
                  out.write(f"stage_only={stage_only}\n")
                  out.write(f"dry_run={dry_run}\n")
                  out.write(f"issue_number={issue_number}\n")
          print(f"Resolved publish params: action={action} topic_brief='{topic_brief}' issue={issue_number}")
          PY

      - name: Acknowledge issue trigger
        if: ${{ steps.params.outputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.params.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          TOPIC: ${{ steps.params.outputs.topic_brief }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "🚀 **מחזור פרסום ענני הופעל אוטונומית** עבור: **$TOPIC**
          מעקב ריצה: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"

      - name: Execute Kesher Cloud Publisher
        id: publisher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ steps.params.outputs.action }}
          SLOT: ${{ steps.params.outputs.slot }}
          TOPIC_BRIEF: ${{ steps.params.outputs.topic_brief }}
          IDEA_ID: ${{ steps.params.outputs.idea_id }}
          PRIMARY_KEYWORD: ${{ steps.params.outputs.primary_keyword }}
          ARTICLE_JSON: ${{ steps.params.outputs.article_json }}
          TARGET_SLUG: ${{ steps.params.outputs.target_slug }}
          STAGE_ONLY: ${{ steps.params.outputs.stage_only }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "$SLOT" ]; then extra_args+=(--slot "$SLOT"); fi
          if [ -n "$TARGET_SLUG" ]; then extra_args+=(--target-slug "$TARGET_SLUG"); fi
          if [ -n "$TOPIC_BRIEF" ]; then extra_args+=(--topic-brief "$TOPIC_BRIEF"); fi
          if [ -n "$IDEA_ID" ]; then extra_args+=(--idea-id "$IDEA_ID"); fi
          if [ -n "$PRIMARY_KEYWORD" ]; then extra_args+=(--primary-keyword "$PRIMARY_KEYWORD"); fi
          if [ -n "$ARTICLE_JSON" ]; then extra_args+=(--article-json "$ARTICLE_JSON"); fi
          if [ "$STAGE_ONLY" = "true" ]; then extra_args+=(--stage-only); fi
          if [ "$DRY_RUN" = "true" ]; then extra_args+=(--dry-run); fi

          python3 scripts/kesher_cloud_publisher.py "$ACTION" "${extra_args[@]}"

      - name: Upload Publisher Result Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-publish-result-${{ github.run_id }}
          path: kesher-publish-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report success and close issue
        if: ${{ always() && steps.params.outputs.issue_number != '' && steps.publisher.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.params.outputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          res_file = "kesher-publish-result.json"
          body = "### ✅ תהליך הפרסום הושלם בהצלחה!\n\n"
          if os.path.isfile(res_file):
              try:
                  with open(res_file, encoding="utf-8") as f:
                      data = json.load(f)
                  body += f"- **מאמר:** {data.get('article_url')}\n"
                  body += f"- **סרטון יוטיוב (16:9):** {data.get('long_video_url')}\n"
                  body += f"- **שורט יוטיוב (9:16):** {data.get('short_video_url')}\n"
                  body += f"- **סלאג:** `{data.get('slug')}`\n"
                  body += f"- **סטטוס חוזה:** `{'מאושר' if data.get('contract_complete') else 'לא מאומת'}`\n"
              except Exception as exc:
                  body += f"שגיאה בקריאת פרטי התוצאה: {exc}\n"
          else:
              body += "נכסי המדיה פורסמו בייצור.\n"

          issue_num = os.environ["ISSUE_NUM"]
          subprocess.run(["gh", "issue", "comment", issue_num, "--body", body], check=True)
          subprocess.run(["gh", "issue", "close", issue_num, "--reason", "completed"], check=True)
          PY

      - name: Report failure on issue
        if: ${{ always() && steps.params.outputs.issue_number != '' && steps.publisher.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.params.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "❌ **מחזור הפרסום נכשל.**
          לפרטים נוספים ראה את לוג הריצה: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
