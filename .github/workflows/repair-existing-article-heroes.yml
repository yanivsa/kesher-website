name: Repair Legacy Article Heroes

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/article-image-worker-v4.py"
      - ".github/workflows/repair-existing-article-heroes.yml"
      - "scripts/repair-existing-article-heroes.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-legacy-article-heroes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install trusted generator dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate unique verified replacements
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/repair-existing-article-heroes.py
          # Seed one additional verified owned fallback per category in the same
          # reviewable migration PR, so the new runtime is not deployed with an
          # empty managed fallback bank.
          python3 scripts/build-article-fallback-library.py --category all --batch-size 8
          npm run generate
          python3 .github/scripts/validate-article-images.py

      - name: Open repair PR when replacements exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No legacy hero repair is required."
            exit 0
          fi

          if gh pr list --repo "${REPO}" --state open --search 'head:automation/repair-legacy-article-heroes' --json number --jq 'length' | grep -qv '^0$'; then
            echo "A legacy hero repair PR is already open; refusing to create a duplicate."
            exit 0
          fi

          branch="automation/repair-legacy-article-heroes"
          git config user.name "Kesher Hero Repair"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "${branch}"
          git add -f --             src/data/posts.json             src/data/postSummaries.json             public/images/generated/blog             public/sitemap.xml             public/rss.xml             public/llms.txt             public/llms-full.txt
          git commit -m "fix(blog): replace legacy abstract article heroes"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"

          gh pr create             --repo "${REPO}"             --base main             --head "${branch}"             --title "fix(blog): replace legacy abstract article heroes"             --body "Generated by the trusted hero-repair migration. Every targeted legacy placeholder was replaced with a unique article-specific Gemini hero that passed the production pixel verifier and global image guard. The same run also seeds the managed fallback bank with one additional verified owned asset per category."
