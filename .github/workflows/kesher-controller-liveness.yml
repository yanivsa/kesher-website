name: Kesher Controller Liveness Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
    paths:
      - ".github/workflows/kesher-controller-liveness.yml"
      - "scripts/kesher_runtime/controller_liveness.py"
      - "tests/test_controller_liveness.py"
      - "scripts/kesher_runtime/delivery_preflight.py"
      - "tests/test_kesher_daily_delivery_preflight.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kesher-controller-liveness
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.repository == 'yanivsa/kesher-website' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Test read-only delivery preflight regressions
        if: ${{ github.event_name == 'pull_request' }}
        run: PYTHONPATH=. python3 -m unittest tests.test_kesher_daily_delivery_preflight

      - name: Audit daily article, source image and live lazy-player facade
        # Observer ONLY: no provider call, no state write, no extra cron.
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -u -m scripts.kesher_runtime.delivery_preflight --root . --live | tee /tmp/kesher-daily-preflight.txt
          {
            echo '### KESHER daily delivery: read-only status'
            echo 'Source image and live long-video facade only. Short and controller authority are NOT verified by this check.'
            echo '```json'
            grep '^KESHER_DAILY_PREFLIGHT=' /tmp/kesher-daily-preflight.txt | sed 's/^KESHER_DAILY_PREFLIGHT=//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Kesher Controller Liveness Watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PYTHONPATH=. python3 -u -m scripts.kesher_runtime.controller_liveness --audit
          else
            PYTHONPATH=. python3 -u -m scripts.kesher_runtime.controller_liveness --reconcile
          fi
