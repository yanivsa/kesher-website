name: Kesher Controller Liveness Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
    paths:
      - ".github/workflows/kesher-controller-liveness.yml"
      - "scripts/kesher_runtime/controller_liveness.py"
      - "tests/test_controller_liveness.py"
  workflow_dispatch:
    inputs:
      route:
        description: Normal liveness or read-only owner-approved GitHub audit
        required: false
        default: liveness
        type: choice
        options:
          - liveness
          - github_only_probe
          - github_only_prepare
          - github_only_live_probe
          - github_only_live
      reviewed_revision:
        description: Exact current main SHA for read-only probe or protected prepare
        required: false
        default: ""
        type: string
      epoch:
        description: Exact owner-reviewed Git-only epoch for protected preparation
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: kesher-controller-liveness
  cancel-in-progress: false

jobs:
  github_owner_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && (inputs.route == 'github_only_probe' || inputs.route == 'github_only_prepare') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 3
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read-only GitHub owner and provider readiness audit
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: python -m scripts.kesher_runtime.github_owner_readiness --reviewed-revision "$REVIEWED_REVISION"

  github_owner_prepare:
    # Existing protected environment requests a genuine GitHub reviewer.
    # PREPARED_NOT_LIVE never grants publication or provider dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.route == 'github_only_prepare' }}
    needs: github_owner_probe
    environment: kesher-cutover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 5
    steps:
      - name: Checkout immutable reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Protected Git-only ledger preparation (NOT production activation)
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
          OWNER_EPOCH: ${{ inputs.epoch }}
        run: |
          python -m scripts.kesher_runtime.github_only_owner_prepare \
            --reviewed-revision "$REVIEWED_REVISION" \
            --epoch "$OWNER_EPOCH"

  watchdog:
    if: ${{ github.repository == 'yanivsa/kesher-website' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.route != 'github_only_probe' && inputs.route != 'github_only_prepare' && inputs.route != 'github_only_live_probe' && inputs.route != 'github_only_live') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run Kesher Controller Liveness Watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PYTHONPATH=. python3 -u -m scripts.kesher_runtime.controller_liveness --audit
          else
            PYTHONPATH=. python3 -u -m scripts.kesher_runtime.controller_liveness --reconcile
          fi

  github_owner_live_probe:
    # Read-only diagnostic only. This intentionally reports BLOCKED and NEVER
    # requests protected approval or runs provider/YouTube mutation.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.route == 'github_only_live_probe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 3
    steps:
      - name: Checkout immutable main for LIVE readiness inspection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Diagnose exact GH-only LIVE blockers (read-only, no activation)
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: python -m scripts.kesher_runtime.github_only_live_readiness --reviewed-revision "$REVIEWED_REVISION"


  github_owner_live_inventory:
    # Read-only independent GitHub+NotebookLM+YouTube reconciliation BEFORE
    # requesting an approval of existing protected environment kesher-cutover.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.route == 'github_only_live' && inputs.reviewed_revision == github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    outputs:
      inventory_sha256: ${{ steps.readiness.outputs.inventory_sha256 }}
    env:
      NOTEBOOKLM_HOME: /tmp/kesher-ghonly-notebooklm
    steps:
      - name: Checkout immutable reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing NotebookLM and YouTube read-only clients
        run: |
          python -m pip install -r scripts/requirements-video-cloud.txt
          python -m pip install google-api-python-client==2.181.0 google-auth==2.40.3
      - name: Materialize authenticated NotebookLM profile without logging credentials
        env:
          NOTEBOOKLM_STORAGE_STATE_SECRET: ${{ secrets.NOTEBOOKLM_AUTH_JSON || secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
          NOTEBOOKLM_MASTER_TOKEN_SECRET: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          profile=Path(os.environ["NOTEBOOKLM_HOME"])/"profiles"/"default"
          profile.mkdir(parents=True,exist_ok=True)
          raw=os.environ.get("NOTEBOOKLM_STORAGE_STATE_SECRET","").strip()
          if not raw: raise SystemExit("GHONLY_AUTH_MISSING")
          state=json.loads(raw)
          if not isinstance(state,dict) or not state.get("cookies"): raise SystemExit("GHONLY_AUTH_INVALID")
          path=profile/"storage_state.json"
          path.write_text(json.dumps(state,separators=(",",":")),encoding="utf-8")
          path.chmod(0o600)
          master=os.environ.get("NOTEBOOKLM_MASTER_TOKEN_SECRET","").strip()
          if master:
              value=json.loads(master)
              required={"version","email","android_id","master_token"}
              if not isinstance(value,dict) or not all(value.get(k) for k in required):
                  raise SystemExit("GHONLY_MASTER_AUTH_INVALID")
              path=profile/"master_token.json"
              path.write_text(json.dumps(value,separators=(",",":")),encoding="utf-8")
              path.chmod(0o600)
          PY
      - name: Read-only full external task inventory and existing owner
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
          OWNER_EPOCH: ${{ inputs.epoch }}
        run: python -m scripts.kesher_runtime.github_only_live_activation preflight --reviewed-revision "$REVIEWED_REVISION" --epoch "$OWNER_EPOCH"

  github_owner_live:
    # A REAL reviewed deployment is required, not an Issue comment or verbal approval.
    # State is switched to PROTECTED_VERIFIED only after a second full live inventory,
    # immutable reviewed SHA, exact GitHub review receipt, and dual-ref CAS.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.route == 'github_only_live' && needs.github_owner_live_inventory.outputs.inventory_sha256 != '' }}
    needs: github_owner_live_inventory
    environment: kesher-cutover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      NOTEBOOKLM_HOME: /tmp/kesher-ghonly-notebooklm
    steps:
      - name: Checkout immutable reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned read-only provider clients
        run: |
          python -m pip install -r scripts/requirements-video-cloud.txt
          python -m pip install google-api-python-client==2.181.0 google-auth==2.40.3
      - name: Materialize NotebookLM profile for fresh protected inventory
        env:
          NOTEBOOKLM_STORAGE_STATE_SECRET: ${{ secrets.NOTEBOOKLM_AUTH_JSON || secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
          NOTEBOOKLM_MASTER_TOKEN_SECRET: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          profile=Path(os.environ["NOTEBOOKLM_HOME"])/"profiles"/"default"
          profile.mkdir(parents=True,exist_ok=True)
          raw=os.environ.get("NOTEBOOKLM_STORAGE_STATE_SECRET","").strip()
          if not raw: raise SystemExit("GHONLY_AUTH_MISSING")
          state=json.loads(raw)
          if not isinstance(state,dict) or not state.get("cookies"): raise SystemExit("GHONLY_AUTH_INVALID")
          path=profile/"storage_state.json"
          path.write_text(json.dumps(state,separators=(",",":")),encoding="utf-8")
          path.chmod(0o600)
          master=os.environ.get("NOTEBOOKLM_MASTER_TOKEN_SECRET","").strip()
          if master:
              value=json.loads(master)
              required={"version","email","android_id","master_token"}
              if not isinstance(value,dict) or not all(value.get(k) for k in required):
                  raise SystemExit("GHONLY_MASTER_AUTH_INVALID")
              path=profile/"master_token.json"
              path.write_text(json.dumps(value,separators=(",",":")),encoding="utf-8")
              path.chmod(0o600)
          PY
      - name: Verify genuine protected approval and atomically activate GH-only owner
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
          OWNER_EPOCH: ${{ inputs.epoch }}
          INVENTORY_SHA256: ${{ needs.github_owner_live_inventory.outputs.inventory_sha256 }}
        run: |
          python -m scripts.kesher_runtime.github_only_live_activation activate \
            --reviewed-revision "$REVIEWED_REVISION" \
            --epoch "$OWNER_EPOCH" \
            --inventory-sha256 "$INVENTORY_SHA256"
