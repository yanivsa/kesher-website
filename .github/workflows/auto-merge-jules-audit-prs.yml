name: Auto-merge Jules audit PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-jules-audit-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible Jules audit PRs after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$@"
          }

          api_status() {
            curl -sS \
              -o response.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$@"
          }

          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            python3 - <<'PY' > pr-numbers.txt
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              print(json.load(fh)["pull_request"]["number"])
          PY
          else
            api "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" > open-prs.json
            python3 - <<'PY' > pr-numbers.txt
          import json
          with open("open-prs.json", encoding="utf-8") as fh:
              for pr in json.load(fh):
                  print(pr["number"])
          PY
          fi

          while read -r number; do
            [ -n "${number}" ] || continue
            api "https://api.github.com/repos/${REPO}/pulls/${number}" > pr.json
            api "https://api.github.com/repos/${REPO}/pulls/${number}/files?per_page=100" > files.json
            sha="$(python3 -c 'import json; print(json.load(open("pr.json"))["head"]["sha"])')"
            api "https://api.github.com/repos/${REPO}/commits/${sha}/check-runs?per_page=100" > checks.json

            if ! python3 - <<'PY'
          import json, re, sys
          pr = json.load(open("pr.json"))
          files = [f["filename"] for f in json.load(open("files.json"))]
          checks = json.load(open("checks.json")).get("check_runs", [])
          title_match = re.search(r"^\[jules-automerge\] Kesher (content review|mobile review|SEO GEO review):", pr.get("title") or "", re.I)
          audit_kind = title_match.group(1).lower() if title_match else ""
          allowed_prefixes = ("src/", "public/", "docs/")
          if audit_kind == "seo geo review":
              allowed_prefixes += ("scripts/",)
          allowed = all(
              f == "README.md" or f.startswith(allowed_prefixes)
              for f in files
          )
          ci_passed = any(c.get("name") == "verify" and c.get("conclusion") == "success" for c in checks)
          eligible = (
              pr.get("state") == "open"
              and not pr.get("draft")
              and title_match
              and pr["base"]["ref"] == "main"
              and pr["head"]["repo"]["full_name"] == pr["base"]["repo"]["full_name"]
              and allowed
              and ci_passed
          )
          sys.exit(0 if eligible else 1)
          PY
            then
              echo "PR #${number} is not an eligible, CI-passing audit PR."
              continue
            fi

            merge_status="$(api_status -X PUT \
              -d '{"commit_title":"Auto-merge validated Jules audit","merge_method":"squash"}' \
              "https://api.github.com/repos/${REPO}/pulls/${number}/merge")"

            case "${merge_status}" in
              200|201)
                echo "Merged eligible audit PR #${number}."
                ;;
              405|409)
                echo "PR #${number} needs a refreshed branch/check run before merge; requesting update."
                update_status="$(api_status -X PUT \
                  -d '{}' \
                  "https://api.github.com/repos/${REPO}/pulls/${number}/update-branch")"
                if [ "${update_status}" != "202" ]; then
                  cat response.json
                  exit 1
                fi
                ;;
              *)
                cat response.json
                exit 1
                ;;
            esac
          done < pr-numbers.txt
