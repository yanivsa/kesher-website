name: Auto-merge Jules audit PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge-jules-audit-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible Jules audit PRs after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cat << 'EOF' > automerge.py
          import json, os, re, sys, urllib.request, urllib.error, urllib.parse

          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO")
          event_name = os.environ.get("EVENT_NAME")
          event_path = os.environ.get("GITHUB_EVENT_PATH")

          def api(method, endpoint, data=None, allow_codes=None):
              if allow_codes is None: allow_codes = []
              url = f"https://api.github.com{endpoint}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "python-urllib"
              }
              req_data = json.dumps(data).encode("utf-8") if data else None
              req = urllib.request.Request(url, data=req_data, headers=headers, method=method)
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read()
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  if e.code in allow_codes:
                      body = e.read()
                      try:
                          err_data = json.loads(body) if body else {}
                      except json.JSONDecodeError:
                          err_data = {"raw": body.decode(errors='replace')}
                      return e.code, err_data
                  body = e.read()
                  try:
                      err_data = json.loads(body) if body else {}
                  except json.JSONDecodeError:
                      err_data = {"raw": body.decode(errors='replace')}
                  print(f"API Error {e.code} on {method} {endpoint}: {err_data}", file=sys.stderr)
                  sys.exit(1)
              except Exception as e:
                  print(f"Network/Unexpected Error on {method} {endpoint}: {e}", file=sys.stderr)
                  sys.exit(1)

          def dispatch_deploy():
              dispatch_status, dispatch_resp = api(
                  "POST",
                  f"/repos/{repo}/actions/workflows/deploy.yml/dispatches",
                  data={"ref": "main"},
                  allow_codes=[204],
              )
              if dispatch_status != 204:
                  print(f"Deploy dispatch failed after merge: {dispatch_resp}", file=sys.stderr)
                  sys.exit(1)
              print("Deploy workflow dispatched for main after merge.")

          def main():
              pr_numbers = []
              if event_name == "pull_request_target":
                  if event_path and os.path.exists(event_path):
                      with open(event_path, "r", encoding="utf-8") as f:
                          event_data = json.load(f)
                          if "pull_request" in event_data:
                              pr_numbers.append(event_data["pull_request"]["number"])
              else:
                  status, prs = api("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
                  pr_numbers = [pr["number"] for pr in prs]

              for number in pr_numbers:
                  print(f"--- PR #{number} ---")
                  status, pr = api("GET", f"/repos/{repo}/pulls/{number}")
                  status, files_data = api("GET", f"/repos/{repo}/pulls/{number}/files?per_page=100")
                  files = [f["filename"] for f in files_data]

                  title_match = re.search(r"^\[jules-automerge\] Kesher (content review|mobile review|SEO GEO review):", pr.get("title") or "", re.I)
                  audit_kind = title_match.group(1).lower() if title_match else ""
                  allowed_prefixes = ("src/", "public/", "docs/")
                  if audit_kind == "seo geo review":
                      allowed_prefixes += ("scripts/",)
                  allowed = all(f == "README.md" or f.startswith(allowed_prefixes) for f in files)

                  forbidden_by_kind = {
                      "content review": {"public/sitemap.xml"},
                      "mobile review": {"public/sitemap.xml"},
                  }
                  forbidden = any(f.startswith(".github/workflows/") or f in forbidden_by_kind.get(audit_kind, set()) for f in files)

                  eligible = (
                      pr.get("state") == "open"
                      and not pr.get("draft")
                      and bool(title_match)
                      and pr.get("base", {}).get("ref") == "main"
                      and pr.get("head", {}).get("repo", {}).get("full_name") == pr.get("base", {}).get("repo", {}).get("full_name")
                      and allowed
                      and not forbidden
                  )

                  if not eligible:
                      print(f"PR #{number} is not an eligible audit PR.")
                      continue

                  sha = pr["head"]["sha"]
                  head_branch = pr["head"]["ref"]
                  base_ref = pr["base"]["ref"]

                  status, checks_data = api("GET", f"/repos/{repo}/commits/{sha}/check-runs?per_page=100")
                  checks = checks_data.get("check_runs", [])
                  verify_checks = [c for c in checks if c.get("name") == "verify"]
                  verify_checks.sort(key=lambda x: x.get("id", 0), reverse=True)
                  latest_verify = verify_checks[0] if verify_checks else None

                  v_status = latest_verify.get("status") if latest_verify else "missing"
                  v_conclusion = latest_verify.get("conclusion") if latest_verify else None

                  if v_status in ["queued", "in_progress"]:
                      print(f"PR #{number}: verify check is {v_status}. Waiting.")
                      continue

                  if v_conclusion == "success":
                      merge_status, merge_resp = api("PUT", f"/repos/{repo}/pulls/{number}/merge",
                          data={"commit_title": "Auto-merge validated Jules audit", "merge_method": "squash"},
                          allow_codes=[405, 409, 200, 201])
                      if merge_status in [200, 201]:
                          print(f"PR #{number}: Merged successfully.")
                          dispatch_deploy()
                          continue
                      print(f"PR #{number}: Merge failed with {merge_status}. Checking if branch is behind...")
                  elif v_conclusion is not None:
                      print(f"PR #{number}: verify check concluded with '{v_conclusion}'. Needs fix. Not merging.")
                      continue

                  # Compare branches
                  encoded_base = urllib.parse.quote(base_ref, safe="")
                  encoded_head = urllib.parse.quote(head_branch, safe="")
                  status, comp_data = api("GET", f"/repos/{repo}/compare/{encoded_base}...{encoded_head}", allow_codes=[404])
                  if status == 404:
                      print(f"PR #{number}: Could not compare branches.")
                      continue

                  compare_status = comp_data.get("status")

                  if compare_status in ["behind", "diverged"]:
                      print(f"PR #{number}: Branch is {compare_status}. Updating branch...")
                      update_status, update_resp = api("PUT", f"/repos/{repo}/pulls/{number}/update-branch", data={}, allow_codes=[422, 202])
                      if update_status == 202:
                          print(f"PR #{number}: Branch update status: {update_status} (Success). Dispatching CI for new commit...")
                          dispatch_status, dispatch_resp = api("POST", f"/repos/{repo}/actions/workflows/ci.yml/dispatches",
                              data={"ref": head_branch}, allow_codes=[204])
                          if dispatch_status == 204:
                              print(f"PR #{number}: CI dispatched successfully.")
                          else:
                              print(f"PR #{number}: Failed to dispatch CI: {dispatch_resp}", file=sys.stderr)
                              sys.exit(1)
                      elif update_status == 422:
                          print(f"PR #{number}: Branch update status: {update_status} (no-new-commits/no-op).")
                          if v_status in ["queued", "in_progress"]:
                              print(f"PR #{number}: verify check is {v_status}. Not dispatching duplicate CI.")
                          elif v_conclusion == "success":
                              print(f"PR #{number}: verify check is successful. Not dispatching duplicate CI.")
                          elif v_status == "missing" or v_conclusion == "action_required":
                              print(f"PR #{number}: verify check is action_required/missing. Dispatching CI...")
                              dispatch_status, dispatch_resp = api("POST", f"/repos/{repo}/actions/workflows/ci.yml/dispatches",
                                  data={"ref": head_branch}, allow_codes=[204])
                              if dispatch_status == 204:
                                  print(f"PR #{number}: CI dispatched successfully.")
                              else:
                                  print(f"PR #{number}: Failed to dispatch CI: {dispatch_resp}", file=sys.stderr)
                                  sys.exit(1)
                          else:
                              print(f"PR #{number}: verify check is {v_status} ({v_conclusion}). No CI dispatch required.")
                      else:
                          print(f"PR #{number}: Failed to update branch (Status {update_status}): {update_resp}")
                  else:
                      print(f"PR #{number}: Branch is {compare_status} (not behind).")
                      if v_status in ["queued", "in_progress"]:
                          print(f"PR #{number}: verify check is {v_status}. Not dispatching duplicate CI.")
                      elif v_conclusion == "success":
                          print(f"PR #{number}: verify check is successful. Not dispatching duplicate CI.")
                      elif v_status == "missing" or v_conclusion == "action_required":
                          print(f"PR #{number}: verify check is action_required/missing. Dispatching CI...")
                          dispatch_status, dispatch_resp = api("POST", f"/repos/{repo}/actions/workflows/ci.yml/dispatches",
                              data={"ref": head_branch}, allow_codes=[204])
                          if dispatch_status == 204:
                              print(f"PR #{number}: CI dispatched successfully.")
                          else:
                              print(f"PR #{number}: Failed to dispatch CI: {dispatch_resp}", file=sys.stderr)
                              sys.exit(1)
                      else:
                          print(f"PR #{number}: verify check is {v_status} ({v_conclusion}). No CI dispatch required.")

          if __name__ == "__main__":
              main()
          EOF
          python3 automerge.py
