name: Apply controller production-run filter

on:
  push:
    branches: [automation/kesher-controller-cutover-20260819]
    paths: [.github/workflows/apply-controller-production-run-filter.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/kesher-controller-cutover-20260819
      - name: Patch controller and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/kesher_content_controller.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def active_workflow_run(self, workflow: str) -> dict[str, Any] | None:\n        for run in self.workflow_runs(workflow):\n            if str(run.get("status") or "") in ACTIVE_RUN_STATUSES:\n                return run\n        return None\n'''
          new = '''    def active_workflow_run(\n        self, workflow: str, *, production_only: bool = False\n    ) -> dict[str, Any] | None:\n        for run in self.workflow_runs(workflow):\n            if production_only and str(run.get("event") or "") == "pull_request":\n                continue\n            if str(run.get("status") or "") in ACTIVE_RUN_STATUSES:\n                return run\n        return None\n'''
          if text.count(old) != 1:
              raise SystemExit('active_workflow_run replacement target not unique')
          text = text.replace(old, new)
          old_call = '        active_run = self.github.active_workflow_run(VIDEO_WORKFLOW)\n'
          new_call = '        active_run = self.github.active_workflow_run(VIDEO_WORKFLOW, production_only=True)\n'
          if text.count(old_call) != 1:
              raise SystemExit('video active-run call target not unique')
          path.write_text(text.replace(old_call, new_call), encoding='utf-8')

          test_path = Path('tests/test_kesher_content_controller.py')
          tests = test_path.read_text(encoding='utf-8')
          old_fake = '''    def active_workflow_run(self, workflow):\n        value = self.active.get(workflow)\n        return copy.deepcopy(value) if value else None\n'''
          new_fake = '''    def active_workflow_run(self, workflow, *, production_only=False):\n        value = self.active.get(workflow)\n        if value and production_only and value.get("event") == "pull_request":\n            return None\n        return copy.deepcopy(value) if value else None\n'''
          if tests.count(old_fake) != 1:
              raise SystemExit('FakeGitHub target not unique')
          tests = tests.replace(old_fake, new_fake)
          marker = '''    def test_active_video_run_is_resumed_not_duplicated(self):\n'''
          addition = '''    def test_video_pr_validation_does_not_block_production_dispatch(self):\n        gh = FakeGitHub()\n        gh.posts = [article()]\n        gh.active[controller.VIDEO_WORKFLOW] = {\n            "id": 66, "status": "in_progress", "event": "pull_request"\n        }\n        site = FakeSite(status=200, body="כותרת מאמר")\n        state, action = self.make(gh, site).tick()\n        self.assertEqual(action.kind, "dispatch_video")\n        self.assertEqual(state["status"], "video_running")\n        self.assertEqual(gh.dispatches[-1], (\n            controller.VIDEO_WORKFLOW, {"operation": "full"}\n        ))\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker not unique')
          tests = tests.replace(marker, addition + marker)
          test_path.write_text(tests, encoding='utf-8')
          PY
          python3 -m unittest tests.test_kesher_content_controller -v
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "Kesher Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kesher_content_controller.py tests/test_kesher_content_controller.py
          git diff --cached --check
          git commit -m "fix: ignore video PR checks in production controller"
          git push origin HEAD:automation/kesher-controller-cutover-20260819
