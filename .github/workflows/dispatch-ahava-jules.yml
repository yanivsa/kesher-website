name: Dispatch Ahava Jules

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/dispatch_ahava_jules.py"

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'chore: run Ahava Jules dispatcher' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dispatch Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: python3 .github/scripts/dispatch_ahava_jules.py
