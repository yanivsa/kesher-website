name: Kesher Weekend Video Scheduler

on:
  schedule:
    # Friday morning year-round: 08:00 UTC = 10:00 IST / 11:00 IDT.
    - cron: "0 8 * * 5"
    # Saturday probes. The gate dispatches the real video workflow beginning
    # one hour after Ashdod sunset.
    - cron: "0,15,30,45 15-19 * * 6"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-weekend-video-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the weekend video window is open
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Jerusalem")
          now = dt.datetime.now(tz)
          event = os.environ.get("EVENT_NAME", "")
          allow = False
          reason = "outside-weekend-window"

          if event == "workflow_dispatch":
              allow = True
              reason = "manual-dispatch"
          elif now.isoweekday() == 5:
              allow = True
              reason = f"friday-morning-{now:%H:%M}"
          elif now.isoweekday() == 6:
              url = (
                  "https://www.hebcal.com/zmanim?cfg=json&geonameid=295629"
                  f"&date={now.date().isoformat()}&sec=1"
              )
              req = urllib.request.Request(url, headers={"User-Agent": "Kesher-Automation/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              sunset_raw = (payload.get("times") or {}).get("sunset")
              if not sunset_raw:
                  raise SystemExit("Hebcal response is missing times.sunset")
              sunset = dt.datetime.fromisoformat(sunset_raw)
              if sunset.tzinfo is None:
                  sunset = sunset.replace(tzinfo=tz)
              else:
                  sunset = sunset.astimezone(tz)
              target = sunset + dt.timedelta(hours=1)
              # A 30-minute window tolerates normal cron delay. The video
              # pipeline itself is stateful and refuses a second daily attempt.
              allow = target <= now < target + dt.timedelta(minutes=30)
              reason = (
                  f"ashdod-sunset={sunset:%H:%M};target={target:%H:%M};"
                  f"now={now:%H:%M};allow={str(allow).lower()}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"allow={'true' if allow else 'false'}\n")
              out.write(f"reason={reason}\n")
          print(reason)
          PY

      - name: Dispatch the existing NotebookLM → Remotion → Jules → YouTube pipeline
        if: steps.gate.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/kesher-daily-video.yml/dispatches" \
            -f ref=main \
            -f 'inputs[operation]=full' \
            -f 'inputs[allow_additional_canary]=false'
          echo "Dispatched kesher-daily-video.yml operation=full"
