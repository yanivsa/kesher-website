name: Kesher Content Controller

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
    # The canonical 01:00 local daily entrypoint; GitHub applies Israel DST.
    - cron: "0 1 * * *"
      timezone: "Asia/Jerusalem"
  workflow_run:
    workflows:
      - Kesher Article Generation
      - Kesher Normalize Article PR
      - Kesher Trusted Article Image
      - Auto-merge Kesher article PRs
      - Deploy to Cloudflare Pages
      - Kesher Daily NotebookLM Video Overview
      - Kesher Daily Article Short V4
    types: [completed]
  push:
    branches: [main]
    paths:
      - "src/data/posts.json"
      - "src/data/postsRecent.json"
      - "public/images/blog/**"
  workflow_dispatch:
    inputs:
      canonical_tick:
        description: Run one Schema-6 controller tick after verified cutover
        required: false
        default: false
        type: boolean
      request_id:
        description: Immutable Master request ID (Schema-6 only)
        required: false
        default: ""
        type: string
      request_json:
        description: Provider-neutral Master intent JSON (Schema-6 only)
        required: false
        default: ""
        type: string
      child_workflow:
        description: Completed child workflow name
        required: false
        default: ""
        type: string
      child_run_id:
        description: Completed child workflow run ID
        required: false
        default: ""
        type: string
      child_conclusion:
        description: Completed child workflow conclusion
        required: false
        default: ""
        type: string
      source_slug:
        description: Optional authoritative article slug from child run
        required: false
        default: ""
        type: string
      slot:
        description: Optional authoritative publication slot (YYYY-MM-DD)
        required: false
        default: ""
        type: string
      source_sha:
        description: Optional authoritative article source content SHA256 from child run
        required: false
        default: ""
        type: string
      idea_id:
        description: Optional stable owner idea ID to enqueue (lowercase slug-like token)
        required: false
        default: ""
        type: string
      topic_brief:
        description: Owner-authored topic brief for the queued idea
        required: false
        default: ""
        type: string
      required_primary_keyword:
        description: Exact Hebrew Primary Keyword required for the queued article
        required: false
        default: ""
        type: string
      run_now:
        description: Start this owner idea immediately using the next free publication slot
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: kesher-content-controller
  cancel-in-progress: false

jobs:
  canonical_tick:
    # Keep a manual verification step available before enabling the existing cron.
    if: >-
      ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' &&
          vars.KESHER_CUTOVER_GATEWAY_URL != '' &&
          ((github.event_name == 'schedule' && vars.KESHER_SCHEMA6_SCHEDULE_ENABLED == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.canonical_tick &&
            inputs.request_json == '' && inputs.request_id == '' && !inputs.run_now)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
      checks: read
      id-token: write
    steps:
      - name: Checkout immutable trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install trusted observation dependencies
        run: python -m pip install requests==2.33.0 cryptography==50.0.1 PyYAML==6.0.2 -r scripts/requirements-article.txt
      - name: Reconcile article, Overview and Short through verified authority
        env:
          GH_TOKEN: ${{ github.token }}
          KESHER_CUTOVER_GATEWAY_URL: ${{ vars.KESHER_CUTOVER_GATEWAY_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m scripts.kesher_runtime.controller_entry --mode live

  master_intent:
    # Explicit owner intent ONLY. Never starts for schedule, push or legacy child events.
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.request_json != '' && inputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - name: Checkout immutable trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install observation requirements
        run: python3 -m pip install -r scripts/requirements-article.txt
      - name: Run verified Master intent via the single canonical outbox
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_JSON: ${{ inputs.request_json }}
          KESHER_CUTOVER_GATEWAY_URL: ${{ vars.KESHER_CUTOVER_GATEWAY_URL }}
        run: |
          set -euo pipefail
          export MASTER_INTENT_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=. python3 -m scripts.kesher_runtime.master_intent_entry --mode live --request-json "$REQUEST_JSON"

  control:
    # Sole pre-cutover daily authority; automatically fails closed once canonical state becomes Schema 6.
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && vars.KESHER_CUTOVER_GATEWAY_URL == '' && !inputs.canonical_tick }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip legacy path for explicit Master intent
        id: master_request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_json != '' }}
        run: echo "MASTER_INTENT_REQUIRES_INDEPENDENT_AUTHORITY_GATE"
      - name: Checkout trusted controller
        if: ${{ steps.master_request.outcome != 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Verify pre-cutover Schema-5 daily controller authority
        if: ${{ steps.master_request.outcome != 'success' }}
        id: bridge_admission
        env:
          GH_TOKEN: ${{ github.token }}
          KESHER_PRE_CUTOVER_DAILY_AUTHORITY: "true"
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name || inputs.child_workflow || '' }}
        run: python3 -m scripts.kesher_runtime.bridge_admission --controller

      - name: Set up Python
        if: ${{ steps.master_request.outcome != 'success' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install strict article image decoder
        if: ${{ steps.master_request.outcome != 'success' }}
        run: python3 -m pip install -r scripts/requirements-article.txt

      - name: Run Kesher Content Controller
        if: ${{ steps.master_request.outcome != 'success' }}
        id: content_controller
        # Leave time for the always() repair step if the content tick stalls.
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          KESHER_PRE_CUTOVER_DAILY_AUTHORITY: "true"
          KESHER_TRIGGER_EVENT: ${{ github.event_name }}
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name || inputs.child_workflow || '' }}
          KESHER_CHILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.child_run_id || '' }}
          KESHER_CHILD_CONCLUSION: ${{ github.event.workflow_run.conclusion || inputs.child_conclusion || '' }}
          KESHER_CHILD_SOURCE_SLUG: ${{ inputs.source_slug || '' }}
          KESHER_CHILD_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          KESHER_CHILD_SLOT: ${{ inputs.slot || '' }}
          KESHER_IDEA_ID: ${{ inputs.idea_id || '' }}
          KESHER_IDEA_TOPIC_BRIEF: ${{ inputs.topic_brief || '' }}
          KESHER_IDEA_REQUIRED_PRIMARY_KEYWORD: ${{ inputs.required_primary_keyword || '' }}
          KESHER_IDEA_RUN_NOW: ${{ inputs.run_now || false }}
        run: PYTHONPATH=. python3 -u scripts/kesher_content_controller_stabilized.py --report-json

      - name: Reconcile bounded controller code repair
        if: ${{ always() && steps.bridge_admission.outcome == 'success' && steps.master_request.outcome != 'success' }}
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          KESHER_PRE_CUTOVER_DAILY_AUTHORITY: "true"
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name || inputs.child_workflow || '' }}
          KESHER_CONTROLLER_OUTCOME: ${{ steps.content_controller.outcome }}
        run: PYTHONPATH=. python3 -u -m scripts.kesher_controller_repair

  nightly_daily:
    # Only this registered controller may own a nightly KESHER schedule.
    # Finish the incumbent controller tick before evaluating whether a new
    # daily article request is still needed; never bypass Schema-6 admission.
    needs: [canonical_tick, control]
    if: >-
      ${{ always() && github.repository == 'yanivsa/kesher-website' &&
          github.ref == 'refs/heads/main' && github.event_name == 'schedule' &&
          github.event.schedule == '0 1 * * *' &&
          (vars.KESHER_CUTOVER_GATEWAY_URL == '' ||
           vars.KESHER_SCHEMA6_SCHEDULE_ENABLED == 'true') &&
          needs.canonical_tick.result != 'failure' &&
          needs.control.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Ensure no duplicate KESHER daily request is in flight
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPO"]
          slot = datetime.now(ZoneInfo("Asia/Jerusalem")).date().isoformat()

          def get_json(endpoint):
              # Fail closed if GitHub cannot prove that a launch is safe.
              raw = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/{endpoint}"], text=True, timeout=45
              )
              return json.loads(raw)

          prs = get_json("pulls?state=open&per_page=100")
          candidates = [
              p["number"] for p in prs
              if (p.get("head") or {}).get("ref", "").startswith("content/kesher-")
              and f"Publication slot: `{slot}`" in (p.get("body") or "")
          ]
          runs = get_json("actions/workflows/kesher-publish-request.yml/runs?per_page=100")
          in_flight = [
              r["id"] for r in runs.get("workflow_runs", [])
              if r.get("status") in {"queued", "in_progress", "waiting", "requested", "pending"}
          ]

          allow = not candidates and not in_flight
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"allow={'true' if allow else 'false'}\n")
              out.write(f"slot={slot}\n")
          if not allow:
              print(f"::notice::Slot {slot} already underway; "
                    f"PRs={candidates} active publisher runs={in_flight}.")
          else:
              print(f"Slot {slot}: safe to dispatch existing canonical daily publisher.")
          PY

      - name: Dispatch KESHER canonical daily publishing request
        if: ${{ steps.guard.outputs.allow == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ steps.guard.outputs.slot }}
        run: |
          gh workflow run kesher-publish-request.yml --ref main \
            -f action=daily -f slot="$SLOT"
          echo "Dispatched canonical daily cycle for Israel slot $SLOT."
