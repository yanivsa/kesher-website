name: Kesher Content Controller

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Kesher Article Generation
      - Kesher Normalize Article PR
      - Kesher Trusted Article Image
      - Kesher Daily NotebookLM Video Overview
      - Kesher Daily Article Short V4
      - Deploy to Cloudflare Pages
    types: [completed]
  schedule:
    # Recovery heartbeat only. Normal successful progress is event-driven.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: kesher-content-controller
  cancel-in-progress: false

jobs:
  controller:
    # PR validation runs are irrelevant. Production child failures wake this
    # workflow only to persist a passive wait; actual retry is heartbeat-owned.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Run autonomous V5 reconciliation and watchdog tick
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          KESHER_CONTROLLER_STATE_REF: automation-state
          KESHER_TRIGGER_EVENT: ${{ github.event_name }}
          KESHER_CHILD_RUN_ID: ${{ github.event.workflow_run.id }}
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name }}
          KESHER_CHILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 -u scripts/kesher_content_controller_v5_runtime.py --report-json | tee /tmp/kesher-controller.json

      - name: Write concise controller summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/kesher-controller.json')
          payload = None
          if path.exists():
              raw = path.read_text(encoding='utf-8')
              markers = ('{\n  "action":', '{"action":')
              starts = [raw.find(marker) for marker in markers]
              starts = [start for start in starts if start >= 0]
              if starts:
                  try:
                      payload = json.loads(raw[min(starts):])
                  except json.JSONDecodeError:
                      payload = None

          if not isinstance(payload, dict):
              text = 'Controller V5 ran, but its structured state report could not be parsed.'
          else:
              state = payload.get('state') or {}
              article = state.get('article') or {}
              image = state.get('image') or {}
              long_video = state.get('long_video') or {}
              short = state.get('short') or {}
              deliverables = state.get('deliverables') or {}
              last_error = state.get('last_error') or {}
              takeover = state.get('direct_takeover_required') or {}
              delivery_complete = bool(
                  deliverables.get('article_url')
                  and deliverables.get('overview_youtube_url')
                  and deliverables.get('short_youtube_url')
                  and deliverables.get('short_portrait_verified') is True
              )
              text = (
                  f"Cycle: {state.get('cycle')}\n\n"
                  f"Status: {state.get('status')}\n\n"
                  f"Action: {payload.get('action')} — {payload.get('reason')}\n\n"
                  f"Article: {deliverables.get('article_url') or article.get('url') or article.get('pr_url') or 'pending'}\n\n"
                  f"Long video: {deliverables.get('overview_youtube_url') or long_video.get('item_id') or long_video.get('status') or 'pending'} (Overview)\n\n"
                  f"Short: {deliverables.get('short_youtube_url') or short.get('item_id') or short.get('status') or 'pending'}\n\n"
                  f"Short portrait verified: {deliverables.get('short_portrait_verified') is True}\n\n"
                  f"Delivery contract complete: {delivery_complete}\n\n"
                  f"Direct takeover required: {bool(takeover.get('required'))}"
                  + (f" — {takeover.get('stage')} / {takeover.get('slug')} / strike {takeover.get('strike')}" if takeover.get('required') else '')
                  + "\n\n"
                  f"Article attempts: {article.get('attempt_count', 0)}/3 | normalization: {article.get('normalization_status') or 'pending'}\n\n"
                  f"Image: {image.get('provider_id') or image.get('status') or 'pending'}\n\n"
                  f"Long attempts: {long_video.get('attempt_count', 0)} | Short derive attempts: {short.get('attempt_count', 0)}/4\n\n"
                  f"Last error: {last_error.get('code') or 'none'}"
              )

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Kesher Content Controller V5\n\n' + text + '\n')
          PY
