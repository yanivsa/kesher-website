name: Kesher canonical content controller
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: kesher-canonical-controller
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.repository == '__KESHER_RETIRED__' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.KESHER_CONTROLLER_TOKEN || github.token }}
    steps:
      - name: Checkout immutable main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install trusted authority admission dependencies
        run: python -m pip install PyYAML==6.0.2 -r scripts/requirements-article.txt
      - name: Reconcile only after verified authority admission
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.kesher_runtime.controller_entry --mode live
