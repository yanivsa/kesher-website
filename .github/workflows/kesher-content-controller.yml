name: Kesher Content Controller

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_run:
    workflows:
      - Kesher Article Generation
      - Kesher Normalize Article PR
      - Kesher Trusted Article Image
      - Auto-merge Kesher article PRs
      - Deploy to Cloudflare Pages
      - Kesher Daily NotebookLM Video Overview
      - Kesher Daily Article Short V4
    types: [completed]
  push:
    branches: [main]
    paths:
      - "src/data/posts.json"
      - "src/data/postsRecent.json"
      - "public/images/blog/**"
  workflow_dispatch:
    inputs:
      child_workflow:
        description: Completed child workflow name
        required: false
        default: ""
        type: string
      child_run_id:
        description: Completed child workflow run ID
        required: false
        default: ""
        type: string
      child_conclusion:
        description: Completed child workflow conclusion
        required: false
        default: ""
        type: string
      source_slug:
        description: Optional authoritative article slug from child run
        required: false
        default: ""
        type: string
      slot:
        description: Optional authoritative publication slot (YYYY-MM-DD)
        required: false
        default: ""
        type: string
      source_sha:
        description: Optional authoritative article source content SHA256 from child run
        required: false
        default: ""
        type: string
      idea_id:
        description: Optional stable owner idea ID to enqueue (lowercase slug-like token)
        required: false
        default: ""
        type: string
      topic_brief:
        description: Owner-authored topic brief for the queued idea
        required: false
        default: ""
        type: string
      required_primary_keyword:
        description: Exact Hebrew Primary Keyword required for the queued article
        required: false
        default: ""
        type: string
      run_now:
        description: Start this owner idea immediately using the next free publication slot
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: kesher-content-controller
  cancel-in-progress: false

jobs:
  control:
    # Sole pre-cutover daily authority; automatically fails closed once canonical state becomes Schema 6.
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Verify pre-cutover Schema-5 daily controller authority
        id: bridge_admission
        env:
          GH_TOKEN: ${{ github.token }}
          KESHER_PRE_CUTOVER_DAILY_AUTHORITY: "true"
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name || inputs.child_workflow || '' }}
        run: python3 -m scripts.kesher_runtime.bridge_admission --controller

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install strict article image decoder
        run: python3 -m pip install -r scripts/requirements-article.txt

      - name: Run Kesher Content Controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          KESHER_PRE_CUTOVER_DAILY_AUTHORITY: "true"
          KESHER_TRIGGER_EVENT: ${{ github.event_name }}
          KESHER_CHILD_WORKFLOW: ${{ github.event.workflow_run.name || inputs.child_workflow || '' }}
          KESHER_CHILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.child_run_id || '' }}
          KESHER_CHILD_CONCLUSION: ${{ github.event.workflow_run.conclusion || inputs.child_conclusion || '' }}
          KESHER_CHILD_SOURCE_SLUG: ${{ inputs.source_slug || '' }}
          KESHER_CHILD_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          KESHER_CHILD_SLOT: ${{ inputs.slot || '' }}
          KESHER_IDEA_ID: ${{ inputs.idea_id || '' }}
          KESHER_IDEA_TOPIC_BRIEF: ${{ inputs.topic_brief || '' }}
          KESHER_IDEA_REQUIRED_PRIMARY_KEYWORD: ${{ inputs.required_primary_keyword || '' }}
          KESHER_IDEA_RUN_NOW: ${{ inputs.run_now || false }}
        run: PYTHONPATH=. python3 -u scripts/kesher_content_controller_stabilized.py --report-json
