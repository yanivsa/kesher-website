name: Temporary Hebrew Sleep Rewrite

on:
  push:
    branches: [fix-israeli-hebrew-sleep-article]
    paths:
      - '.github/workflows/temp-hebrew-sleep-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-israeli-hebrew-sleep-article
      - name: Rewrite sleep article in natural Israeli Hebrew
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("src/data/posts.json")
          posts = json.loads(path.read_text(encoding="utf-8"))
          post = next(p for p in posts if (p.get("slug") or p.get("id")) == "sleep-needs-10-year-old")

          post["excerpt"] = "כמה שעות באמת צריך לישון בגיל 10, ומה עושים כשהילד נכנס למיטה בזמן אבל עדיין נרדם מאוחר? הנה 7 טעויות נפוצות בשגרת הערב — ומה אפשר לשנות כבר הערב."
          post["directAnswer"] = "ילדים בני 6–12 זקוקים בדרך כלל ל־9–12 שעות שינה ביממה. זה טווח, לא מספר קסם, ולכן כדאי להסתכל גם על שעת הקימה ועל התפקוד בבוקר ובמהלך היום."
          post["videoTitle"] = "ילד בן 10 לא נרדם? 7 טעויות ערב שכדאי להפסיק"
          post["shortTitle"] = "הילד במיטה אבל לא נרדם? תבדקו את המסך"
          post["shortHook"] = "הילד נכנס למיטה בזמן ועדיין לא נרדם? לפעמים הבעיה מתחילה דווקא שעה קודם."
          post["updatedAt"] = "2026-10-04"

          replacements = [
            ("לפי הנחיות האקדמיה האמריקאית לרפואת שינה (האקדמיה האמריקאית לרפואת שינה),", "לפי האקדמיה האמריקאית לרפואת שינה,"),
            ("זהו טווח, ולא מספר אחיד.", "זה טווח, לא מספר קסם."),
            ("הפתרון לא תמיד נעוץ בשליחתו המוקדמת למיטה, אלא בזיהוי ותיקון דפוסים סביב שעות הערב שיכולים להשפיע על איכות השינה.", "לא תמיד צריך פשוט להקדים את שעת השינה. לפעמים הבעיה נמצאת דווקא במה שקורה בשעה שלפני המיטה."),
            ("לפניכם 7 טעויות נפוצות בהתארגנות שגרת הערב שגורמות לילדכם להירדם מאוחר ולהתעורר עייף, ומה אפשר לעשות במקום.", "הנה 7 טעויות נפוצות בשגרת הערב — ומה אפשר לעשות אחרת."),
            ("טעות 1: קביעת שעת השינה לפי עייפות גלויה ולא לפי שעת הקימה", "טעות 1: מחכים שהילד “ייראה עייף”"),
            ("חשבו את שעת השינה אחורה משעת הקימה.", "מתחילים משעת הקימה ומחשבים אחורה."),
            ("קבעו שעה קבועה להתארגנות ללא קשר למידת העייפות.", "קבעו שעה קבועה להתחלת שגרת הערב, גם אם הילד עוד לא נראה עייף."),
            ("בדיקה עצמית:", "בדיקה מהירה:"),
            ("טעות 2: כיבוי המסכים קורה רק ברגע הכניסה למיטה", "טעות 2: מכבים את המסך רק כשנכנסים למיטה"),
            ("האקדמיה האמריקאית לרפואת ילדים (האקדמיה האמריקאית לרפואת ילדים)", "האקדמיה האמריקאית לרפואת ילדים"),
            ("שינויים דרסטיים בשעות השינה בסוף השבוע", "סוף השבוע הופך את השעון"),
            ("שעת השינה הופכת למשא ומתן יומי", "כל ערב מתחיל משא ומתן מחדש"),
            ("עימותים וקונפליקטים גדולים ממש לפני כיבוי אורות", "שומרים את כל העצבים לרגע לפני השינה"),
            ("סביבת השינה צריכה להישאר ניטרלית.", "את הוויכוחים והמשימות ה“נפיצות” עדיף להשאיר מחוץ לזמן השינה."),
            ("הנחה שילד עייף מדי יירדם מיד (וללא התחשבות בקשיי קשב וריכוז)", "מניחים שאם הילד ממש עייף — הוא פשוט יירדם"),
            ("אל תביאו למצב של עייפות יתר. הילד זקוק לזמן מעבר ארוך בין פעילות למנוחה. השגרה צריכה לכלול פעולות מרגיעות.", "לא מחכים לקריסה. בונים מעבר הדרגתי מפעילות למנוחה: מסכים נגמרים, האורות נרגעים והפעילות נהיית שקטה יותר."),
            ("התעלמות מקושי מתמשך בשינה והימנעות מבדיקה רפואית", "מניחים ש“ככה הוא” ולא בודקים קושי מתמשך"),
            ("קופסה מעשית: שגרת ערב לילד בן 10 — 45–60 דקות", "שגרת ערב פשוטה לילד בן 10: 45–60 דקות"),
            ("שינוי דפוסים אלו דורש זמן ועקביות. המטרה היא לבסס מסגרת שתאפשר לילד שלכם לסיים את היום ברוגע, ולקום בבוקר עם אנרגיות חדשות.", "לא צריך להפוך את הבית למחנה אימונים. המטרה היא ליצור רצף די צפוי: הילד יודע מה קורה עכשיו, מה בא אחר כך, ומתי היום באמת נגמר."),
            ("אם הערבים עדיין הופכים לשדה קרב,", "אם כל ערב עדיין הופך למאבק,"),
            ("הצרכים הספציפיים שלו, ולבנות שגרה שמותאמת במדויק למציאות שלכם, כדי להחזיר את השקט.", "איפה בדיוק נתקעים, ולבנות שגרת ערב שמתאימה למשפחה שלכם — לא למשפחה תיאורטית באינטרנט."),
          ]

          text = post["content"]
          for old, new in replacements:
              text = text.replace(old, new)
          post["content"] = text
          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: improve sleep article Hebrew"
          git push origin HEAD:fix-israeli-hebrew-sleep-article
