name: Kesher Article Generation
run-name: Kesher Article ${{ inputs.slot || 'repo-trigger' }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Israel publication date (YYYY-MM-DD)
        required: true
        type: string
      topic_brief:
        description: Optional authoritative topic brief supplied by the repository owner
        required: false
        default: ""
        type: string
      test_mode:
        description: Authorized test — bypass same-date article/PR guard and isolate Jules session
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: kesher-article-generation-${{ github.event_name }}-${{ inputs.slot || github.sha }}
  cancel-in-progress: false

jobs:
  generate:
    # Bounded manual emergency bridge; explicitly retired by coordinated cutover.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KESHER_ARTICLE_RESULT_PATH: ${{ github.workspace }}/.kesher-article-result/result.json
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Refuse manual article bridge after cutover exclusion begins
        id: bridge_admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.kesher_runtime.bridge_admission

      - name: Set up Python for the reviewed article runner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install publication catalog reader dependency
        run: python -m pip install requests==2.33.0

      - name: Resolve publication slot and explicit test mode
        shell: bash
        env:
          DISPATCH_SLOT: ${{ inputs.slot }}
          DISPATCH_TOPIC_BRIEF: ${{ inputs.topic_brief }}
          DISPATCH_TEST_MODE: ${{ inputs.test_mode }}
        run: |
          set -euo pipefail
          brief_file="$GITHUB_WORKSPACE/.kesher-topic-brief.txt"
          : > "$brief_file"
          slot="$DISPATCH_SLOT"
          test_mode="${DISPATCH_TEST_MODE:-false}"
          trigger="workflow-dispatch"
          printf '%s' "${DISPATCH_TOPIC_BRIEF:-}" > "$brief_file"
          if ! [[ "$slot" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid Kesher article slot: $slot" >&2
            exit 1
          fi
          echo "KESHER_ARTICLE_SLOT=$slot" >> "$GITHUB_ENV"
          echo "KESHER_TEST_MODE=$test_mode" >> "$GITHUB_ENV"
          echo "KESHER_ARTICLE_TOPIC_BRIEF_FILE=$brief_file" >> "$GITHUB_ENV"
          echo "Resolved slot=$slot test_mode=$test_mode trigger=$trigger topic_brief_bytes=$(wc -c < "$brief_file")"

      - name: Run exactly one autonomous Jules article text attempt with evidence contract
        id: article_worker
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KESHER_ARTICLE_RESULT_PATH")"
          python3 -u scripts/jules_article_runner_v4.py --slot "$KESHER_ARTICLE_SLOT"

      - name: Persist structured article attempt result
        if: ${{ always() && steps.bridge_admission.outcome == 'success' && hashFiles('.kesher-article-result/result.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kesher-article-result-${{ github.run_id }}
          path: .kesher-article-result/result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Close explicit-test article PR to prevent same-date collision
        if: ${{ always() && steps.bridge_admission.outcome == 'success' && env.KESHER_TEST_MODE == 'true' && hashFiles('.kesher-article-result/result.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_url="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ['KESHER_ARTICLE_RESULT_PATH']).read_text(encoding='utf-8'))
          print(str(payload.get('pr_url') or '').strip())
          PY
          )"
          if [ -z "$pr_url" ]; then
            echo "No test PR was created; nothing to close."
            exit 0
          fi
          case "$pr_url" in
            https://github.com/${{ github.repository }}/pull/*) ;;
            *) echo "Refusing to close unexpected PR URL: $pr_url" >&2; exit 1 ;;
          esac
          pr_number="${pr_url##*/}"
          gh api --method PATCH "repos/${{ github.repository }}/pulls/$pr_number" -f state=closed >/dev/null
          echo "Closed explicit-test PR #$pr_number to keep production source identity unique."

      - name: Fail workflow when the article worker failed
        if: ${{ steps.article_worker.outcome == 'failure' }}
        run: |
          echo "The single article text worker attempt failed; the controller owns retry/backoff." >&2
          exit 1

      - name: Notify canonical Kesher Content Controller on completion
        if: ${{ always() && steps.bridge_admission.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.test_mode != true }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_WORKFLOW: ${{ github.workflow }}
          CHILD_RUN_ID: ${{ github.run_id }}
          CHILD_CONCLUSION: ${{ job.status }}
          SLOT: ${{ inputs.slot || '' }}
        run: |
          gh workflow run kesher-content-controller.yml \
            --ref main \
            -f child_workflow="$CHILD_WORKFLOW" \
            -f child_run_id="$CHILD_RUN_ID" \
            -f child_conclusion="$CHILD_CONCLUSION" \
            -f slot="$SLOT" || echo "::warning::Controller wake-up notification failed; fallback schedule/workflow_run will reconcile."
