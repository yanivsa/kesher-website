name: Kesher Article Generation
run-name: Kesher Article ${{ inputs.slot }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Israel publication date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: kesher-article-generation-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      KESHER_ARTICLE_RESULT_PATH: ${{ github.workspace }}/.kesher-article-result/result.json
    steps:
      - name: Checkout current main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          persist-credentials: false

      - name: Run exactly one autonomous Jules article text attempt
        id: article_worker
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KESHER_ARTICLE_RESULT_PATH")"
          python3 -u scripts/jules_article_runner_v3.py --slot "${{ inputs.slot }}"

      - name: Persist structured article attempt result
        if: ${{ always() && hashFiles('.kesher-article-result/result.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kesher-article-result-${{ github.run_id }}
          path: .kesher-article-result/result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Fail workflow when the article worker failed
        if: ${{ steps.article_worker.outcome == 'failure' }}
        run: |
          echo "The single article text worker attempt failed; the controller owns retry/backoff." >&2
          exit 1
