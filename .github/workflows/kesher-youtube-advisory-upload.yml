name: Kesher YouTube Advisory Upload Continuation

on:
  workflow_run:
    workflows:
      - Kesher Daily NotebookLM Video Overview
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-youtube-advisory-upload
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KESHER_STATE_DIR: ${{ github.workspace }}/.kesher-video-state

    steps:
      - name: Checkout current main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned upload dependency
        run: python -m pip install requests==2.32.5

      - name: Restore state from triggering video run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$KESHER_STATE_DIR"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .name == "kesher-video-state")] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "Triggering video run has no durable kesher-video-state artifact." >&2
            exit 1
          fi
          archive="$(mktemp /tmp/kesher-video-state.XXXXXX.zip)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
          unzip -oq "$archive" -d "$KESHER_STATE_DIR"
          test -s "$KESHER_STATE_DIR/state.json"
          echo "Restored state artifact ${artifact_id} from run ${SOURCE_RUN_ID}."

      - name: Continue to YouTube regardless of Jules quality decision
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u scripts/kesher_youtube_advisory_upload.py

      - name: Persist authoritative post-upload state
        if: ${{ always() && hashFiles('.kesher-video-state/**') != '' }}
        id: persist_state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kesher-video-state
          path: ${{ env.KESHER_STATE_DIR }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

      - name: Keep only the newest durable state artifact
        if: ${{ always() && steps.persist_state.outputs.artifact-id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STATE_ARTIFACT_ID: ${{ steps.persist_state.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=kesher-video-state&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' \
            | while read -r artifact_id; do
                if [ "$artifact_id" != "$CURRENT_STATE_ARTIFACT_ID" ]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                fi
              done
