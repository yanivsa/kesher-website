name: Owner build KESHER article 20261007

on:
  push:
    branches:
      - owner/kesher-assets-20261007
    paths:
      - '.github/workflows/owner-build-article-20261007.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository == 'yanivsa/kesher-website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: owner/kesher-assets-20261007
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Insert exact article and validate identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload_path=Path('.owner-article-20261007.json')
          post=json.loads(payload_path.read_text(encoding='utf-8'))
          old='/images/generated/blog/gottman-perpetual-problems-69-percent.jpg'
          oldsrc='local://public/images/generated/blog/gottman-perpetual-problems-69-percent.jpg'
          if post.get('image') == old and post.get('imageSourceUrl') == oldsrc:
              post['image']='/images/generated/blog/couples-communication-distance.jpg'
              post['imageSourceUrl']='local://public/images/generated/blog/couples-communication-distance.jpg'
          elif post.get('image') != '/images/generated/blog/couples-communication-distance.jpg':
              raise SystemExit('ARTICLE_IMAGE_GUARD_REFUSED')
          posts_path=Path('src/data/posts.json')
          posts=json.loads(posts_path.read_text(encoding='utf-8'))
          required={'id','slug','title','excerpt','content','date','category','tags','author','image','directAnswer','evidence','videoTitle','shortTitle','shortHook'}
          missing=sorted(required-set(post))
          if missing:
              raise SystemExit(f'ARTICLE_REQUIRED_FIELDS_MISSING {missing}')
          if post['date'] != '2026-10-07' or post['id'] != post['slug']:
              raise SystemExit('ARTICLE_IDENTITY_INVALID')
          if any(p.get('id') == post['id'] or p.get('slug') == post['slug'] for p in posts):
              raise SystemExit('ARTICLE_DUPLICATE_IDENTITY')
          same_date=[p.get('id') for p in posts if p.get('date') == post['date']]
          if same_date:
              raise SystemExit(f'ARTICLE_DATE_ALREADY_PUBLISHED {same_date}')
          image=post['image']
          image_path=Path('public') / image.removeprefix('/')
          if not image_path.is_file() or image_path.stat().st_size < 30000:
              raise SystemExit(f'ARTICLE_IMAGE_INVALID {image_path}')
          if any(p.get('image') == image for p in posts):
              raise SystemExit(f'ARTICLE_IMAGE_ALREADY_REFERENCED {image}')
          posts.insert(0, post)
          posts_path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'ARTICLE_INSERTED slug={post["slug"]} title={post["title"]} image={image}')
          PY
          npm ci --no-audit --no-fund
          npm run generate
          node scripts/validate-content.cjs
          python3 .github/scripts/validate-article-images.py
          git diff --check
      - name: Remove owner scaffolding and publish clean content commit
        run: |
          set -euo pipefail
          rm -f .owner-article-20261007.json .owner-post-schema.json
          rm -f .github/workflows/owner-inspect-post-schema-20261007.yml
          rm -f .github/workflows/owner-patch-article-image-20261007.yml
          rm -f .github/workflows/owner-build-article-20261007.yml
          git config user.name 'KESHER Owner Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'content(kesher): publish recurring-arguments guide for Oct 7'
          git push origin HEAD:owner/kesher-assets-20261007
