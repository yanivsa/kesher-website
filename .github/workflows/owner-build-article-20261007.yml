name: Owner build KESHER article 20261007

on:
  push:
    branches:
      - owner/kesher-assets-20261007
    paths:
      - '.github/workflows/owner-build-article-20261007.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository == 'yanivsa/kesher-website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: owner/kesher-assets-20261007
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Insert exact article and validate identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          payload_path=Path('.owner-article-20261007.json')
          post=json.loads(payload_path.read_text(encoding='utf-8'))
          posts_path=Path('src/data/posts.json')
          posts=json.loads(posts_path.read_text(encoding='utf-8'))
          required={'id','slug','title','excerpt','content','date','category','tags','author','image','directAnswer','evidence','videoTitle','shortTitle','shortHook'}
          missing=sorted(required-set(post))
          if missing:
              raise SystemExit(f'ARTICLE_REQUIRED_FIELDS_MISSING {missing}')
          if post['date'] != '2026-10-07' or post['id'] != post['slug']:
              raise SystemExit('ARTICLE_IDENTITY_INVALID')
          if any(p.get('id') == post['id'] or p.get('slug') == post['slug'] for p in posts):
              raise SystemExit('ARTICLE_DUPLICATE_IDENTITY')
          same_date=[p.get('id') for p in posts if p.get('date') == post['date']]
          if same_date:
              raise SystemExit(f'ARTICLE_DATE_ALREADY_PUBLISHED {same_date}')

          core_path=Path('.github/scripts/article-image-worker.py')
          spec=importlib.util.spec_from_file_location('kesher_article_image_worker', core_path)
          core=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=core
          spec.loader.exec_module(core)
          used_paths={str(p.get('image') or '') for p in posts}
          used_pixels=set()
          for p in posts:
              image=str(p.get('image') or '')
              if not image.startswith('/images/'):
                  continue
              fp=Path('public')/image.lstrip('/')
              if fp.is_file():
                  try: used_pixels.add(core.image_pixel_sha256(fp.read_bytes()))
                  except Exception: pass
          selected=None
          # Direct-takeover recovery: search every local image, while retaining the
          # existing validator plus path/pixel dedup gates. This fixes the recurring
          # false exhaustion caused by limiting recovery to generated/blog only.
          allowed={'.jpg','.jpeg','.png','.webp'}
          for fp in sorted(Path('public/images').rglob('*')):
              if not fp.is_file() or fp.suffix.lower() not in allowed or fp.stat().st_size < 30000:
                  continue
              rel='/' + fp.relative_to('public').as_posix()
              if rel in used_paths:
                  continue
              data=fp.read_bytes()
              try:
                  core.validate_candidate(data)
                  pixels=core.image_pixel_sha256(data)
              except Exception:
                  continue
              if pixels in used_pixels:
                  continue
              selected=(rel, fp)
              break
          if not selected:
              raise SystemExit('ARTICLE_NO_UNIQUE_VALID_LOCAL_HERO_AVAILABLE')
          image, image_path=selected
          post['image']=image
          post['imageProvider']='Local'
          post['imageSourceUrl']='local://public/' + image.lstrip('/')
          post['imageIsFallback']=True
          if not str(post.get('imageAlt') or '').strip():
              post['imageAlt']='זוג בשיחה רגועה שממחישה יציאה מדפוס של ריבים חוזרים בזוגיות'
          posts.insert(0, post)
          posts_path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'ARTICLE_INSERTED slug={post["slug"]} title={post["title"]} image={image}')
          PY
          npm ci --no-audit --no-fund
          npm run generate
          node scripts/validate-content.cjs
          python3 .github/scripts/validate-article-images.py
          git diff --check
      - name: Remove owner scaffolding and publish clean content commit
        run: |
          set -euo pipefail
          rm -f .owner-article-20261007.json .owner-post-schema.json
          rm -f .github/workflows/owner-inspect-post-schema-20261007.yml
          rm -f .github/workflows/owner-patch-article-image-20261007.yml
          rm -f .github/workflows/owner-build-article-20261007.yml
          git config user.name 'KESHER Owner Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'content(kesher): publish recurring-arguments guide for Oct 7'
          git push origin HEAD:owner/kesher-assets-20261007
