name: Deploy Preferred Sources Preview

on:
  push:
    branches:
      - preferred-sources-preview

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_GTM_CONTAINER_ID: disabled
    steps:
      - name: Clone preview branch
        run: git clone --depth=1 --branch preferred-sources-preview https://github.com/${GITHUB_REPOSITORY}.git .

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build preview
        run: npm run build

      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.100.0
          command: pages deploy dist --project-name=kesher-website --branch=preferred-sources-preview
