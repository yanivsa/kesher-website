name: OpenClaw Recovery Controller

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-offline-boot-repair.yml
      - .github/workflows/openclaw-recovery-controller.yml
      - scripts/openclaw_recovery_controller.sh
      - scripts/openclaw_publish_status.sh
      - scripts/openclaw_offline_mount_repair_cloudflare.sh
      - scripts/openclaw_local_proof.sh
      - scripts/oci_openclaw_helper_local_proof.py

permissions:
  actions: write
  contents: write
  issues: write
  statuses: write

concurrency:
  group: openclaw-recovery-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Inspect latest OpenClaw recovery and publish durable status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_CONTROLLER_FORCE_DISPATCH: ${{ github.event_name == 'push' && '1' || '0' }}
          OPENCLAW_STATUS_ISSUE_NUMBER: '465'
          OPENCLAW_STATUS_BRANCH: ops/openclaw-status
          OPENCLAW_STATUS_PATH: openclaw-status.json
        run: |
          set -euo pipefail
          bash -n scripts/openclaw_publish_status.sh
          bash -n scripts/openclaw_recovery_controller.sh
          bash scripts/openclaw_recovery_controller.sh
