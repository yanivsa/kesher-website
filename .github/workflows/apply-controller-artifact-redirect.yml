name: Apply controller artifact redirect fix

on:
  push:
    branches: [fix/kesher-controller-artifact-redirect-20260819]
    paths: [.github/workflows/apply-controller-artifact-redirect.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/kesher-controller-artifact-redirect-20260819
      - name: Apply and verify patch
        run: |
          set -euo pipefail
          python3 scripts/_apply_controller_artifact_redirect_patch.py
          python3 -m unittest tests.test_kesher_content_controller tests.test_controller_artifact_download -v
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "Kesher Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kesher_content_controller.py
          git diff --cached --check
          git commit -m "fix: strip auth on artifact blob redirect"
          git push origin HEAD:fix/kesher-controller-artifact-redirect-20260819
