name: Kesher explicit production cutover
on:
  workflow_dispatch:
    inputs:
      epoch:
        description: Independently approved cutover epoch
        required: true
        type: string
      reviewed_revision:
        description: Independently reviewed exact current main SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: kesher-production-cutover
  cancel-in-progress: false
jobs:
  readiness:
    # Read-only checks before a protected owner approval is even requested.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check existing gateway health and pinned epoch before owner review
        shell: python
        env:
          GATEWAY_URL: ${{ vars.KESHER_CUTOVER_GATEWAY_URL }}
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
          ACTUAL_REVISION: ${{ github.sha }}
          CUTOVER_EPOCH: ${{ inputs.epoch }}
        run: |
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          
          def deny(reason):
              print("KESHER_CUTOVER_APPROVAL_NOT_READY: " + reason, file=sys.stderr)
              raise SystemExit(1)
          
          reviewed = os.environ.get("REVIEWED_REVISION", "")
          epoch = os.environ.get("CUTOVER_EPOCH", "")
          if not re.fullmatch(r"[0-9a-f]{40}", reviewed) or reviewed != os.environ.get("ACTUAL_REVISION"):
              deny("REVIEWED_MAIN_SHA_MISMATCH")
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", epoch):
              deny("EPOCH_MISSING_OR_INVALID")
          origin = os.environ.get("GATEWAY_URL", "").strip()
          if not origin:
              deny("KESHER_CUTOVER_GATEWAY_URL_UNCONFIGURED")
          url = urllib.parse.urlsplit(origin)
          if (url.scheme != "https" or not url.hostname or url.username or url.password
                  or url.path not in ("", "/") or url.query or url.fragment):
              deny("PINNED_HTTPS_GATEWAY_REQUIRED")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          try:
              req = urllib.request.Request(origin.rstrip("/") + "/healthz", method="GET")
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=15) as res:
                  if res.status != 200:
                      deny("GATEWAY_HEALTH_NON_200")
                  payload = json.loads(res.read(4096))
          except (OSError, ValueError) as exc:
              deny("GATEWAY_HEALTH_UNREACHABLE_" + type(exc).__name__)
          if (not isinstance(payload, dict) or payload.get("service") != "kesher-cutover"
                  or payload.get("epoch") != epoch or payload.get("reviewed_revision") != reviewed
                  or not all(re.fullmatch(r"[0-9a-f]{64}", str(payload.get(x, "")))
                              for x in ("code_sha256", "policy_sha256"))):
              deny("GATEWAY_HEALTH_REVISION_OR_EPOCH_MISMATCH")
          print("KESHER_CUTOVER_APPROVAL_PREFLIGHT_OK; does not attest native resource fences")

  transition:
    needs: readiness
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    environment: kesher-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact invocation revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Request one independently fenced cutover step
        env:
          GH_TOKEN: ${{ github.token }}
          KESHER_CUTOVER_GATEWAY_URL: ${{ vars.KESHER_CUTOVER_GATEWAY_URL }}
          CUTOVER_EPOCH: ${{ inputs.epoch }}
          CUTOVER_REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: python -m scripts.kesher_runtime.cutover_entry --epoch "$CUTOVER_EPOCH" --reviewed-revision "$CUTOVER_REVIEWED_REVISION"
