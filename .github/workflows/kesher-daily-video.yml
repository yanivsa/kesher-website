name: Kesher NotebookLM read-only branch diagnostic
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight]
        required: true
permissions:
  contents: read
jobs:
  auth:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/codex/notebooklm-086-preflight' && inputs.operation == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTEBOOKLM_STORAGE_STATE_SECRET: ${{ secrets.NOTEBOOKLM_AUTH_JSON || secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
      NOTEBOOKLM_MASTER_TOKEN_SECRET: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
    steps:
      - name: Check NotebookLM connection with 0.8.6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export NOTEBOOKLM_HOME="$RUNNER_TEMP/notebooklm-diagnostic"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = Path(os.environ["NOTEBOOKLM_HOME"]) / "profiles" / "default"
          profile.mkdir(parents=True)
          for secret, name in (("NOTEBOOKLM_STORAGE_STATE_SECRET", "storage_state.json"),
                               ("NOTEBOOKLM_MASTER_TOKEN_SECRET", "master_token.json")):
              value = os.environ.get(secret)
              if value:
                  (profile / name).write_text(json.dumps(json.loads(value)))
          PY
          unset NOTEBOOKLM_STORAGE_STATE_SECRET NOTEBOOKLM_MASTER_TOKEN_SECRET
          python3 -m venv "$RUNNER_TEMP/notebooklm-venv"
          source "$RUNNER_TEMP/notebooklm-venv/bin/activate"
          python -m pip install -q 'notebooklm-py[headless] @ git+https://github.com/teng-lin/notebooklm-py.git@956400aa7af6b61b4cb988a24c9a081a3abc4ee8'
          result="$RUNNER_TEMP/notebooklm-result.json"
          notebooklm --version
          if notebooklm auth refresh --verify --quiet >"$result" 2>&1; then
            echo "STORED_SESSION_REFRESH_PASS"
            if notebooklm source list --notebook e101e7d7-5305-45b3-a611-21a5475ceb63 --json >"$result" 2>/dev/null; then
              jq -e 'select(.sources | type == "array") | {source_count: (.sources | length)}' "$result"
            else
              echo "NOTEBOOK_SOURCE_INVENTORY_FAILED"
              exit 1
            fi
            exit 0
          fi
          echo "STORED_SESSION_REFRESH_FAILED"
          if notebooklm login --master-token-refresh >"$result" 2>&1; then
            echo "MASTER_TOKEN_REFRESH_PASS"
          else
            echo "MASTER_TOKEN_REFRESH_FAILED"
            if rg -qi 'BadAuthentication|invalid_grant|NeedsBrowser|credentials.*revoked' "$result"; then
              echo "GOOGLE_REJECTED_SAVED_CREDENTIAL"
            elif rg -qi 'not found|no master token|does not exist|missing' "$result"; then
              echo "MASTER_TOKEN_OR_REQUIRED_AUTH_DATA_MISSING"
            fi
            exit 1
          fi
          notebooklm auth check --test --passive --json >"$result" 2>/dev/null || true
          jq '{status, token_fetch: .checks.token_fetch}' "$result"
          jq -e '.status == "ok" and .checks.token_fetch == true' "$result" >/dev/null
