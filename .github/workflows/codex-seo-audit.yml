name: Codex SEO Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Live URL to audit"
        required: false
        default: "https://kesher.saharoni.com"
        type: string
  schedule:
    # Weekly Sunday audit. 01:15 UTC = 04:15 Israel during daylight saving.
    - cron: "15 1 * * 0"
  pull_request:
    paths:
      - ".github/workflows/codex-seo-audit.yml"

permissions:
  contents: read

concurrency:
  group: codex-seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Codex SEO v1.9.6-codex.5, pinned to the release commit rather than a movable branch.
      CODEX_SEO_COMMIT: "9a4a0b9e3c44eec2ceedcc21d10659427ee3bc1c"
      TARGET_URL: ${{ inputs.target_url || 'https://kesher.saharoni.com' }}
      OUTPUT_ROOT: ${{ github.workspace }}/codex-seo-output

    steps:
      - name: Checkout Kesher repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify live target is reachable
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --user-agent "Mozilla/5.0 (compatible; Kesher-CodexSEO-Audit/1.0)" \
            --output /dev/null \
            "${TARGET_URL}"

      - name: Fetch pinned Codex SEO release
        run: |
          set -euo pipefail
          CODEX_DIR="${RUNNER_TEMP}/codex-seo"
          rm -rf "${CODEX_DIR}"
          git init "${CODEX_DIR}"
          git -C "${CODEX_DIR}" remote add origin https://github.com/AgriciDaniel/codex-seo.git
          git -C "${CODEX_DIR}" fetch --depth 1 origin "${CODEX_SEO_COMMIT}"
          git -C "${CODEX_DIR}" checkout --detach FETCH_HEAD
          test "$(git -C "${CODEX_DIR}" rev-parse HEAD)" = "${CODEX_SEO_COMMIT}"

      - name: Install Codex SEO core dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "${RUNNER_TEMP}/codex-seo/requirements-core.txt"

      - name: Verify Codex SEO runtime
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/codex-seo"
          python scripts/verify_environment.py \
            --target "${TARGET_URL}" \
            --json | tee "${GITHUB_WORKSPACE}/codex-seo-environment.json"

      - name: Run deterministic Codex SEO audit
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT_ROOT}"
          mkdir -p "${OUTPUT_ROOT}"
          cd "${RUNNER_TEMP}/codex-seo"
          python scripts/run_headless_audit.py \
            "${TARGET_URL}" \
            --premium-report never \
            --output-root "${OUTPUT_ROOT}" \
            --json | tee "${GITHUB_WORKSPACE}/codex-seo-run.json"

      - name: Add audit action plan to job summary
        if: always()
        run: |
          set -euo pipefail
          ACTION_PLAN="$(find "${OUTPUT_ROOT}" -type f -name 'ACTION-PLAN.md' -print -quit 2>/dev/null || true)"
          SUMMARY_JSON="$(find "${OUTPUT_ROOT}" -type f -name 'SUMMARY.json' -print -quit 2>/dev/null || true)"
          {
            echo "## Codex SEO audit"
            echo
            echo "Target: ${TARGET_URL}"
            echo
            if [[ -n "${ACTION_PLAN}" && -f "${ACTION_PLAN}" ]]; then
              echo "### Action plan"
              echo
              sed -n '1,220p' "${ACTION_PLAN}"
            else
              echo "No ACTION-PLAN.md was produced. Inspect the uploaded runtime logs/artifacts."
            fi
            if [[ -n "${SUMMARY_JSON}" && -f "${SUMMARY_JSON}" ]]; then
              echo
              echo "### Summary artifact"
              echo
              echo "Generated: \`${SUMMARY_JSON#${GITHUB_WORKSPACE}/}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Codex SEO audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-seo-audit-${{ github.run_id }}
          path: |
            codex-seo-output/
            codex-seo-environment.json
            codex-seo-run.json
          if-no-files-found: warn
          retention-days: 30
