name: Jules Daily Kesher Mobile Review

on:
  schedule:
    # 02:20 Israel time during daylight saving.
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-daily-kesher-mobile-review
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Stop if mobile review PR is already open
        id: backlog_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          title_pattern = re.compile(r"^\[jules-automerge\] Kesher mobile review:", re.I)
          branch_pattern = re.compile(r"(?:^|[-_/])kesher-mobile-review(?:[-_/]|$)|(?:^|[-_/])mobile-review(?:[-_/]|$)", re.I)
          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if title_pattern.search(pr.get("title") or "")
              or branch_pattern.search((pr.get("head") or {}).get("ref") or "")
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")
          if blockers:
              print("Open mobile-review PR exists; no Jules session will be started.")
              print("\n".join(blockers[:20]))
          PY

      - name: Start Jules mobile review session
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Daily Kesher mobile UX review",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, or implementation choices. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nGoal: perform a recurring mobile UX and responsive-layout review for the Kesher website. This is not an article-publishing task.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT add, change, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere on the site copy, metadata, or prompts. Preserve the canonical spelling already used in src/constants/siteConfig.ts and visible site copy.\n\nInspect the responsive behavior of at least these routes:\n- /\n- /services/couples\n- /services/parenting\n- /blog\n- /faq\n- /contact\n\nUse mobile widths around 360px, 390px, and 430px when feasible. Check for horizontal overflow, hidden or overlapping CTA buttons, broken cards/images, unusable navigation, sticky/floating CTA collisions, text that does not fit, forms that are hard to use, and content that disappears in a way that hurts trust.\n\nFix at most ONE coherent mobile issue per run. Prefer measurable fixes such as eliminating horizontal overflow, repairing a broken card/image layout, or improving a mobile CTA/navigation problem. Do not redesign the full site and do not change unrelated content.\n\nRequired checks before PR:\n- Run npm run check.\n- Verify the changed route at a mobile width and report the viewport used.\n- Confirm whether document scrollWidth is equal to viewport width for the fixed page when relevant.\n\nCreate one ready-for-review PR automatically only if a focused improvement was made. Do not create a draft PR. PR title must start with `[jules-automerge] Kesher mobile review:` so the repository auto-merge workflow can validate and merge it without waiting for user approval. PR summary must include: route(s) inspected, viewport(s), issue found, changed files, validation command, and residual mobile risks.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          python3 - <<'PY'
          import json
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["prompt"] += "\n\nFile-scope and branch guardrail: create any mobile-review PR directly from current `main` and target `main`; never base a repair PR on another PR branch. Before opening a PR, run `git diff --name-only origin/main...HEAD` and keep only files strictly required for the one reported mobile issue. Do not edit `.github/workflows/`, `public/sitemap.xml`, `public/llms.txt`, `public/llms-full.txt`, generated SEO index files, or unrelated pages during a mobile review. If inherited or incidental churn cannot be removed cleanly, abandon the change and finish as a no-op with no PR. The PR summary must list the final diff and explicitly confirm that no workflow, sitemap, generated-output, or unrelated page files changed.\n\nAdditional guardrails:\n- (1) ElevenLabs/AIChatbot and its consent launcher must remain hidden on viewports <=768px and may never be treated as missing mobile content.\n- (2) After plan generation/auto-approval or any file edit, Jules must execute continuously through visual checks, build/check, cleanup, commit and ready-for-review PR, and may not emit a progress question or wait for confirmation.\n- (3) If the proposed issue conflicts with a documented product contract, revert it and choose a different one.\n- (4) True no-op requires clean git status and no changeSet/branch/commit/PR.\n- (5) Mobile visual evidence must include direct 360/390/430px checks and exact final file scope.\n- (6) Discovery-to-action invariant: after a measurable issue is reproduced, Jules must choose the smallest repo-consistent fix and implement it immediately. Asking whether to fix that issue or inspect another page is forbidden. If the issue disappears on current main, prove a clean no-op instead of asking.\n- (7) Known-regression priority: before selecting a new issue, first prove that both `.heroWhatsapp` and `.quickDock` are present and visible on the exact public route in the current production/prerendered DOM at 360px, 390px, and 430px. If both are present and intersect, that overlap is the run's highest-priority issue; preserve both CTAs and ensure the fixed dock does not cover hero text or controls. If either selector is absent, this known regression is not reproducible and Jules must not edit `BetaPage` or claim a homepage fix.\n- (8) Public-route gate: only fix a route that is part of the production/public route set and returns the intended page with HTTP 200 in the prerendered build. `/beta`, `/beta2`, route experiments, route-specific 404s, pages absent from the public sitemap/navigation, and a component filename such as `BetaPage` are out of scope and are never proof that code serves `/`. A client-side view or stale browser DOM is not proof that a route is live. Before editing and in the PR body, record these exact lines for one target: `Route inspected: /public-path`, `Route HTTP status: 200`, `Route canonical: https://kesher.saharoni.com/public-path`, and `Route heading: ...`. If any signal is missing or contradictory, choose another listed public route or finish as a clean no-op.\n- Limit each run to exactly one coherent mobile issue and forbid broad opportunistic sweeps across unrelated pages.\n- Visual verification artifacts and temporary scripts/screenshots must never remain in the final changeSet/branch/PR.\n- Before PR creation require `git diff --name-only origin/main...HEAD`, revert incidental/unrelated files, run `npm run build` and `npm run check`, and require a ready-for-review non-draft `[jules-automerge] Kesher mobile review:` PR whose body lists the exact final files and confirms no workflow/sitemap/generated-output/screenshot/temp/unrelated files remain."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          status="$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)"
          cat response.json
          test "${status}" = "200" -o "${status}" = "201"

      - name: Enforce autonomous terminal Jules state
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 .github/scripts/watch-jules-session.py \
            --payload payload.json \
            --response response.json \
            --max-seconds 7200 \
            --poll-seconds 10 \
            --max-replacements 1
