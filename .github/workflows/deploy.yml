name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kesher-website
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID || 'disabled' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Inspect production measurement configuration
        id: measurement
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VITE_GTM_CONTAINER_ID" =~ ^(GTM|G)-[A-Za-z0-9]+$ ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Google Analytics / GTM measurement configuration is present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VITE_GTM_CONTAINER_ID is not configured. Booking UX and Calendly event capture will deploy, while Google Ads cookie attribution remains inactive until a GTM container is configured."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run full quality gate
        run: npm run check

      - name: Verify analytics bootstrap build output
        shell: bash
        env:
          MEASUREMENT_READY: ${{ steps.measurement.outputs.ready }}
        run: |
          set -euo pipefail
          if grep -F '%VITE_GTM_CONTAINER_ID%' dist/index.html >/dev/null; then
            echo "::error::The production build still contains the unresolved GTM placeholder"
            exit 1
          fi

          if [ "$MEASUREMENT_READY" = "true" ]; then
            grep -F "data-gtm-id=\"$VITE_GTM_CONTAINER_ID\"" dist/index.html >/dev/null || {
              echo "::error::The configured GTM container ID was not injected into dist/index.html"
              exit 1
            }
          else
            grep -F 'data-gtm-id="disabled"' dist/index.html >/dev/null || {
              echo "::error::The measurement-disabled production build is not explicit"
              exit 1
            }
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.100.0
          command: pages deploy dist --project-name=kesher-website --branch=main

      - name: Publish production deployment statuses
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          MEASUREMENT_READY: ${{ steps.measurement.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail

          publish_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }

          if [ "$JOB_STATUS" = "success" ]; then
            publish_status success "booking-tracking/production-deploy" "Cloudflare production deployment succeeded"
          else
            publish_status failure "booking-tracking/production-deploy" "Production deploy failed; inspect Deploy to Cloudflare Pages"
          fi

          if [ "$MEASUREMENT_READY" = "true" ]; then
            publish_status success "booking-tracking/google-measurement" "Measurement container is injected into the production build"
          else
            publish_status pending "booking-tracking/google-measurement" "Measurement container ID is not configured; Google Ads attribution is pending"
          fi
