name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kesher-website
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011dba9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Validate production measurement configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VITE_GTM_CONTAINER_ID" =~ ^GTM-[A-Za-z0-9]+$ ]]; then
            echo "::error::VITE_GTM_CONTAINER_ID GitHub secret is missing or invalid; refusing to deploy a production build with PPC measurement disabled."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run full quality gate
        run: npm run check

      - name: Verify GTM container was injected into the build
        shell: bash
        run: |
          set -euo pipefail
          grep -F "data-gtm-id=\"$VITE_GTM_CONTAINER_ID\"" dist/index.html >/dev/null || {
            echo "::error::The configured GTM container ID was not injected into dist/index.html"
            exit 1
          }
          if grep -F '%VITE_GTM_CONTAINER_ID%' dist/index.html >/dev/null; then
            echo "::error::The production build still contains the unresolved GTM placeholder"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.100.0
          command: pages deploy dist --project-name=kesher-website --branch=main

      - name: Publish production deployment status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Cloudflare deploy succeeded with GTM measurement enabled"
          else
            state="failure"
            description="Production deploy failed; inspect Deploy to Cloudflare Pages"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="booking-tracking/production-deploy" \
            -f description="$description" >/dev/null
