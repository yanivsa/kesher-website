name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Test CI and production contracts
        run: |
          python3 -m unittest \
            tests.test_ci_profile \
            tests.test_kesher_article_contract \
            tests.test_kesher_article_normalizer \
            tests.test_kesher_explicit_test_mode \
            tests.test_kesher_isolated_live_e2e_contract \
            tests.test_kesher_e2e_readiness \
            tests.test_article_quality_stabilization \
            tests.test_short_retry_policy_v4 \
            tests.test_pipeline_v4 \
            tests.test_v4_runtime_activation \
            tests.test_v5_shared_video_controller \
            tests.test_v5_video_source_binding \
            tests.test_v5_delivery_watchdog_contract \
            tests.test_kesher_optional_video_enrichment \
            tests.test_media_voice_policy_contract \
            tests.test_openclaw_cloudflare_primary \
            tests.test_openclaw_oci_agent_self_heal \
            tests.test_master_supervisor_foundation \
            tests.test_master_supervisor_shadow \
            tests.test_master_supervisor_live \
            tests.test_master_supervisor_live_qa \
            -v

      - name: Select CI profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          profile="full"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
            echo "Changed files:"
            cat changed-files.txt
            profile="$(python3 .github/scripts/select-ci-profile.py < changed-files.txt)"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF_NAME}" != "main" ]]; then
            git fetch --no-tags origin main
            git diff --name-only "origin/main...HEAD" > changed-files.txt
            echo "Changed files since main:"
            cat changed-files.txt
            profile="$(python3 .github/scripts/select-ci-profile.py < changed-files.txt)"
          fi
          echo "Selected CI profile: ${profile}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Provision KESHER Turnstile for security remediation
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'security/remediate-audit-2026-09-22' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not account_id or not token:
              raise SystemExit("Cloudflare credentials are unavailable to this workflow")

          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}"
          widget_name = "KESHER contact forms"
          hostname = "kesher.saharoni.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "kesher-turnstile-provisioner/1",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"Cloudflare {method} {path} failed with HTTP {exc.code}"
                  ) from exc
              if result.get("success") is not True:
                  raise SystemExit(f"Cloudflare {method} {path} returned failure")
              return result.get("result")

          widgets = request("GET", "/challenges/widgets") or []
          matches = [w for w in widgets if w.get("name") == widget_name]
          if len(matches) > 1:
              raise SystemExit("Multiple KESHER Turnstile widgets exist")

          if matches:
              sitekey = str(matches[0].get("sitekey") or "")
              if not sitekey:
                  raise SystemExit("Existing Turnstile widget has no sitekey")
              widget = request("GET", f"/challenges/widgets/{sitekey}") or {}
          else:
              widget = request("POST", "/challenges/widgets", {
                  "domains": [hostname],
                  "mode": "managed",
                  "name": widget_name,
              }) or {}

          sitekey = str(widget.get("sitekey") or "")
          secret = str(widget.get("secret") or "")
          domains = widget.get("domains") or []
          if not sitekey or not secret:
              raise SystemExit("Turnstile widget response did not include sitekey and secret")
          if hostname not in domains:
              raise SystemExit("Turnstile widget is not scoped to kesher.saharoni.com")

          print(f"::add-mask::{sitekey}")
          print(f"::add-mask::{secret}")

          env = os.environ.copy()
          for key, value in (
              ("TURNSTILE_SITE_KEY", sitekey),
              ("TURNSTILE_SECRET_KEY", secret),
          ):
              subprocess.run(
                  [
                      "npx", "--yes", "wrangler@4.100.0", "pages", "secret", "put", key,
                      "--project-name=kesher-website",
                  ],
                  input=value + "\n",
                  text=True,
                  check=True,
                  env=env,
              )
          print("KESHER Turnstile widget and Pages bindings are ready.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Both article and full profiles can invoke prerender/build steps that launch Playwright.
        # Install the browser before either quality gate to avoid missing executable failures.
        run: npx playwright install chromium

      - name: Run focused article quality gate
        if: ${{ steps.profile.outputs.profile == 'article' }}
        run: |
          set -euo pipefail
          python3 scripts/article_claim_quality.py src/data/posts.json
          npm run generate
          npm run test:content
          npx vitest run tests/blog-preview.test.ts tests/app-routing.test.ts
          npm run build
          npm run verify:dist

      - name: Validate article hero images
        if: ${{ steps.profile.outputs.profile == 'article' || steps.profile.outputs.profile == 'full' }}
        run: python3 .github/scripts/validate-article-images.py

      - name: Run full quality gate
        if: ${{ steps.profile.outputs.profile == 'full' }}
        run: npm run check

      - name: Publish protected verify status for dispatched CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "verify",
              "description": "CI quality gate passed on this exact commit",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
