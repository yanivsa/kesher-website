name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Test CI and production contracts
        run: |
          python3 -m unittest \
            tests.test_ci_profile \
            tests.test_kesher_article_contract \
            tests.test_kesher_article_normalizer \
            tests.test_short_retry_policy_v4 \
            tests.test_pipeline_v4 \
            tests.test_v4_runtime_activation \
            tests.test_v5_shared_video_controller \
            tests.test_v5_delivery_watchdog_contract \
            tests.test_openclaw_cloudflare_primary \
            -v

      - name: Select CI profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          profile="full"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
            echo "Changed files:"
            cat changed-files.txt
            profile="$(python3 .github/scripts/select-ci-profile.py < changed-files.txt)"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF_NAME}" != "main" ]]; then
            git fetch --no-tags origin main
            git diff --name-only "origin/main...HEAD" > changed-files.txt
            echo "Changed files since main:"
            cat changed-files.txt
            profile="$(python3 .github/scripts/select-ci-profile.py < changed-files.txt)"
          fi
          echo "Selected CI profile: ${profile}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Both article and full profiles can invoke prerender/build steps that launch Playwright.
        # Install the browser before either quality gate to avoid missing executable failures.
        run: npx playwright install chromium

      - name: Run focused article quality gate
        if: ${{ steps.profile.outputs.profile == 'article' }}
        run: |
          set -euo pipefail
          npm run generate
          npm run test:content
          npx vitest run tests/blog-preview.test.ts tests/app-routing.test.ts
          npm run build
          npm run verify:dist

      - name: Validate article hero images
        if: ${{ steps.profile.outputs.profile == 'full' }}
        run: python3 .github/scripts/validate-article-images.py

      - name: Run full quality gate
        if: ${{ steps.profile.outputs.profile == 'full' }}
        run: npm run check

      - name: Publish protected verify status for dispatched CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "verify",
              "description": "CI quality gate passed on this exact commit",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
