name: Jules Weekend Kesher Article

on:
  schedule:
    # Friday morning year-round: 06:00 UTC = 08:00 IST / 09:00 IDT.
    - cron: "0 6 * * 5"
    # Saturday probes; only the first probe after Ashdod sunset + 1 hour proceeds.
    - cron: "0,15,30,45 15-19 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-weekend-kesher-article
  cancel-in-progress: false

jobs:
  weekend-article:
    runs-on: ubuntu-latest
    steps:
      - name: Open Friday morning or Saturday post-sunset window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Jerusalem")
          now = dt.datetime.now(tz)
          event = os.environ.get("EVENT_NAME", "")
          allow = False
          reason = "outside-weekend-window"

          if event == "workflow_dispatch":
              allow = True
              reason = "manual-dispatch"
          elif now.isoweekday() == 5:
              allow = True
              reason = f"friday-morning-{now:%H:%M}"
          elif now.isoweekday() == 6:
              url = (
                  "https://www.hebcal.com/zmanim?cfg=json&geonameid=295629"
                  f"&date={now.date().isoformat()}&sec=1"
              )
              request = urllib.request.Request(url, headers={"User-Agent": "Kesher-Automation/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              sunset_raw = (payload.get("times") or {}).get("sunset")
              if not sunset_raw:
                  raise SystemExit("Hebcal response missing times.sunset")
              sunset = dt.datetime.fromisoformat(sunset_raw)
              sunset = sunset.replace(tzinfo=tz) if sunset.tzinfo is None else sunset.astimezone(tz)
              target = sunset + dt.timedelta(hours=1)
              allow = target <= now < target + dt.timedelta(minutes=45)
              reason = f"sunset={sunset:%H:%M};target={target:%H:%M};now={now:%H:%M};allow={str(allow).lower()}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"allow={'true' if allow else 'false'}\n")
          print(reason)
          PY

      - name: Checkout current main
        if: steps.gate.outputs.allow == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Refuse duplicate article for the same Israel date
        if: steps.gate.outputs.allow == 'true'
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Asia/Jerusalem")).date().isoformat()
          with open("src/data/posts.json", encoding="utf-8") as fh:
              posts = json.load(fh)
          already_today = any(isinstance(post, dict) and str(post.get("date", "")) == today for post in posts)

          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "Kesher-Automation/1.0"}
          token = os.environ.get("GITHUB_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              prs = json.load(response)

          blockers = []
          for pr in prs:
              text = "\n".join([
                  str(pr.get("title") or ""),
                  str(pr.get("body") or ""),
                  str((pr.get("head") or {}).get("ref") or ""),
              ])
              if not re.search(r"Publish Kesher article:|kesher[- ]article|weekday[- ]article|מאמר", text, re.I):
                  continue
              number = pr.get("number")
              if not number:
                  continue
              files_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(files_request, timeout=30) as response:
                  files = json.load(response)
              if any(row.get("filename") == "src/data/posts.json" for row in files):
                  blockers.append(str(number))

          launch = not already_today and not blockers
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"launch_required={'true' if launch else 'false'}\n")
          print(f"israel_date={today} already_today={already_today} article_pr_blockers={','.join(blockers) or 'none'}")
          PY

      - name: Start autonomous Jules article session
        if: steps.gate.outputs.allow == 'true' && steps.article_gate.outputs.launch_required == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"
          test -s ".github/prompts/jules-weekday-article-update.md"
          python3 - <<'PY'
          import datetime as dt
          import json
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Asia/Jerusalem")).date().isoformat()
          with open(".github/prompts/jules-weekday-article-update.md", encoding="utf-8") as fh:
              policy = fh.read()
          prompt = (
              "Run fully autonomously. Do not ask for approval or clarification. "
              f"This is the weekend Kesher article run for Israel date {today}. "
              "Repository: yanivsa/kesher-website; start from current main. "
              "Create exactly ONE new Hebrew article and no backlog catch-up. "
              "Before editing, inspect recent articles and current open article PRs; if today's article already exists or a real article PR is open, finish as a truthful no-op. "
              "Use the authoritative policy below in full. Run required generation and validation, keep final scope clean, and create the article PR automatically. "
              f"Use {today} as the publication date and never future-date it.\n\n"
              "AUTHORITATIVE CURRENT ARTICLE POLICY:\n\n" + policy
          )
          payload = {
              "title": "Weekend Kesher Hebrew article",
              "prompt": prompt,
              "sourceContext": {
                  "source": "sources/github/yanivsa/kesher-website",
                  "githubRepoContext": {"startingBranch": "main"},
                  "environmentVariablesEnabled": True,
              },
              "requirePlanApproval": False,
              "automationMode": "AUTO_CREATE_PR",
          }
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY
          status=$(curl -w "%{http_code}" -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)
          if [ "$status" -ge 400 ]; then
            echo "Jules API failed with HTTP $status"
            cat response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          data = json.load(open("response.json", encoding="utf-8"))
          session = data.get("name") or data.get("id")
          url = data.get("url") or data.get("agentUrl") or data.get("sessionUrl")
          if not session or not url:
              raise SystemExit("Jules response missing session identity or URL")
          print(f"Jules session started: {session}")
          print(f"URL: {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### Weekend article Jules session\n\n- Session: `{session}`\n- URL: {url}\n")
          PY
