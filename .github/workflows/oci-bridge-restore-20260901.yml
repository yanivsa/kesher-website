name: Restore OCI Bridge Known-Good Version

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oci-bridge-restore-20260901.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
      KNOWN_GOOD_START: '2026-09-01T08:18:30Z'
      ACCIDENTAL_ROTATION_AT: '2026-09-01T09:01:08Z'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Select last known-good bridge version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/versions?deployable=true" \
            -o /tmp/versions.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def dt(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          payload = json.load(open('/tmp/versions.json'))
          assert payload.get('success'), payload.get('errors')
          result = payload.get('result') or {}
          if isinstance(result, dict):
              rows = result.get('items') or []
          elif isinstance(result, list):
              rows = result
          else:
              raise AssertionError(f'UNEXPECTED_CLOUDFLARE_VERSIONS_RESULT_TYPE={type(result).__name__}')
          assert isinstance(rows, list), 'CLOUDFLARE_VERSIONS_ITEMS_NOT_LIST'

          start = dt(os.environ['KNOWN_GOOD_START'])
          cutoff = dt(os.environ['ACCIDENTAL_ROTATION_AT'])
          candidates = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              created = ((row.get('metadata') or {}).get('created_on')) or row.get('created_on')
              if not created:
                  continue
              created_dt = dt(created)
              if start <= created_dt < cutoff and row.get('id'):
                  candidates.append((created_dt, row))
          assert candidates, 'NO_DEPLOYABLE_KNOWN_GOOD_BRIDGE_VERSION_IN_PROVEN_WINDOW'
          created_dt, row = max(candidates, key=lambda x: x[0])
          Path('/tmp/candidate-id').write_text(row['id'])
          print('OCI_BRIDGE_RESTORE_CANDIDATE_VERSION='+str(row.get('number') or 'unknown'))
          print('OCI_BRIDGE_RESTORE_CANDIDATE_CREATED='+created_dt.isoformat())
          print('OCI_BRIDGE_RESTORE_CANDIDATE_DEPLOYABLE=true')
          PY

      - name: Create bridge version with inherited private key and fresh control token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          candidate_id="$(cat /tmp/candidate-id)"
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > /tmp/control-token
          chmod 600 /tmp/control-token

          cat > /tmp/worker.mjs <<'JS'
          function b64ToBytes(value) {
            const raw = atob(value);
            const out = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
            return out;
          }
          function pemToBytes(pem) {
            return b64ToBytes(pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, ''));
          }
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/health') {
                return new Response('ok', {headers: {'cache-control': 'no-store'}});
              }
              if (url.pathname !== '/decrypt' || request.method !== 'POST') return new Response('not found', {status: 404});
              const auth = request.headers.get('authorization') || '';
              if (!env.CONTROL_TOKEN || auth !== `Bearer ${env.CONTROL_TOKEN}`) return new Response('forbidden', {status: 403});
              try {
                const payload = await request.json();
                const privateKey = await crypto.subtle.importKey(
                  'pkcs8', pemToBytes(env.BOOTSTRAP_PRIVATE_KEY),
                  {name: 'RSA-OAEP', hash: 'SHA-256'}, false, ['decrypt']
                );
                const aesRaw = await crypto.subtle.decrypt({name: 'RSA-OAEP'}, privateKey, b64ToBytes(payload.wrapped_key));
                const aesKey = await crypto.subtle.importKey('raw', aesRaw, {name: 'AES-GCM'}, false, ['decrypt']);
                const plaintext = await crypto.subtle.decrypt(
                  {name: 'AES-GCM', iv: b64ToBytes(payload.iv)},
                  aesKey, b64ToBytes(payload.ciphertext)
                );
                return new Response(plaintext, {
                  headers: {'content-type': 'application/json', 'cache-control': 'no-store'}
                });
              } catch (_) {
                return new Response('decrypt failed', {status: 400, headers: {'cache-control': 'no-store'}});
              }
            }
          };
          JS

          CANDIDATE_ID="$candidate_id" CONTROL_TOKEN_VALUE="$token" python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              'main_module': 'worker.mjs',
              'compatibility_date': '2026-08-13',
              'bindings': [
                  {
                      'name': 'BOOTSTRAP_PRIVATE_KEY',
                      'type': 'inherit',
                      'version_id': os.environ['CANDIDATE_ID'],
                  },
                  {
                      'name': 'CONTROL_TOKEN',
                      'type': 'secret_text',
                      'text': os.environ['CONTROL_TOKEN_VALUE'],
                  },
              ],
              'annotations': {
                  'workers/message': 'Restore OCI bridge with private key inherited from proven-good version'
              },
          }
          Path('/tmp/version-metadata.json').write_text(json.dumps(metadata, separators=(',', ':')))
          PY

          code="$(curl -sS -X POST -H "$auth" \
            -F 'metadata=@/tmp/version-metadata.json;type=application/json' \
            -F 'worker.mjs=@/tmp/worker.mjs;type=application/javascript+module' \
            -o /tmp/version-response.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/versions?bindings_inherit=strict")"
          python3 - "$code" <<'PY'
          import json, sys
          from pathlib import Path
          code=int(sys.argv[1])
          d=json.load(open('/tmp/version-response.json'))
          if not (200 <= code < 300 and d.get('success')):
              errors=[{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or []) if isinstance(e,dict)]
              raise SystemExit(f'CLOUDFLARE_VERSION_UPLOAD_FAILED http={code} errors={errors}')
          result=d.get('result') or {}
          version_id=result.get('id')
          if not version_id:
              raise SystemExit('CLOUDFLARE_VERSION_UPLOAD_MISSING_ID')
          Path('/tmp/restored-version-id').write_text(version_id)
          print('OCI_BRIDGE_PRIVATE_KEY_INHERITED=true')
          print('OCI_BRIDGE_FRESH_TOKEN_VERSION_CREATED=true')
          PY

      - name: Deploy restored bridge version and verify encrypted bundle decrypts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          version_id="$(cat /tmp/restored-version-id)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          version_id=Path('/tmp/restored-version-id').read_text().strip()
          body={
            'strategy':'percentage',
            'versions':[{'version_id':version_id,'percentage':100}],
            'annotations':{
              'workers/message':'Deploy restored OCI bridge with inherited proven-good private key'
            }
          }
          Path('/tmp/deploy.json').write_text(json.dumps(body,separators=(',',':')))
          PY
          code="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy.json \
            -o /tmp/deploy-response.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/deployments?force=true")"
          python3 - "$code" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          d=json.load(open('/tmp/deploy-response.json'))
          if not (200 <= code < 300 and d.get('success')):
              errors=[{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or []) if isinstance(e,dict)]
              raise SystemExit(f'CLOUDFLARE_DEPLOY_FAILED http={code} errors={errors}')
          print('OCI_BRIDGE_RESTORED_VERSION_DEPLOYED=true')
          PY

          token="$(cat /tmp/control-token)"
          subdomain="$(curl -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/decrypted.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            case "$code" in
              403|429|500|502|503|504) sleep 5 ;;
              *) echo "OCI bridge verification returned HTTP $code" >&2; break ;;
            esac
          done
          if [ "$code" != 200 ]; then
            echo "OCI bridge verification returned HTTP $code; restoring known-good version" >&2
            candidate="$(cat /tmp/candidate-id)"
            CANDIDATE_ID="$candidate" python3 -c 'import json,os; open("/tmp/fallback-deploy.json","w").write(json.dumps({"strategy":"percentage","versions":[{"version_id":os.environ["CANDIDATE_ID"],"percentage":100}],"annotations":{"workers/message":"Safety rollback after restored-version verification failure"}},separators=(",",":")))'
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data-binary @/tmp/fallback-deploy.json \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/deployments?force=true" >/dev/null
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/decrypted.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          print('OCI_BRIDGE_DECRYPT_OK=true')
          PY

      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/versions.json /tmp/candidate-id /tmp/control-token /tmp/worker.mjs /tmp/version-metadata.json /tmp/version-response.json /tmp/restored-version-id /tmp/deploy.json /tmp/deploy-response.json /tmp/decrypted.json /tmp/fallback-deploy.json
