name: Restore OCI Bridge Known-Good Version

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oci-bridge-restore-20260901.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
      KNOWN_GOOD_START: '2026-09-01T08:18:30Z'
      ACCIDENTAL_ROTATION_AT: '2026-09-01T09:01:08Z'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Select last known-good bridge version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/versions?deployable=true" \
            -o /tmp/versions.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def dt(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          payload = json.load(open('/tmp/versions.json'))
          assert payload.get('success'), payload.get('errors')
          result = payload.get('result') or {}
          if isinstance(result, dict):
              rows = result.get('items') or []
          elif isinstance(result, list):
              rows = result
          else:
              raise AssertionError(f'UNEXPECTED_CLOUDFLARE_VERSIONS_RESULT_TYPE={type(result).__name__}')
          assert isinstance(rows, list), 'CLOUDFLARE_VERSIONS_ITEMS_NOT_LIST'

          start = dt(os.environ['KNOWN_GOOD_START'])
          cutoff = dt(os.environ['ACCIDENTAL_ROTATION_AT'])
          candidates = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              created = ((row.get('metadata') or {}).get('created_on')) or row.get('created_on')
              if not created:
                  continue
              created_dt = dt(created)
              if start <= created_dt < cutoff and row.get('id'):
                  candidates.append((created_dt, row))
          assert candidates, 'NO_DEPLOYABLE_KNOWN_GOOD_BRIDGE_VERSION_IN_PROVEN_WINDOW'
          created_dt, row = max(candidates, key=lambda x: x[0])
          Path('/tmp/candidate-id').write_text(row['id'])
          print('OCI_BRIDGE_RESTORE_CANDIDATE_VERSION='+str(row.get('number') or 'unknown'))
          print('OCI_BRIDGE_RESTORE_CANDIDATE_CREATED='+created_dt.isoformat())
          print('OCI_BRIDGE_RESTORE_CANDIDATE_DEPLOYABLE=true')
          PY

      - name: Restore known-good Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          version_id=Path('/tmp/candidate-id').read_text().strip()
          body={
            'strategy':'percentage',
            'versions':[{'version_id':version_id,'percentage':100}],
            'annotations':{
              'workers/message':'Restore OCI bridge version proven good before accidental 2026-09-01 key rotation'
            }
          }
          Path('/tmp/deploy.json').write_text(json.dumps(body,separators=(',',':')))
          PY
          code="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy.json \
            -o /tmp/deploy-response.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/deployments?force=true")"
          python3 - "$code" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          d=json.load(open('/tmp/deploy-response.json'))
          if not (200 <= code < 300 and d.get('success')):
              errors=[{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or []) if isinstance(e,dict)]
              raise SystemExit(f'CLOUDFLARE_DEPLOY_FAILED http={code} errors={errors}')
          print('OCI_BRIDGE_KNOWN_GOOD_VERSION_RESTORED=true')
          PY

      - name: Refresh control token as version and deploy it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > /tmp/control-token
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 versions secret put CONTROL_TOKEN \
            --name "$BRIDGE_NAME" --message 'Refresh control token on restored OCI bridge' >/tmp/version-secret.log
          curl -fsS -H "$auth" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/versions?deployable=true" \
            -o /tmp/versions-after-secret.json
          BEFORE="$before" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def dt(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          payload=json.load(open('/tmp/versions-after-secret.json'))
          assert payload.get('success'), payload.get('errors')
          result=payload.get('result') or {}
          rows=(result.get('items') or []) if isinstance(result,dict) else result
          assert isinstance(rows,list), 'CLOUDFLARE_VERSIONS_ITEMS_NOT_LIST_AFTER_SECRET'
          before=dt(os.environ['BEFORE'])
          candidates=[]
          for row in rows:
              if not isinstance(row,dict) or not row.get('id'):
                  continue
              created=((row.get('metadata') or {}).get('created_on')) or row.get('created_on')
              if created and dt(created) >= before:
                  candidates.append((dt(created),row))
          assert candidates, 'NO_VERSION_CREATED_BY_VERSIONED_SECRET_PUT'
          created,row=max(candidates,key=lambda x:x[0])
          Path('/tmp/token-version-id').write_text(row['id'])
          print('OCI_BRIDGE_TOKEN_VERSION_CREATED=true')
          print('OCI_BRIDGE_TOKEN_VERSION_NUMBER='+str(row.get('number') or 'unknown'))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          version_id=Path('/tmp/token-version-id').read_text().strip()
          body={
            'strategy':'percentage',
            'versions':[{'version_id':version_id,'percentage':100}],
            'annotations':{'workers/message':'Deploy restored OCI bridge with refreshed control token'}
          }
          Path('/tmp/token-deploy.json').write_text(json.dumps(body,separators=(',',':')))
          PY
          code="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data-binary @/tmp/token-deploy.json \
            -o /tmp/token-deploy-response.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/deployments?force=true")"
          python3 - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1]); d=json.load(open('/tmp/token-deploy-response.json'))
          if not (200 <= code < 300 and d.get('success')):
              errors=[{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or []) if isinstance(e,dict)]
              raise SystemExit(f'CLOUDFLARE_TOKEN_VERSION_DEPLOY_FAILED http={code} errors={errors}')
          print('OCI_BRIDGE_TOKEN_VERSION_DEPLOYED=true')
          PY

      - name: Verify encrypted bundle decrypts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(cat /tmp/control-token)"
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/decrypted.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            [ "$code" = 403 ] && { sleep 5; continue; }
            break
          done
          if [ "$code" != 200 ]; then
            echo "OCI bridge verification returned HTTP $code; restoring known-good version" >&2
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            candidate="$(cat /tmp/candidate-id)"
            CANDIDATE_ID="$candidate" python3 -c 'import json,os; open("/tmp/fallback-deploy.json","w").write(json.dumps({"strategy":"percentage","versions":[{"version_id":os.environ["CANDIDATE_ID"],"percentage":100}],"annotations":{"workers/message":"Safety rollback after control-token verification failure"}},separators=(",",":")))'
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data-binary @/tmp/fallback-deploy.json \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_NAME/deployments?force=true" >/dev/null
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/decrypted.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          print('OCI_BRIDGE_DECRYPT_OK=true')
          PY

      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/versions.json /tmp/candidate-id /tmp/deploy.json /tmp/deploy-response.json /tmp/control-token /tmp/version-secret.log /tmp/versions-after-secret.json /tmp/token-version-id /tmp/token-deploy.json /tmp/token-deploy-response.json /tmp/decrypted.json /tmp/fallback-deploy.json
