name: Hebrew prose recalibration temporary

on:
  pull_request:
    paths:
      - 'scripts/hebrew-prose-audit.cjs'
      - 'tests/hebrew-prose-audit.test.cjs'
      - '.github/workflows/hebrew-prose-recalibration.yml'

permissions:
  contents: read

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run focused audit tests
        run: node --test tests/hebrew-prose-audit.test.cjs
      - name: Recalibrate 30 recent publishable articles
        run: node scripts/hebrew-prose-audit.cjs --sample=30 --format=markdown
