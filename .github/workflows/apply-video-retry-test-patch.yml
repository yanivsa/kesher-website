name: Apply strict runtime review validation

on:
  push:
    branches: [automation/kesher-video-review-contract-20260819]
    paths: [.github/workflows/apply-video-retry-test-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/kesher-video-review-contract-20260819
      - name: Patch and verify video tests
        run: |
          set -euo pipefail
          python3 scripts/_patch_video_retry_test.py
          python3 -m unittest tests.test_video_review_policy tests.test_video_review_schema tests.test_kesher_daily_pipeline -q
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "Kesher Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/jules_video_reviewer.py
          git diff --cached --check
          git commit -m "fix: validate strict Jules schema inside runtime validator"
          git push origin HEAD:automation/kesher-video-review-contract-20260819
