name: ChatGPT Authority Sync PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.head_ref == 'chatgpt/local-editorial-image-fallback' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Canonically synchronize reviewed authority hashes
        run: |
          set -euo pipefail
          # This bootstrap workflow is not part of the intended final tree.
          # Remove it only from the runner worktree so the canonical synchronizer
          # reviews exactly the post-bootstrap workflow definition set.
          rm -f .github/workflows/chatgpt-authority-sync-pr.yml
          python3 scripts/kesher_runtime/sync_authority_policy.py --root . --update
          python3 scripts/kesher_runtime/sync_authority_policy.py --root . --check

      - name: Commit synchronized authority policy if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/kesher_runtime/authority_policy.json; then
            echo 'Authority policy already synchronized.'
            exit 0
          fi
          git config user.name 'Kesher Authority Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/kesher_runtime/authority_policy.json
          git commit -m 'chore(authority): sync image worker review hashes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
