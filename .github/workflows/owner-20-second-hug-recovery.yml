name: Owner Recovery - 20 Second Hug

on:
  push:
    branches:
      - owner/20-second-hug-20261005

permissions:
  contents: write

jobs:
  recover-article:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Insert article fail-closed
        run: python3 .github/scripts/owner_insert_20_second_hug.py

      - name: Install dependencies
        run: npm ci

      - name: Content validation
        run: npm run test:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist
        run: npm run verify:dist

      - name: Commit only the clean article result
        shell: bash
        run: |
          rm .github/workflows/owner-20-second-hug-recovery.yml
          rm .github/scripts/owner_insert_20_second_hug.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts.json .github/workflows/owner-20-second-hug-recovery.yml .github/scripts/owner_insert_20_second_hug.py
          git diff --cached --check
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "src/data/posts.json "
          git commit -m "feat(content): publish 20-second hug relationship article"
          git push origin HEAD:owner/20-second-hug-20261005
