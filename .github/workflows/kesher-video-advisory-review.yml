name: Kesher Advisory Jules Video Review

on:
  workflow_dispatch:
    inputs:
      review_branch:
        description: Immutable evidence branch created by the video worker
        required: true
        type: string
      evidence_root:
        description: Evidence root inside the immutable review branch
        required: true
        type: string
      item_id:
        description: Exact video item identity
        required: true
        type: string
      target_slug:
        description: Exact article slug
        required: true
        type: string
      target_content_sha256:
        description: Exact authoritative article content SHA-256
        required: true
        type: string
      review_session:
        description: Optional existing Jules session for the same immutable evidence
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: kesher-advisory-jules-${{ inputs.item_id }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate exact advisory evidence identity
        id: identity
        env:
          REVIEW_BRANCH: ${{ inputs.review_branch }}
          EVIDENCE_ROOT: ${{ inputs.evidence_root }}
          REVIEW_ITEM_ID: ${{ inputs.item_id }}
          TARGET_CONTENT_SHA256: ${{ inputs.target_content_sha256 }}
          REVIEW_SESSION: ${{ inputs.review_session }}
        run: |
          set -euo pipefail
          if [[ ! "$REVIEW_BRANCH" =~ ^kesher-video-review-([0-9]+)$ ]]; then
            echo "Invalid advisory review branch identity." >&2
            exit 1
          fi
          review_run_id="${BASH_REMATCH[1]}"
          if [ "$EVIDENCE_ROOT" != ".jules-video-review/${review_run_id}" ]; then
            echo "Advisory evidence root does not match review branch identity." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_ITEM_ID" =~ ^video-[0-9]{8}-[0-9]{6}-[0-9a-f]{10}(-a[23])?$ ]]; then
            echo "Invalid advisory video item identity." >&2
            exit 1
          fi
          if [[ ! "$TARGET_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid authoritative content SHA-256." >&2
            exit 1
          fi
          if [[ -n "${REVIEW_SESSION:-}" && ! "${REVIEW_SESSION:-}" =~ ^sessions/[0-9]+$ ]]; then
            echo "Invalid existing Jules session identity." >&2
            exit 1
          fi

      - name: Checkout immutable Jules evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.review_branch }}
          path: review-evidence
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-video-cloud.txt

      - name: Install pinned advisory review dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-video-cloud.txt

      - name: Jules performs strict advisory review
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          EVIDENCE_STATE_DIR: ${{ github.workspace }}/review-evidence/${{ inputs.evidence_root }}
          REVIEW_SESSION: ${{ inputs.review_session }}
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_STATE_DIR/state.json"
          python -u scripts/jules_video_reviewer_v3.py \
            --state-dir "$EVIDENCE_STATE_DIR" \
            --target-slug "${{ inputs.target_slug }}" \
            --target-content-sha256 "${{ inputs.target_content_sha256 }}" \
            --item-id "${{ inputs.item_id }}" \
            --review-branch "${{ inputs.review_branch }}" \
            --evidence-root "${{ inputs.evidence_root }}" \
            --timeout-seconds 900 \
            --review-session "$REVIEW_SESSION"

      - name: Persist advisory Jules review result
        if: ${{ always() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-video-advisory-review-${{ github.run_id }}
          path: ${{ github.workspace }}/review-evidence/${{ inputs.evidence_root }}/state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Delete temporary Jules evidence branch
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ inputs.review_branch }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REVIEW_BRANCH}" || true
