name: One-off Kesher Canary Jules Review and Advisory Upload

on:
  push:
    branches: [main]
    paths: [.github/workflows/kesher-video-canary-review-upload.yml]

permissions:
  actions: write
  contents: write

jobs:
  review-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KESHER_STATE_DIR: ${{ github.workspace }}/.kesher-video-state
    steps:
      - name: Checkout main tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install upload dependency
        run: python -m pip install requests==2.32.5

      - name: Restore newest durable video state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$KESHER_STATE_DIR"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=kesher-video-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$artifact_id"
          archive="$(mktemp /tmp/kesher-state.XXXXXX.zip)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
          unzip -oq "$archive" -d "$KESHER_STATE_DIR"
          test -s "$KESHER_STATE_DIR/state.json"
          echo "RESTORED_STATE_ARTIFACT=$artifact_id"

      - name: Publish evidence-only orphan branch
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="kesher-video-review-${GITHUB_RUN_ID}"
          root=".jules-video-review/${GITHUB_RUN_ID}"
          prepared="$(mktemp -d /tmp/kesher-prepared.XXXXXX)"
          python -u scripts/prepare_jules_video_evidence.py --state-dir "$KESHER_STATE_DIR" --output-dir "$prepared/$root"

          repo="$(mktemp -d /tmp/kesher-evidence-repo.XXXXXX)"
          git -C "$repo" init -q
          git -C "$repo" checkout --orphan "$branch"
          git -C "$repo" config user.name "Kesher Video Automation"
          git -C "$repo" config user.email "actions@users.noreply.github.com"
          mkdir -p "$repo/$root"
          cp -a "$prepared/$root/." "$repo/$root/"
          git -C "$repo" add "$root"
          git -C "$repo" commit -m "Publish isolated Jules video evidence ${GITHUB_RUN_ID}"
          git -C "$repo" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "EVIDENCE_ONLY_BRANCH_READY=true"

      - name: Jules advisory review
        id: jules
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python -u scripts/jules_video_reviewer.py \
            --state-dir "$KESHER_STATE_DIR" \
            --review-branch "${{ steps.evidence.outputs.branch }}" \
            --evidence-root "${{ steps.evidence.outputs.root }}" \
            --timeout-seconds 3600

      - name: Upload to YouTube regardless of Jules decision
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u scripts/kesher_youtube_advisory_upload.py

      - name: Persist final state
        if: ${{ always() && hashFiles('.kesher-video-state/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kesher-video-state
          path: ${{ env.KESHER_STATE_DIR }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

      - name: Delete temporary evidence branch
        if: ${{ always() && steps.evidence.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.evidence.outputs.branch }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
