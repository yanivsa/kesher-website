name: Kesher Activate Overview Media Mode Fix

on:
  push:
    paths:
      - '.github/workflows/kesher-activate-media-mode-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set explicit production media mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/kesher-daily-video.yml')
          text = p.read_text(encoding='utf-8')
          needle = '      KESHER_STATE_DIR: ${{ github.workspace }}/.kesher-video-state\n'
          replacement = needle + '      KESHER_MEDIA_MODE: video_overview\n'
          if 'KESHER_MEDIA_MODE: video_overview' not in text:
              if needle not in text:
                  raise SystemExit('Expected Overview env anchor not found')
              p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git config user.name 'yanivsa'
          git config user.email '45253818+yanivsa@users.noreply.github.com'
          git add .github/workflows/kesher-daily-video.yml
          if git diff --cached --quiet; then
            echo 'Production media mode already active.'
            exit 0
          fi
          git commit -m 'fix(kesher): declare Overview media mode explicitly'
          git push origin HEAD:main
