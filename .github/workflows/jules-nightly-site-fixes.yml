name: Jules Nightly Kesher Site Fixes

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-nightly-kesher-site-fixes
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Start Jules autonomous site-fix session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Nightly Kesher site fixes and Suggested sweep",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, Start clicks, plan approval, issue selection, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nAct like clicking Start on Jules Suggested Tasks, but safely. Do not start all suggested fixes blindly.\n\nBefore choosing work, read:\n- src/constants/siteConfig.ts\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT add, change, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere on the site copy, metadata, or prompts. Preserve the canonical spelling already used in src/constants/siteConfig.ts and visible site copy.\n\nLanguage guardrails:\n- Preserve the site as Hebrew-only unless existing code explicitly requires otherwise.\n- Do not add English, Russian, Ukrainian, or multilingual article variants.\n- If editing visible Hebrew copy, make it natural Israeli Hebrew: clear, human, concrete, and not translated-English or AI-like.\n- Preserve warm professional tone; avoid generic SEO filler and corporate therapy jargon.\n\nPick at most ONE coherent, high-confidence fix per nightly run.\n\nEligible fixes:\n- SEO/GEO metadata\n- sitemap / robots / llms.txt consistency\n- accessibility\n- mobile layout\n- React/Vite build reliability\n- routing bugs\n- content consistency\n- performance\n- small maintainability improvements\n\nDo not publish blog articles in this task.\n\nOpen PR handling:\nOpen PRs are context, not a reason to stop the whole run. Inspect open PRs and branches, skip duplicate issues, and choose a different small non-overlapping fix when possible. If no safe non-duplicate fix exists, finish with a plain session summary only; do not edit files, do not create a no-op PR, and do not ask the user what to do.\n\nDuplicate-avoidance rule:\nDo not create a PR for an issue already covered by an open PR, existing branch, merged PR, recent session, or equivalent code in main.\n\nPR title and scope rules:\n- Use an approved [jules-automerge] prefix only for these exact categories: [jules-automerge] Kesher content review:, [jules-automerge] Kesher mobile review:, or [jules-automerge] Kesher SEO GEO review:.\n- For site fixes, performance, maintainability, routing, accessibility, build reliability, or general suggested-task fixes, use [jules-review], never [jules-automerge].\n- Do not edit .github/workflows/, public/sitemap.xml, generated index files, or unrelated pages unless the selected issue specifically requires that file; if such a file changes accidentally, revert it before opening the PR.\n- The PR body must explicitly confirm the approved prefix choice and that no unrelated workflow/sitemap/generated-output churn remains.\n\nRun npm run check.\n\nCreate one PR automatically only if the change is clean, focused, and non-duplicate. PR summary must include which suggested/backlog issue was addressed, why it was not a duplicate, changed files, validation commands, risks or skipped checks, and confirmation that no manual Start/approval was required.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          python3 - <<'PY'
          import json
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["prompt"] += "\n\nNo-safe-fix completion rule: if inspection finds no safe non-duplicate high-confidence fix, that is a complete successful no-op. Immediately finish with a plain session summary naming the checked open PRs/categories, with no question, no file edit, no changeSet, no branch, no commit, and no PR.\n\nDiscovery-to-terminal rule: a discovery summary must never end by asking which area/file to inspect or whether to terminate as a no-op. Once the audit has either one safe focused candidate or no safe candidate, Jules must immediately execute the corresponding terminal path itself: implement/test/submit the one candidate, or prove a clean no-op and complete. Offering those paths to the user is forbidden.\n\nWarning-only guardrail: a Vite or build-tool recommendation is not by itself a verified defect. Do not migrate between @vitejs/plugin-react-swc and @vitejs/plugin-react, change package dependencies, or open a PR solely to silence a recommendation. Build-tool changes require a reproduced build/reliability failure and focused validation; otherwise choose another measured issue or finish a clean no-op.\n\nTerminal invariant: never report COMPLETED with a changeSet but no pull request. A meaningful change must end in one validated non-draft PR. If submit/rebase/API failure prevents that, retry boundedly, then remove the changeSet and finish as a factual clean no-op or explicit failure without asking the user."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          status="$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)"
          cat response.json
          test "${status}" = "200" -o "${status}" = "201"

      - name: Enforce autonomous terminal Jules state
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 .github/scripts/watch-jules-session.py \
            --payload payload.json \
            --response response.json \
            --max-seconds 3600 \
            --poll-seconds 10 \
            --max-replacements 1
