name: Terminal Cycle Fix Applier

on:
  push:
    branches:
      - fix/terminal-cycle-no-resurrection-20261014

permissions:
  contents: write

concurrency:
  group: terminal-cycle-fix-applier
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/fix/terminal-cycle-no-resurrection-20261014' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/terminal-cycle-no-resurrection-20261014
          fetch-depth: 0

      - name: Run red-green regression applier
        run: python3 .github/scripts/terminal_cycle_fix_applier.py

      - name: Commit tested fix and remove temporary applier
        run: |
          set -euo pipefail
          git rm .github/workflows/terminal-cycle-fix-applier.yml
          git rm .github/scripts/terminal_cycle_fix_applier.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/kesher_content_controller.py tests/test_kesher_content_controller.py
          git commit -m 'fix(controller): keep exhausted article cycles terminal'
          git push origin HEAD:fix/terminal-cycle-no-resurrection-20261014
