name: Apply durable video state fallback

on:
  push:
    branches: [automation/kesher-video-state-fallback-20260819]
    paths: [.github/workflows/apply-video-state-fallback-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/kesher-video-state-fallback-20260819
      - name: Apply fallback and verify
        run: |
          set -euo pipefail
          python3 scripts/_apply_video_state_fallback_patch.py
          python3 -m unittest tests.test_controller_artifact_download tests.test_kesher_content_controller -v
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "Kesher Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kesher_content_controller.py
          git diff --cached --check
          git commit -m "fix: fall back to older valid video state artifacts"
          git push origin HEAD:automation/kesher-video-state-fallback-20260819
