name: Authority Policy Resync Once

on:
  push:
    branches:
      - fix/authority-policy-recertify-20261031
    paths:
      - '.github/workflows/authority-policy-resync-once.yml'

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Regenerate reviewed authority hash pins and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/authority-policy-resync-once.yml
          python3 scripts/kesher_runtime/sync_authority_policy.py --update
          python3 scripts/kesher_runtime/sync_authority_policy.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/authority-policy-resync-once.yml scripts/kesher_runtime/authority_policy.json
          git diff --cached --check
          git commit -m 'ci: recertify authority policy after dependency updates'
          git push origin HEAD:${GITHUB_REF_NAME}
