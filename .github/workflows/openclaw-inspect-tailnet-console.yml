name: Inspect OpenClaw Tailnet Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-inspect-tailnet-console.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            if [ "$code" = 403 ]; then sleep 5; continue; fi
            exit 1
          done
          [ "$code" = 200 ]
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
      - name: Capture safe console markers
        run: |
          python3 - <<'PY'
          import oci, re, time
          cfg=oci.config.from_file('/tmp/oci.cfg','DEFAULT')
          comp=cfg['tenancy']
          compute=oci.core.ComputeClient(cfg)
          rows=compute.list_instances(compartment_id=comp, display_name='openclaw-e2-tailscale').data
          live=[x for x in rows if x.lifecycle_state not in {'TERMINATED','TERMINATING'}]
          if not live: raise SystemExit('NO_LIVE_OPENCLAW_TAILSCALE_VM')
          live.sort(key=lambda x:x.time_created, reverse=True)
          inst=live[0]
          print('INSPECT_INSTANCE_STATE='+inst.lifecycle_state)
          print('INSPECT_INSTANCE_ID='+inst.id)
          hist=compute.capture_console_history(oci.core.models.CaptureConsoleHistoryDetails(instance_id=inst.id, display_name='openclaw-readonly-inspect')).data
          for _ in range(36):
              h=compute.get_console_history(hist.id).data
              if h.lifecycle_state=='SUCCEEDED': break
              if h.lifecycle_state=='FAILED': raise SystemExit('CONSOLE_HISTORY_FAILED')
              time.sleep(5)
          else: raise SystemExit('CONSOLE_HISTORY_TIMEOUT')
          data=compute.get_console_history_content(hist.id).data
          if hasattr(data,'content'): data=data.content
          if hasattr(data,'read'): data=data.read()
          if isinstance(data,bytes): text=data.decode('utf-8','replace')
          else: text=str(data)
          safe=[]
          for line in text.splitlines():
              if re.search(r'(OPENCLAW_TAILNET_RECOVERY|OPENCLAW_TAILSCALE_FINALIZED|TAILSCALE_BACKEND_STATE|OPENCLAW_TAILSCALE_DNS|OPENCLAW_TAILSCALE_IP|OPENCLAW_READY_URL)',line):
                  safe.append(line[-500:])
          if not safe:
              print('SAFE_CONSOLE_MARKERS=none')
          else:
              print('SAFE_CONSOLE_MARKERS_BEGIN')
              print('\n'.join(safe[-30:]))
              print('SAFE_CONSOLE_MARKERS_END')
          PY
      - if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg
