name: One-off Kesher Video Canary Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kesher-video-canary-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resume current Kesher video canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kesher-daily-video.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=full \
            -f allow_additional_canary=false
          echo "Resumed the current Kesher video canary."
