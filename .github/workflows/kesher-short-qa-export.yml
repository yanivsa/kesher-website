name: Kesher Native Short Independent QA Export

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Existing GitHub Actions kesher-short-v4-state artifact ID
        type: string
        required: true
      short_item_id:
        description: Existing native Short item ID
        type: string
        required: true
      source_slug:
        description: Exact article slug
        type: string
        required: true
      source_sha256:
        description: Exact source content SHA256
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  recover-original-for-qa:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch only approved type of original immutable media artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$EXPORT_ARTIFACT_ID" =~ ^[0-9]{6,15}$ ]] || exit 2
          artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPORT_ARTIFACT_ID}" --jq .name)"
          [ "$artifact_name" = "kesher-short-v4-state" ] || { echo 'Refusing unknown artifact class'; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPORT_ARTIFACT_ID}/zip" > /tmp/kesher-short-source.zip

      - name: Validate exact native 9:16 Short and export only approved review evidence
        env:
          EXPORT_ITEM: ${{ inputs.short_item_id }}
          EXPORT_SLUG: ${{ inputs.source_slug }}
          EXPORT_SHA: ${{ inputs.source_sha256 }}
          EXPORT_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from zipfile import ZipFile
          item_id = os.environ['EXPORT_ITEM'].strip()
          slug = os.environ['EXPORT_SLUG'].strip()
          sha = os.environ['EXPORT_SHA'].strip()
          assert re.fullmatch(r'video-[0-9]{8}-[0-9]{6}-[0-9a-f]{10,64}', item_id)
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug)
          assert re.fullmatch(r'[0-9a-f]{64}', sha)
          output = Path('kesher-short-qa')
          output.mkdir(exist_ok=True)
          with ZipFile('/tmp/kesher-short-source.zip') as archive:
              state = json.loads(archive.read('state.json'))
              items = [x for x in state.get('items', []) if isinstance(x,dict) and x.get('id')==item_id]
              assert len(items)==1, 'Short item not unique'
              item = items[0]
              assert item.get('type')=='article_short'
              assert item.get('source_mode')=='direct-short', 'Not native vertical Short'
              assert item.get('source',{}).get('slug')==slug
              assert item.get('source',{}).get('content_sha256')==sha
              assert item.get('technical_verified') is True
              assert item.get('uploaded') is not True, 'Already uploaded; verify before proceeding'
              assert item.get('status') in ('pending_review','approved')
              targets=[
                (item['final_mp4'],item['final_sha256'],'short-final.mp4'),
                (item['visual_review_path'],item['visual_review_sha256'],'visual-review.png'),
                (item['transcript_path'],item['transcript_sha256'],'transcript-he.txt'),
                (item['source_path'],item['source_file_sha256'],'source-he.txt'),
                (item['manifest_path'],item['manifest_sha256'],'manifest.json'),
              ]
              frames=item.get('frame_paths') or []
              assert len(frames)==8
              for i,name in enumerate(frames,1):
                  assert name.startswith(item_id+'-frames/frame-') and name.endswith('.png')
                  targets.append((name,item['frame_sha256'][name],f'frame-{i}.png'))
              for member,expected,destination in targets:
                  assert member in archive.namelist()
                  assert sum(info.filename==member for info in archive.infolist())==1
                  digest=hashlib.sha256()
                  with archive.open(member) as src,(output/destination).open('wb') as dst:
                      while chunk:=src.read(1024*1024):
                          dst.write(chunk);digest.update(chunk)
                  assert digest.hexdigest()==expected, f'SHA256 mismatch: {destination}'
              (output/'identity.json').write_text(json.dumps({
                  'short_item_id':item_id, 'source_slug':slug, 'source_sha256':sha,
                  'artifact_id':os.environ['EXPORT_ARTIFACT_ID'],
                  'final_sha256':item['final_sha256'],
                  'native_portrait':True,'technical_verified':True,
                  'visual_review':'PENDING_INDEPENDENT_REVIEW',
                  'semantic_review':'PENDING_INDEPENDENT_REVIEW',
                  'youtube_upload':'NOT_ATTEMPTED',
              },indent=2),encoding='utf-8')
          print('SHORT_ORIGINAL_SOURCE_AND_MEDIA_HASHES_VERIFIED')
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of json kesher-short-qa/short-final.mp4 > /tmp/qa-probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/qa-probe.json'))
          streams=p['streams']
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in streams)
          assert any(s.get('codec_type')=='audio' for s in streams)
          assert 1 <= float(p['format']['duration']) <= 180
          print('SHORT_ORIGINAL_9_16_VIDEO_AUDIO_VERIFIED')
          PY

      - name: Upload only derived evidence for independent review (never to YouTube)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-short-independent-qa-${{ github.run_id }}
          path: kesher-short-qa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
