name: Repair OpenClaw Offline and Enable Tailscale Serve

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-offline-boot-repair.yml
      - scripts/oci_openclaw_offline_repair.py
      - scripts/oci_openclaw_offline_repair_v2.py
      - scripts/oci_openclaw_offline_repair_v3.py
      - scripts/oci_openclaw_helper_run_command.py
      - scripts/oci_openclaw_helper_proof.py
      - scripts/oci_openclaw_finalize_run_command.py
      - scripts/oci_openclaw_run_command_iam.py
      - scripts/oci_openclaw_wait_helper_console.py
      - scripts/oci_openclaw_verify_console.py
      - scripts/openclaw_offline_mount_repair.sh
      - scripts/openclaw_offline_mount_repair_early.sh
      - scripts/openclaw_offline_proof.sh
      - scripts/openclaw_verify_offline_repair.sh
      - scripts/encrypt_openclaw_repair_result.py
      - scripts/openclaw_publish_status.sh

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
      OPENCLAW_SECURITY_LIST_ID: ocid1.securitylist.oc1.iad.aaaaaaaapfyvmzc532rruphk3k4ldjb66aglj2npofc5q2aof6xuoudpa4aq
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Publish recovery start status
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_STATUS: in_progress
          OPENCLAW_RUN_ID: ${{ github.run_id }}
          OPENCLAW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPENCLAW_HEAD_SHA: ${{ github.sha }}
          OPENCLAW_FAILURE_HINT: workflow_started
          OPENCLAW_STATUS_ISSUE_NUMBER: '465'
          OPENCLAW_STATUS_BRANCH: ops/openclaw-status
          OPENCLAW_STATUS_PATH: openclaw-status.json
        run: |
          set -euo pipefail
          bash -n scripts/openclaw_publish_status.sh
          bash scripts/openclaw_publish_status.sh

      - name: Install OCI SDK
        run: python -m pip install 'oci==2.183.0'

      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            if [ "$code" = 403 ]; then sleep 5; continue; fi
            echo "OCI bridge returned HTTP $code" >&2
            exit 1
          done
          [ "$code" = 200 ] || { echo "OCI bridge token did not propagate in time" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
          echo OCI_BRIDGE_OK=true

      - name: Ensure OCI Run Command IAM before helper creation
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_run_command_iam.py --config /tmp/oci.cfg

      - name: Prepare repair helper and attach authenticated boot disk
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_offline_repair_v3.py \
            --config /tmp/oci.cfg \
            --result-json /tmp/offline.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/offline.json'))
          print('OFFLINE_PREPARE_STATUS='+d['status'])
          print('OFFLINE_HELPER_TRANSPORT='+d['helper_transport'])
          print('OFFLINE_TARGET_BOOT_PRESERVED=true')
          PY

      - name: Patch authenticated boot disk through OCI Run Command
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_helper_run_command.py \
            --config /tmp/oci.cfg \
            --state-json /tmp/offline.json \
            --script-file scripts/openclaw_offline_mount_repair_early.sh \
            --timeout 600

      - name: Detach repaired disk, remove helper, and relaunch OpenClaw
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_offline_repair_v2.py finish \
            --config /tmp/oci.cfg \
            --state-json /tmp/offline.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/offline.json'))
          print('OFFLINE_FINISH_STATUS='+d['status'])
          print('OPENCLAW_TARGET_STATE='+d['target_lifecycle_state'])
          print('OPENCLAW_TARGET_PUBLIC_IP='+d['target_ip'])
          PY

      - name: Allow guest finalizer to complete
        run: |
          set -euo pipefail
          echo OPENCLAW_GUEST_FINALIZER_WAIT_SECONDS=420
          sleep 420

      - name: Verify OpenClaw from preserved boot disk
        id: finalize
        run: |
          set -euo pipefail
          rm -f /tmp/openclaw-ready.json /tmp/proof.json
          python -u scripts/oci_openclaw_offline_repair_v3.py \
            --config /tmp/oci.cfg \
            --result-json /tmp/proof.json
          proof_rc=0
          set +e
          python -u scripts/oci_openclaw_helper_proof.py \
            --config /tmp/oci.cfg \
            --state-json /tmp/proof.json \
            --script-file scripts/openclaw_offline_proof.sh \
            --result-json /tmp/openclaw-ready.json \
            --timeout 600
          proof_rc=$?
          set -e
          finish_rc=0
          set +e
          python -u scripts/oci_openclaw_offline_repair_v2.py finish \
            --config /tmp/oci.cfg \
            --state-json /tmp/proof.json
          finish_rc=$?
          set -e
          [ "$finish_rc" -eq 0 ] || { echo OPENCLAW_OFFLINE_PROOF_RELAUNCH_FAILED=true; exit "$finish_rc"; }
          [ "$proof_rc" -eq 0 ] || exit "$proof_rc"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/openclaw-ready.json'))
          assert d['status'] == 'ready'
          print('OPENCLAW_READY_DNS='+d['dns'])
          print('OPENCLAW_READY_URL='+d['ready_url'])
          print('OPENCLAW_GATEWAY_RPC_OK=true')
          print('TAILSCALE_SERVE_ACTIVE=true')
          print('OPENCLAW_OFFLINE_FINALIZE_SUCCESS=true')
          print('OPENCLAW_OFFLINE_REPAIR_COMPLETE=true')
          print('OPENCLAW_STRICT_SUCCESS_PROOF=preserved-boot-disk')
          PY

      - name: Close temporary SSH
        if: ${{ always() }}
        run: |
          set +e
          if [ -s /tmp/oci.cfg ]; then
            sl="$OPENCLAW_SECURITY_LIST_ID"
            candidate=''
            if [ -s /tmp/proof.json ]; then
              candidate="$(python3 -c 'import json;print(json.load(open("/tmp/proof.json")).get("security_list_id") or "")' 2>/dev/null)"
            elif [ -s /tmp/offline.json ]; then
              candidate="$(python3 -c 'import json;print(json.load(open("/tmp/offline.json")).get("security_list_id") or "")' 2>/dev/null)"
            fi
            [ -z "$candidate" ] || sl="$candidate"
            python -u scripts/oci_openclaw_bootstrap.py --config /tmp/oci.cfg --close-ssh --security-list-id "$sl"
          fi

      - name: Publish terminal recovery status
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCLAW_RUN_ID: ${{ github.run_id }}
          OPENCLAW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPENCLAW_HEAD_SHA: ${{ github.sha }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          JOB_STATUS: ${{ job.status }}
          OPENCLAW_STATUS_ISSUE_NUMBER: '465'
          OPENCLAW_STATUS_BRANCH: ops/openclaw-status
          OPENCLAW_STATUS_PATH: openclaw-status.json
        run: |
          set -euo pipefail
          status=failure
          ready_url=''
          offline=false
          rpc=false
          serve=false
          finalize=false
          if [[ "$FINALIZE_OUTCOME" == success && -s /tmp/openclaw-ready.json ]]; then
            status=success
            ready_url="$(python3 -c 'import json; print(json.load(open("/tmp/openclaw-ready.json"))["ready_url"])')"
            offline=true
            rpc=true
            serve=true
            finalize=true
          fi
          OPENCLAW_STATUS="$status" \
          OPENCLAW_READY_URL_VALUE="$ready_url" \
          OPENCLAW_FAILURE_HINT="job_status=$JOB_STATUS; finalize_outcome=$FINALIZE_OUTCOME" \
          OPENCLAW_OFFLINE_REPAIR_COMPLETE_VALUE="$offline" \
          OPENCLAW_GATEWAY_RPC_OK_VALUE="$rpc" \
          TAILSCALE_SERVE_ACTIVE_VALUE="$serve" \
          OPENCLAW_OFFLINE_FINALIZE_SUCCESS_VALUE="$finalize" \
            bash scripts/openclaw_publish_status.sh

      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg /tmp/offline.json /tmp/proof.json /tmp/openclaw-ready.json
