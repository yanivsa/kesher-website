name: OCI Always Free OpenClaw Provision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oci-openclaw-provision.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Install pinned OCI SDK
        run: python -m pip install "oci==2.183.0"

      - name: Retrieve OCI credentials through encrypted Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          control_token="$(openssl rand -hex 32)"
          printf '%s' "$control_token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null

          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
          bridge_url="https://${BRIDGE_NAME}.${subdomain}.workers.dev"

          curl -fsS \
            -H "Authorization: Bearer ${control_token}" \
            -H "Content-Type: application/json" \
            --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json \
            "${bridge_url}/decrypt" > /tmp/oci-credentials.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/oci-credentials.json").read_text())
          required = ("user", "fingerprint", "tenancy", "region", "private_key_pem")
          if not all(data.get(k) for k in required):
              raise SystemExit("decrypted OCI bundle is incomplete")
          key = Path("/tmp/oci_api_key.pem")
          key.write_text(data["private_key_pem"])
          key.chmod(0o600)
          cfg = Path("/tmp/oci_config")
          cfg.write_text(
              "[DEFAULT]\n"
              f"user={data['user']}\n"
              f"fingerprint={data['fingerprint']}\n"
              f"tenancy={data['tenancy']}\n"
              f"region={data['region']}\n"
              f"key_file={key}\n"
          )
          cfg.chmod(0o600)
          PY
          echo "OCI_CREDENTIAL_BRIDGE_OK=true"

      - name: Generate one-time bootstrap SSH key
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f /tmp/openclaw_bootstrap_key
          runner_ip="$(curl -fsS https://api.ipify.org)"
          echo "BOOTSTRAP_CIDR=${runner_ip}/32" >> "$GITHUB_ENV"

      - name: Check A1 capacity and provision only Always Free shape
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_bootstrap.py \
            --config /tmp/oci_config \
            --ssh-public-key-file /tmp/openclaw_bootstrap_key.pub \
            --bootstrap-cidr "$BOOTSTRAP_CIDR" \
            --result-json /tmp/oci-result.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/oci-result.json"))
          print("OCI_RESULT_STATUS=" + str(d.get("status")))
          if d.get("shape"): print("OCI_RESULT_SHAPE=" + str(d["shape"]))
          if d.get("availability_domain"): print("OCI_RESULT_AD=" + str(d["availability_domain"]))
          if d.get("public_ip"): print("OCI_RESULT_PUBLIC_IP=" + str(d["public_ip"]))
          PY

      - name: Verify OpenClaw installation on the VM
        id: verify
        run: |
          set -euo pipefail
          status="$(python3 -c 'import json; print(json.load(open("/tmp/oci-result.json")).get("status",""))')"
          if [ "$status" != "created" ]; then
            echo "No new instance was created; skipping SSH verification for status=$status."
            exit 0
          fi
          ip="$(python3 -c 'import json; print(json.load(open("/tmp/oci-result.json")).get("public_ip") or "")')"
          os_name="$(python3 -c 'import json; print(json.load(open("/tmp/oci-result.json")).get("os") or "")')"
          test -n "$ip"
          if [ "$os_name" = "Canonical Ubuntu" ]; then user=ubuntu; else user=opc; fi

          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -i /tmp/openclaw_bootstrap_key "${user}@${ip}" 'echo ssh-ready' >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/openclaw_bootstrap_key "${user}@${ip}" \
            'sudo cloud-init status --wait >/dev/null; sudo test -f /var/lib/openclaw-installed; sudo cat /var/lib/openclaw-version.txt'

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/openclaw_bootstrap_key "${user}@${ip}" \
            'sudo -H bash -lc "OPENCLAW_BIN=$(command -v openclaw || find /root -type f -name openclaw -perm -111 2>/dev/null | head -1); test -n \"$OPENCLAW_BIN\"; \"$OPENCLAW_BIN\" config set agents.defaults.model.primary openai/gpt-5.6-sol"'

          echo "OPENCLAW_INSTALL_VERIFIED=true"

      - name: Close temporary SSH ingress
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/oci-result.json ] || [ ! -s /tmp/oci_config ]; then
            exit 0
          fi
          sl="$(python3 -c 'import json; print(json.load(open("/tmp/oci-result.json")).get("security_list_id") or "")')"
          if [ -n "$sl" ]; then
            python -u scripts/oci_openclaw_bootstrap.py \
              --config /tmp/oci_config \
              --close-ssh \
              --security-list-id "$sl"
          fi

      - name: Remove plaintext credentials and temporary SSH key
        if: ${{ always() }}
        run: rm -f /tmp/oci-credentials.json /tmp/oci_api_key.pem /tmp/oci_config /tmp/openclaw_bootstrap_key /tmp/openclaw_bootstrap_key.pub
