name: Repair verified financial article heroes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-financial-guidance-heroes.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kesher-financial-hero-repair
  cancel-in-progress: false

jobs:
  repair-17-legacy-financial-heroes:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Avoid concurrent duplicate migration PRs
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/finance-heroes-"))] | length')"
          if [ "$count" != "0" ]; then
            echo "Existing image migration PR is open. Do not generate duplicate paid images."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.dedupe.outputs.skip == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: steps.dedupe.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install trusted image decoder
        if: steps.dedupe.outputs.skip == 'false'
        run: python3 -m pip install -r scripts/requirements-article.txt

      - name: Generate and independently verify every image
        if: steps.dedupe.outputs.skip == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/repair-financial-guidance-heroes.py

      - name: Validate image quality and publication metadata
        if: steps.dedupe.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_financial_article_hero_quality -v
          python3 .github/scripts/validate-article-images.py

      - name: Regenerate search/social metadata and build the site
        if: steps.dedupe.outputs.skip == 'false'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run generate
          npm run build

      - name: Open reviewable migration PR (never deploy an unreviewed candidate)
        if: steps.dedupe.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "All 17 financial heroes have already been upgraded."
            exit 0
          fi
          branch="automation/finance-heroes-$RUN_ID"
          git config user.name "Kesher Financial Hero Repair"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add -f -- src/data/financialGuidancePosts.json src/data/imageDimensions.ts             src/data/postSummaries.json public/images/generated/blog             public/sitemap.xml public/rss.xml public/llms.txt public/llms-full.txt
          git diff --cached --quiet && { echo "No staged migration changes"; exit 1; }
          git commit -m "fix(blog): replace 17 financial SVG heroes with verified editorial photographs"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch"             --title "fix(blog): replace 17 financial article SVGs with verified photos"             --body "Generated with the existing trusted image pipeline. Each of the 17 article-specific photographs underwent independent pixel-level subject/quality verification. No existing article title, URL, author, date or body has been changed. CI must pass before merge."
