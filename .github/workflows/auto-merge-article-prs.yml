name: Auto-merge Kesher article PRs

# The Kesher Content Controller is the sole owner of article publication order.
# It dispatches this workflow only after the trusted image stage has reached a
# persisted terminal state (complete or best-effort deferred). Keeping this
# workflow dispatch-only prevents pull_request/CI events from racing ahead of
# the controller-owned image attempt.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

concurrency:
  group: auto-merge-kesher-article-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted article controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Select article PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json
          python3 - <<'PY' > pr-numbers.txt
          import json
          with open("open-prs.json", encoding="utf-8") as fh:
              for pr in json.load(fh):
                  print(pr["number"])
          PY

      - name: Sync, clean, repair, validate and publish article PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          dispatch_ci() {
            local ref="$1"
            python3 - "${ref}" > dispatch.json <<'PY'
          import json, sys
          print(json.dumps({"ref": sys.argv[1]}))
          PY
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d @dispatch.json \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/dispatches"
          }

          wait_for_verify() {
            local sha="$1"
            local state=""
            for _ in $(seq 1 120); do
              curl --fail-with-body -sS \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
                > check-runs.json
              state="$(python3 - <<'PY'
          import json
          data = json.load(open("check-runs.json", encoding="utf-8"))
          runs = [r for r in data.get("check_runs", []) if r.get("name") == "verify"]
          if not runs:
              print("missing|")
          else:
              runs.sort(key=lambda r: (r.get("started_at") or "", r.get("id") or 0))
              latest = runs[-1]
              print(f"{latest.get('status') or ''}|{latest.get('conclusion') or ''}")
          PY
              )"
              if [[ "${state}" == completed\|* ]]; then
                echo "Fresh verify for ${sha}: ${state}"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for fresh verify on ${sha}; last state=${state}" >&2
            return 1
          }

          run_controller_with_protection_retry() {
            local number="$1"
            local output=""
            local status=1
            for retry in $(seq 1 18); do
              set +e
              output="$(python3 .github/scripts/article-pr-controller-v3.py \
                --repo "${REPO}" \
                --pr "${number}" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "${output}"
              if [ ${status} -eq 0 ]; then
                CONTROLLER_OUTPUT="${output}"
                return 0
              fi
              if printf '%s\n' "${output}" | grep -Eq 'Required status check .* is expected'; then
                echo "Branch protection has not observed the successful verify yet; retry ${retry}/18 in 5s."
                sleep 5
                continue
              fi
              return ${status}
            done
            echo "Branch protection still has not observed verify after merge retries." >&2
            return ${status}
          }

          while read -r number; do
            [ -n "${number}" ] || continue

            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${number}" \
              > current-pr.json

            readarray -t pr_meta < <(python3 - <<'PY'
          import json
          pr = json.load(open("current-pr.json", encoding="utf-8"))
          print(pr.get("title") or "")
          print((pr.get("head") or {}).get("ref") or "")
          print((pr.get("head") or {}).get("sha") or "")
          print((pr.get("base") or {}).get("ref") or "")
          PY
            )
            pr_title="${pr_meta[0]:-}"
            head_ref="${pr_meta[1]:-}"
            head_sha="${pr_meta[2]:-}"
            base_ref="${pr_meta[3]:-}"

            if [[ "${pr_title}" == "Publish Kesher article:"* ]] && [ -n "${head_ref}" ] && [ -n "${head_sha}" ] && [ -n "${base_ref}" ]; then
              curl --fail-with-body -sS \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/compare/${base_ref}...${head_ref}" \
                > compare.json
              behind_by="$(python3 -c 'import json; print(int(json.load(open("compare.json"))["behind_by"]))')"

              if [ "${behind_by}" -gt 0 ]; then
                python3 - "${head_sha}" > update-branch.json <<'PY'
          import json, sys
          print(json.dumps({"expected_head_sha": sys.argv[1]}))
          PY
                curl --fail-with-body -sS -X PUT \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  -d @update-branch.json \
                  "https://api.github.com/repos/${REPO}/pulls/${number}/update-branch" \
                  > update-result.json

                new_head_sha="${head_sha}"
                for _ in $(seq 1 20); do
                  sleep 2
                  curl --fail-with-body -sS \
                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${REPO}/pulls/${number}" \
                    > refreshed-pr.json
                  new_head_sha="$(python3 -c 'import json; print(json.load(open("refreshed-pr.json"))["head"]["sha"])')"
                  [ "${new_head_sha}" != "${head_sha}" ] && break
                done
                if [ "${new_head_sha}" = "${head_sha}" ]; then
                  echo "Article PR #${number} update-branch did not advance the head in time." >&2
                  exit 1
                fi

                dispatch_ci "${head_ref}"
                echo "Auto-synced article PR #${number} with ${base_ref}; waiting for fresh CI on ${new_head_sha}."
                wait_for_verify "${new_head_sha}"
              fi
            fi

            for controller_pass in 1 2; do
              CONTROLLER_OUTPUT=""
              if ! run_controller_with_protection_retry "${number}"; then
                exit 1
              fi
              controller_output="${CONTROLLER_OUTPUT}"

              if printf '%s\n' "${controller_output}" | grep -q "Auto-cleaned forbidden article paths"; then
                curl --fail-with-body -sS \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${REPO}/pulls/${number}" \
                  > cleaned-pr.json
                head_ref="$(python3 -c 'import json; print(json.load(open("cleaned-pr.json"))["head"]["ref"])')"
                cleaned_head_sha="$(python3 -c 'import json; print(json.load(open("cleaned-pr.json"))["head"]["sha"])')"
                dispatch_ci "${head_ref}"
                echo "Dispatched fresh CI for cleaned article PR #${number} on ${cleaned_head_sha}."
                wait_for_verify "${cleaned_head_sha}"
                continue
              fi
              break
            done
          done < pr-numbers.txt
