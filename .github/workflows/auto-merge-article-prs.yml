name: Auto-merge Kesher article PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-kesher-article-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible article PRs after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$@"
          }

          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            python3 - <<'PY' > pr-numbers.txt
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              print(json.load(fh)["pull_request"]["number"])
          PY
          else
            api "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" > open-prs.json
            python3 - <<'PY' > pr-numbers.txt
          import json
          with open("open-prs.json", encoding="utf-8") as fh:
              for pr in json.load(fh):
                  print(pr["number"])
          PY
          fi

          while read -r number; do
            [ -n "${number}" ] || continue
            api "https://api.github.com/repos/${REPO}/pulls/${number}" > pr.json
            api "https://api.github.com/repos/${REPO}/pulls/${number}/files?per_page=100" > files.json
            sha="$(python3 -c 'import json; print(json.load(open("pr.json"))["head"]["sha"])')"
            api "https://api.github.com/repos/${REPO}/commits/${sha}/check-runs?per_page=100" > checks.json

            if ! python3 - <<'PY'
          import json, sys, re
          pr = json.load(open("pr.json"))
          files = [f["filename"] for f in json.load(open("files.json"))]
          checks = json.load(open("checks.json")).get("check_runs", [])
          allowed_files = {"src/data/posts.json", "public/sitemap.xml", "public/llms.txt", "public/llms-full.txt"}
          has_image_claim = (pr.get("body") or "").find("https://") != -1 and re.search(r"[0-9a-f]{64}", pr.get("body") or "")
          has_new_image = any(f.startswith("public/images/generated/blog/") for f in files)
          if has_new_image and not has_image_claim:
              sys.exit(1)
          allowed = all(f in allowed_files or f.startswith("public/images/generated/blog/") for f in files)
          ci_passed = any(c.get("name") == "verify" and c.get("conclusion") == "success" for c in checks)
          eligible = (
              pr.get("state") == "open"
              and not pr.get("draft")
              and pr["base"]["ref"] == "main"
              and pr["head"]["repo"]["full_name"] == pr["base"]["repo"]["full_name"]
              and "src/data/posts.json" in files
              and allowed
              and ci_passed
          )
          sys.exit(0 if eligible else 1)
          PY
            then
              echo "PR #${number} is not an eligible, CI-passing article PR."
              continue
            fi

            api -X PUT \
              -d '{"commit_title":"Auto-merge validated Kesher article","merge_method":"squash"}' \
              "https://api.github.com/repos/${REPO}/pulls/${number}/merge"
          done < pr-numbers.txt
