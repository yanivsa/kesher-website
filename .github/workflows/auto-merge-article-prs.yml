name: Auto-merge Kesher article PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-kesher-article-prs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible article PRs after CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$@"
          }

          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            python3 - <<'PY' > pr-numbers.txt
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              print(json.load(fh)["pull_request"]["number"])
          PY
          else
            api "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" > open-prs.json
            python3 - <<'PY' > pr-numbers.txt
          import json
          with open("open-prs.json", encoding="utf-8") as fh:
              for pr in json.load(fh):
                  print(pr["number"])
          PY
          fi

          while read -r number; do
            [ -n "${number}" ] || continue
            api "https://api.github.com/repos/${REPO}/pulls/${number}" > pr.json
            api "https://api.github.com/repos/${REPO}/pulls/${number}/files?per_page=100" > files.json
            sha="$(python3 -c 'import json; print(json.load(open("pr.json"))["head"]["sha"])')"
            api "https://api.github.com/repos/${REPO}/commits/${sha}/check-runs?per_page=100" > checks.json

            if ! python3 - <<'PY'
          import json, sys, re, urllib.request, hashlib, os
          pr = json.load(open("pr.json"))
          files_data = json.load(open("files.json"))
          files = [f["filename"] for f in files_data]
          checks = json.load(open("checks.json")).get("check_runs", [])
          allowed_files = {"src/data/posts.json", "public/sitemap.xml", "public/llms.txt", "public/llms-full.txt"}
          allowed = all(f in allowed_files or f.startswith("public/images/generated/blog/") for f in files)
          ci_passed = any(c.get("name") == "verify" and c.get("conclusion") == "success" for c in checks)

          image_file = next((f for f in files_data if f["filename"].startswith("public/images/generated/blog/")), None)
          if image_file:
              match = re.search(r"Image SHA-256:\s*([a-f0-9]{64})", pr.get("body") or "")
              if not match:
                  print("Missing or invalid Image SHA-256 in PR body")
                  sys.exit(1)
              expected_sha = match.group(1).lower()

              url = image_file["raw_url"]
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"} if "GITHUB_TOKEN" in os.environ else {})
              try:
                  with urllib.request.urlopen(req) as response:
                      img_data = response.read()
                      actual_sha = hashlib.sha256(img_data).hexdigest()
                      if expected_sha != actual_sha:
                          print(f"Hash mismatch! Expected {expected_sha}, got {actual_sha}")
                          sys.exit(1)
              except Exception as e:
                  print(f"Failed to fetch image: {e}")
                  sys.exit(1)

          eligible = (
              pr.get("state") == "open"
              and not pr.get("draft")
              and pr["base"]["ref"] == "main"
              and pr["head"]["repo"]["full_name"] == pr["base"]["repo"]["full_name"]
              and "src/data/posts.json" in files
              and allowed
              and ci_passed
          )
          sys.exit(0 if eligible else 1)
          PY
            then
              echo "PR #${number} is not an eligible, CI-passing article PR."
              continue
            fi

            api -X PUT \
              -d '{"commit_title":"Auto-merge validated Kesher article","merge_method":"squash"}' \
              "https://api.github.com/repos/${REPO}/pulls/${number}/merge"
          done < pr-numbers.txt
