name: Kesher Exact Backlog Media Recovery

on:
  workflow_dispatch:
    inputs:
      target_slug:
        description: Exact published article slug to recover
        required: true
        type: string
      target_content_sha256:
        description: Exact authoritative article content SHA-256
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-exact-backlog-media-${{ inputs.target_slug }}
  cancel-in-progress: false

jobs:
  seed-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KESHER_STATE_DIR: ${{ github.workspace }}/.kesher-video-state
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Install minimal exact-seed dependency
        run: python -m pip install requests==2.33.0

      - name: Restore newest valid long-video state
        run: |
          set -euo pipefail
          mkdir -p "$KESHER_STATE_DIR"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=kesher-video-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].id' > /tmp/artifacts.txt
          restored="false"
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            archive="$(mktemp /tmp/kesher-video-state.XXXXXX.zip)"
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive" 2>/dev/null; then
              rm -f "$archive"
              continue
            fi
            temp_extract="$(mktemp -d)"
            if unzip -oq "$archive" -d "$temp_extract" 2>/dev/null \
              && [ -s "$temp_extract/state.json" ] \
              && python -c 'import json,sys; s=json.load(sys.stdin); assert s.get("version")==1 and isinstance(s.get("items"),list)' < "$temp_extract/state.json" 2>/dev/null; then
              cp -r "$temp_extract/"* "$KESHER_STATE_DIR/" || true
              restored="true"
              rm -f "$archive"
              rm -rf "$temp_extract"
              break
            fi
            rm -f "$archive"
            rm -rf "$temp_extract"
          done < /tmp/artifacts.txt
          if [ "$restored" != "true" ]; then
            printf '{"version":1,"items":[],"updated_at":null}\n' > "$KESHER_STATE_DIR/state.json"
          fi

      - name: Seed or resume exact article identity
        run: |
          python -u scripts/kesher_exact_video_target.py \
            --slug "${{ inputs.target_slug }}" \
            --content-sha256 "${{ inputs.target_content_sha256 }}"

      - name: Persist exact durable handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-video-state
          path: ${{ env.KESHER_STATE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Resume canonical long-video pipeline
        run: gh workflow run kesher-daily-video.yml -f operation=full
