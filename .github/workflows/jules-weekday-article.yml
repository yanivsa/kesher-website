name: Jules Weekday Kesher Article
on:
  schedule:
    # 00:35 Sunday-Thursday in Israel during daylight saving. Cron weekdays
    # are UTC, so Saturday-Wednesday UTC map to the intended local days.
    # The local-day guard below still protects Friday/Saturday across DST.
    - cron: "35 21 * * 6,0,1,2,3"
  workflow_dispatch:
    inputs:
      inspect_session_id:
        description: "Optional Jules session ID to inspect without starting a new article"
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: jules-weekday-kesher-article
  cancel-in-progress: false
jobs:
  inspect-jules:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_session_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Jules session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.inspect_session_id }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"
          python3 - <<'PY'
          import json, os, urllib.request
          sid = os.environ["SESSION_ID"].removeprefix("sessions/")
          req = urllib.request.Request(
              f"https://jules.googleapis.com/v1alpha/sessions/{sid}",
              headers={"x-goog-api-key": os.environ["JULES_API_KEY"]},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          print("Jules state:", data.get("state"))
          print("Jules updateTime:", data.get("updateTime"))
          print("Jules URL:", data.get("url"))
          prs=[]
          for output in data.get("outputs") or []:
              pr=(output or {}).get("pullRequest") or {}
              if pr.get("url"):
                  prs.append(pr.get("url"))
          print("Pull requests:", prs or "none")
          PY

  start-jules:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.inspect_session_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Skip Friday and Saturday in Israel
        id: local_day
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Jerusalem date +%u)"
          if [ "$day" = "5" ] || [ "$day" = "6" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local day is Friday/Saturday in Israel; skipping article run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository instruction sources
        if: steps.local_day.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Stop if article PR is already open
        if: steps.local_day.outputs.skip != 'true'
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > open-prs.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import sys
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          pattern = re.compile(
              r"(kesher article|weekday article|blog article|posts\.json|"
              r"auto[- ]?publish|publish article|new article|מאמר)",
              re.I,
          )
          now = dt.datetime.now(dt.UTC)
          repo = os.environ.get("GITHUB_REPOSITORY", "yanivsa/kesher-website")
          token = os.environ.get("GITHUB_TOKEN", "")
          def is_fresh(pr):
              updated = dt.datetime.fromisoformat(pr["updated_at"].replace("Z", "+00:00"))
              return now - updated <= dt.timedelta(days=3)
          def is_noop(pr):
              text = f"{pr.get('title') or ''}\n{pr.get('body') or ''}"
              return bool(re.search(r"\bno[- ]?op\b|no files were edited|no Jules session", text, re.I))
          def is_repair_or_review(pr):
              title = pr.get("title", "")
              if title.startswith("[jules-review]"):
                  return True
              return bool(re.search(r"(repair|validator|workflow|automation)", title, re.I))
          def modifies_posts_json(pr_number):
              url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100"
              headers = {
                  "User-Agent": "python-urllib",
                  "Accept": "application/vnd.github+json"
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.headers.get('Link') and 'rel="next"' in response.headers.get('Link'):
                          print(f"External infrastructure error: PR #{pr_number} has too many files (pagination required but unsupported).")
                          sys.exit(1)
                      files = json.loads(response.read().decode())
                      for f in files:
                          if f.get("filename") == "src/data/posts.json":
                              return True
              except urllib.error.HTTPError as e:
                  print(f"External infrastructure error: GitHub API returned {e.code} when checking PR #{pr_number} files.")
                  sys.exit(1)
              except urllib.error.URLError as e:
                  print(f"External infrastructure error: Network failure when checking PR #{pr_number} files.")
                  sys.exit(1)
              except Exception as e:
                  print(f"External infrastructure error: JSON parse or other failure when checking PR #{pr_number} files.")
                  sys.exit(1)
              return False
          blockers = []
          for pr in prs:
              if not is_fresh(pr) or is_noop(pr):
                  continue

              if is_repair_or_review(pr):
                  continue
              text_match = (
                  pattern.search(pr.get("title") or "")
                  or pattern.search((pr.get("head") or {}).get("ref") or "")
                  or pattern.search(pr.get("body") or "")
              )

              if text_match and modifies_posts_json(pr["number"]):
                  blockers.append(f"#{pr['number']} {pr['title']} ({pr.get('html_url', 'No URL')})")
          launch_required = not bool(blockers)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"launch_required={'true' if launch_required else 'false'}\n")

          if blockers:
              msg = "Open Kesher article PR exists; no Jules session will be started.\n"
              print(msg)
              for blocker in blockers[:20]:
                  print(f"- {blocker}")
              if "GITHUB_STEP_SUMMARY" in os.environ:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                      out.write("### Jules Session Skipped\n\n")
                      out.write("Jules session intentionally skipped because the following fresh article PRs are open:\n")
                      for blocker in blockers[:20]:
                          out.write(f"- {blocker}\n")
          PY
      - name: Start Jules autonomous article session
        if: steps.local_day.outputs.skip != 'true' && steps.article_gate.outputs.launch_required == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"
          if [ ! -s ".github/prompts/jules-weekday-article-update.md" ]; then
            echo "::error::Required Jules article policy is missing or empty; no session was created."
            exit 1
          fi
          cat > payload.json <<'JSON'
          {
            "title": "Weekday Kesher Hebrew article",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, Start clicks, plan approval, topic approval, image approval, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest high-quality repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT write about, mention, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere in the article, keywords, metadata, or prompts.\n\nBefore writing, read:\n- src/data/posts.json (Check the 30 most recent articles to strictly avoid near-duplicate topics and repetitive themes. A new article MUST have a substantially fresh topic and slug, otherwise content validation will fail for being too similar to recent articles.)\n\nCreate exactly ONE new Hebrew blog article per run. Do not catch up backlog. Do not create more than one article. Do not duplicate an existing post topic, title, slug, hook, keyword, or angle.\n\nLanguage and voice requirements:\n- Hebrew only. Do not create English, Russian, Ukrainian, or multilingual variants.\n- Write in natural contemporary Israeli Hebrew, the way thoughtful Israelis actually speak and write, with varied sentence lengths and concrete everyday Israeli details.\n- Avoid translated-English phrasing, AI-like summaries, corporate therapy jargon, filler paragraphs, repetitive generic advice, stock AI/translated metaphors, and inflated formulaic phrases. FORBIDDEN EXAMPLES: \"גשר מעל התהום\", \"שריר של שיח\", \"הפרויקט המשותף הגדול הסתיים\", \"רעש רגשי גדול\", \"עמדה של יצירה משותפת\", \"מייצר ואקום אדיר\", \"הזדמנות פז אמיתית ומעשית\", \"הילדים הם הדבק החזק ביותר\", \"השקט לא חייב להיות אויב\", \"אזור הנוחות החדש\", \"הסקרנות היא המפתח\", \"להפסיק לנהל ולהתחיל לחיות\", \"תוקף רגשי\", \"המערכת תתאזן מעצמה\", and \"הדבר הנכון הוא פשוט\" (allow genuinely literal contexts only if a validator can distinguish them; otherwise forbid these exact phrases in new article prose).\n- Prefer short clear sentences, concrete everyday examples, and emotionally accurate language.\n- Sound like a warm, experienced Israeli professional writing to parents or couples, not like an SEO bot.\n- Keep SEO keywords natural; never force a keyword if it makes the sentence sound unnatural.\n\nArticle requirements:\n- Relevant to couples counseling, parenting guidance, ADHD parenting, co-parenting, communication, boundaries, emotional regulation, or family conflict repair.\n- Do not write about, mention, or refer to divorce (גירושין), legal services, or mediation (גישור) in the article. Focus purely on couples communication, conflict resolution, parenting guidance, and family harmony.\n- Create a compelling hook before writing: one concrete, emotionally recognizable real-life couple/parent/family situation or sharp question that makes the reader feel this is exactly my problem.\n- Start the published article with that hook; do not start with a generic definition, generic SEO intro, or broad background.\n- The hook must be specific to the selected topic and must not repeat hooks used by existing posts.\n- Immediately after the hook, include a direct 40-80 word answer-first / BLUF paragraph. After the concrete hook, the 40-80 word BLUF must state actionable guidance the reader can do now; background, restating the problem, or motivational framing does not count.\n- Body length must be 700-1,100 Hebrew words excluding metadata, title, excerpt, and navigation. Do not submit a short article.\n- Use at least 5 practical H3 question sections.\n- Include concrete everyday examples, not vague advice.\n- Include at least one practical exercise or conversation script readers can try.\n- Keep Shira's warm, practical, professional tone.\n- Include a soft CTA in the article body, without pushy sales language.\n- Do not give legal or clinical promises.\n- Before opening a PR, self-check that the article is not generic, not repetitive, sounds natural in Israeli Hebrew,Image and Video requirements:\n- Every new article MUST have both a local image AND a vibrant 9:16 mobile Remotion video file saved locally and wired into src/data/posts.json.\n- 3-Tier Image Pipeline:\n  1. Try AI image generation using `node scripts/generate-article-image.js <slug> <title> '<specific visual scene description>'`.\n  2. Uses Gemini API / DeepAI API if keys configured.\n  3. Automatic fallback to high-quality royalty-free photography (Unsplash/Pexels) saved to public/images/generated/blog/<slug>.jpg.\n  4. Generate rich SEO metadata `imageAlt` containing target Hebrew keywords (יועצת זוגית, הדרכת הורים, אשדוד, etc.) in posts.json.\n- Vibrant Remotion Video Generation:\n  1. Always run `node scripts/render-article-video.js <slug>`.\n  2. Generates an exciting, vibrant, colorful 9:16 vertical video for mobile (Reels/Shorts format) with animated cards, smooth transitions, and dynamic typography.\n  3. Save video to public/videos/generated/<slug>.mp4 and set `video: \"/videos/generated/<slug>.mp4\"` in posts.json.\n\nAllowed edits:\n- src/data/posts.json\n- public/images/generated/blog/ only for a new custom-generated or custom-selected article image\n- public/sitemap.xml if needed\n- public/llms.txt if needed\n- public/llms-full.txt only if it exists or repo docs require it\n\nOpen PR gate:\nBefore writing, fetch/prune remote branches and inspect current open PRs only. Ignore deleted branches, closed PRs, stale local refs, and old completed Jules sessions. Block only if a currently open, non-no-op PR already modifies src/data/posts.json or is clearly a fresh Kesher article PR. If the only match is a stale/deleted branch or closed PR, continue and create today's single article. If a real current article PR exists, finish with a plain session summary only; do not edit files, do not create a no-op PR, and do not ask the user what to do.\n\nRun npm run check.\n\nCreate one PR automatically only for this single article and minimal index updates. PR summary must include selected keyword, topic, hook, category, selected image URL and source (record the exact image source ID/URL without secrets, whether configured API or fallback was used, and one concrete visual-verification sentence describing what is actually visible; never claim image success without this evidence), changed files, validation commands, skipped checks, and confirmation that no manual Start/approval was required.\n\nOn any validation/API/image failure, log it explicitly and never produce false-success or a no-op PR. If there is no real automation diff, finish as a clearly logged no-op without opening a PR.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              },
              "environmentVariablesEnabled": true
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON
          python3 - <<'PY'
          from datetime import datetime
          import json
          from zoneinfo import ZoneInfo
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          stale_media_block = "\n".join([
              "Image and Video requirements:",
              "- Every new article MUST have both a local image AND a vibrant 9:16 mobile Remotion video file saved locally and wired into src/data/posts.json.",
              "- 3-Tier Image Pipeline:",
              "  1. Try AI image generation using `node scripts/generate-article-image.js <slug> <title> '<specific visual scene description>'`.",
              "  2. Uses Gemini API / DeepAI API if keys configured.",
              "  3. Automatic fallback to high-quality royalty-free photography (Unsplash/Pexels) saved to public/images/generated/blog/<slug>.jpg.",
              "  4. Generate rich SEO metadata `imageAlt` containing target Hebrew keywords (יועצת זוגית, הדרכת הורים, אשדוד, etc.) in posts.json.",
              "- Vibrant Remotion Video Generation:",
              "  1. Always run `node scripts/render-article-video.js <slug>`.",
              "  2. Generates an exciting, vibrant, colorful 9:16 vertical video for mobile (Reels/Shorts format) with animated cards, smooth transitions, and dynamic typography.",
              "  3. Save video to public/videos/generated/<slug>.mp4 and set `video: \"/videos/generated/<slug>.mp4\"` in posts.json.",
          ])
          current_media_block = "\n".join([
              "Image requirements:",
              "- Use exactly three image tiers in this order: DeepAI, then Gemini, then independently source- and pixel-verified royalty-safe Unsplash/Pexels fallback.",
              "- Record `Image Generation Attempt` truthfully as `DeepAI`, `DeepAI/Gemini`, or `DeepAI/Gemini/Fallback pool`; no-image requires the full chain.",
              "- Keep a local image and image metadata only when the provider/source URL, committed SHA-256, actual dimensions, and concrete visual match are all verified and mutually consistent.",
              "- If image generation or visual verification fails, use the truthful no-image fallback and omit the image file, `image`, and `imageAlt`.",
              "- Article publication runs do not generate videos. Do not run the Remotion renderer, add a `video` field, or commit anything under `public/videos/`. Placeholder or header-only MP4 files are forbidden.",
          ])
          if stale_media_block not in payload["prompt"]:
              raise SystemExit("Expected stale article media block was not found for deterministic replacement")
          payload["prompt"] = payload["prompt"].replace(stale_media_block, current_media_block)
          payload["prompt"] += "\n\nImage Provenance: Any image PR body must use exact structured lines `Image Source URL: https://...` and `Image SHA-256: <64 lowercase hex>`, include dimensions, and a factual visual-match sentence. If no image is independently source- and pixel-verified, require truthful no-image fallback: omit/remove the image file and post `image` field, and state the fallback."
          payload["prompt"] += "\n\nConstraints: Invented names must be explicitly hypothetical or omitted. No guarantees that grief/relationship dynamics self-resolve. Do not use generic final H3 headings like \"סיכום\" or \"צעדים הבאים\" (ordinary prose is allowed)."
          payload["prompt"] += "\n\nCompletion: Before completion/ready state after a requested repair, require a changed authoritative remote PR head, exact remote file/body evidence, and fresh successful verify CI on that head; local-only or unchanged-head completion is forbidden."

          payload["prompt"] = payload["prompt"].replace(
              "She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT write about, mention, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere in the article, keywords, metadata, or prompts.",
              "She is a couples counselor (יועצת זוגית), parenting guide/facilitator (מנחת הורים / הדרכת הורים), and certified mediator (מגשרת מוסמכת). She is a lawyer by training who moved into guidance, counseling, mediation, and education. Do not offer legal services or discuss legal proceedings."
          ).replace(
              "- Relevant to couples counseling, parenting guidance, ADHD parenting, co-parenting, communication, boundaries, emotional regulation, or family conflict repair.",
              "- Relevant to the full current topic pool in the authoritative policy below, including couples counseling, late singleness and finding a relationship, dating, parenting guidance, gifted children, executive functions, educational transitions, immigrant and returning families, mediation, communication, boundaries, emotional regulation, or family conflict repair."
          ).replace(
              "- Do not write about, mention, or refer to divorce (גירושין), legal services, or mediation (גישור) in the article. Focus purely on couples communication, conflict resolution, parenting guidance, and family harmony.",
              "- Do not write about divorce (גירושין), legal services, court proceedings, or legal representation. Mediation articles are allowed only as voluntary, neutral facilitation of dialogue and agreements, as defined in the authoritative policy below."
          )
          with open(".github/prompts/jules-weekday-article-update.md", encoding="utf-8") as fh:
              updated_article_policy = fh.read()
          payload["prompt"] += "\n\nAUTHORITATIVE CURRENT ARTICLE POLICY — this section supersedes every earlier conflicting service definition or topic prohibition:\n\n" + updated_article_policy
          forbidden_stale_rules = [
              "She is strictly defined as a couples counselor",
              "Do NOT write about, mention, or refer to divorce",
              "Do not write about, mention, or refer to divorce",
              "Every new article MUST have both a local image AND a vibrant 9:16 mobile Remotion video",
              "Always run `node scripts/render-article-video.js",
          ]
          if any(rule in payload["prompt"] for rule in forbidden_stale_rules):
              raise SystemExit("Stale contradictory Jules article rule remains in runtime prompt")
          payload["prompt"] += "\n\nStrict Hebrew-only gate: the new article title, excerpt, and rendered content must contain no Latin letters `A-Z` or `a-z`, including English terminology, acronyms, parenthetical translations, headings, CTA text, or image captions. Keep machine identifiers such as id/slug/image path in ASCII as required by the repo, but visible article prose must be Hebrew-only. Before opening a PR, scan the new visible fields with `/[A-Za-z]/`; if any match remains, replace it with natural Hebrew and rerun `npm run check`."
          payload["prompt"] += "\n\nAutonomy rule: an auto-approved/generated plan must be executed immediately; never restate it and ask permission or enter AWAITING_USER_FEEDBACK."
          payload["prompt"] += "\n\nInstruction-source integrity rule: before planning, verify that `src/data/posts.json`, `package.json`, and the repository article policy are present and readable. If any required source is missing or unreadable, log the exact path and failure, do not guess or silently weaken the requirements, do not claim success, and finish without a branch, commit, or PR."
          israel_date = datetime.now(ZoneInfo("Asia/Jerusalem")).date().isoformat()
          payload["prompt"] += f"\n\nRuntime publication date: use `{israel_date}` as the new article date unless an explicit repository rule requires another date. Never silently future-date the article."
          payload["prompt"] += "\n\nFinal submission contract: before commit or PR, remove every scratch/helper/cache/temporary file and run `git diff --name-only origin/main...HEAD` after refreshing current main. The final diff may contain only `src/data/posts.json`, `src/data/postSummaries.json`, an independently verified new image under `public/images/generated/blog/`, and minimal generated sitemap/llms files required for this one article. Files such as `add_post.py` are forbidden. This is an article publication, not an audit: the non-draft PR title must start with `Publish Kesher article:` and must never use a `[jules-automerge] Kesher content review:`, mobile-review, or SEO-review prefix."
          payload["prompt"] += "\n\nGenerated-index integrity gate: run `npm run generate` only after the final `src/data/posts.json` edit. Extract the new article id and require it exactly once in `src/data/posts.json`, `src/data/postSummaries.json`, `public/sitemap.xml`, and the required llms output. Stale summaries for older articles, a missing current summary, generated files created before the final article edit, or a PR body file list that differs from the remote GitHub diff are hard failures; repair them before push/PR and never claim success."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          API = "https://jules.googleapis.com/v1alpha"
          api_key = os.environ["JULES_API_KEY"]
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          def call(method, url, body=None):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode("utf-8")
              headers = {"x-goog-api-key": api_key}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              last = None
              for retry in range(4):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      last = exc
                      if exc.code not in (429, 500, 502, 503, 504):
                          raise
                  except urllib.error.URLError as exc:
                      last = exc
                  time.sleep(2 ** retry)
              raise RuntimeError(f"Jules API request failed after retries: {last}")

          def summarize(data):
              state = data.get("state") or "UNKNOWN"
              print(f"Jules state: {state}; updateTime={data.get('updateTime')}")
              return state

          def pr_urls(data):
              urls = []
              for output in data.get("outputs") or []:
                  pr = (output or {}).get("pullRequest") or {}
                  if pr.get("url"):
                      urls.append(pr["url"])
              return urls

          def create_session(attempt):
              data = call("POST", f"{API}/sessions", payload)
              name = data.get("name") or data.get("id")
              url = data.get("url") or data.get("agentUrl") or data.get("sessionUrl")
              if not name or not url:
                  raise RuntimeError(f"Jules create response missing session identity: {data}")
              if not str(name).startswith("sessions/"):
                  name = f"sessions/{name}"
              print(f"Jules attempt {attempt} started: {name}")
              print(f"URL: {url}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(f"### Jules article attempt {attempt}\n\n- Session: `{name}`\n- URL: {url}\n")
              return name, url

          def poll(name, attempt):
              sid = name.split("/", 1)[-1]
              feedback_sent = False
              approval_sent = False
              paused_nudged = False
              for minute in range(36):
                  data = call("GET", f"{API}/sessions/{sid}")
                  state = summarize(data)
                  urls = pr_urls(data)
                  if urls:
                      print("Jules PR:", urls[0])
                      return True
                  if state == "COMPLETED":
                      print("::error::Jules completed without a pull request output.")
                      return False
                  if state == "FAILED":
                      print("::error::Jules session failed.")
                      return False
                  if state == "AWAITING_USER_FEEDBACK" and not feedback_sent:
                      call("POST", f"{API}/sessions/{sid}:sendMessage", {"prompt": "Continue autonomously. Do not ask for confirmation or feedback. Complete the single article, validate it, and create the PR."})
                      feedback_sent = True
                      print("Sent autonomous-continuation message to Jules.")
                  elif state == "AWAITING_PLAN_APPROVAL" and not approval_sent:
                      call("POST", f"{API}/sessions/{sid}:approvePlan", {})
                      approval_sent = True
                      print("Approved Jules plan automatically.")
                  elif state == "PAUSED" and not paused_nudged:
                      call("POST", f"{API}/sessions/{sid}:sendMessage", {"prompt": "Resume and finish the article autonomously, including creating the PR."})
                      paused_nudged = True
                      print("Sent resume message to paused Jules session.")
                  time.sleep(60)
              print("::error::Jules did not produce a PR within 36 minutes; deleting stale session before retry.")
              try:
                  call("DELETE", f"{API}/sessions/{sid}")
              except Exception as exc:
                  print(f"Warning: failed to delete timed-out Jules session: {exc}")
              return False

          for attempt in range(1, 5):
              name, _ = create_session(attempt)
              if poll(name, attempt):
                  sys.exit(0)
              if attempt < 4:
                  print(f"Jules attempt {attempt} did not produce a PR; starting controlled attempt {attempt + 1} of 4.")

          print("::error::All 4 Jules article attempts failed to produce a PR.")
          sys.exit(1)
          PY
