name: Jules Weekday Kesher Article

on:
  schedule:
    # 00:35 Israel time during daylight saving. The job also checks local day
    # before starting Jules, so Friday/Saturday are skipped even across DST.
    - cron: "35 21 * * 0,1,2,3,4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-weekday-kesher-article
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Friday and Saturday in Israel
        id: local_day
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Jerusalem date +%u)"
          if [ "$day" = "5" ] || [ "$day" = "6" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local day is Friday/Saturday in Israel; skipping article run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if article PR is already open
        if: steps.local_day.outputs.skip != 'true'
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          pattern = re.compile(
              r"(kesher article|weekday article|blog article|posts\.json|"
              r"auto[- ]?publish|publish article|new article|מאמר)",
              re.I,
          )
          now = dt.datetime.now(dt.UTC)

          def is_fresh(pr):
              updated = dt.datetime.fromisoformat(pr["updated_at"].replace("Z", "+00:00"))
              return now - updated <= dt.timedelta(days=3)

          def is_noop(pr):
              text = f"{pr.get('title') or ''}\n{pr.get('body') or ''}"
              return re.search(r"\bno[- ]?op\b|no files were edited|no Jules session", text, re.I)

          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if is_fresh(pr)
              and not is_noop(pr)
              and (
                  pattern.search(pr.get("title") or "")
                  or pattern.search((pr.get("head") or {}).get("ref") or "")
                  or pattern.search(pr.get("body") or "")
              )
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")
          if blockers:
              print("Open Kesher article PR exists; no Jules session will be started.")
              for blocker in blockers[:20]:
                  print(f"- {blocker}")
          PY

      - name: Start Jules autonomous article session
        if: steps.local_day.outputs.skip != 'true' && steps.article_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Weekday Kesher Hebrew article",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, Start clicks, plan approval, topic approval, image approval, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest high-quality repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני as represented by the current code. If docs disagree on Hebrew spelling, preserve the canonical spelling already used in src/constants/siteConfig.ts and visible site copy. She is a parenting facilitator / parenting guide, couples counselor, and family mediator in Ashdod and online.\n\nBefore writing, read:\n- seo.md\n- geo.md\n- plan.md\n- src/data/posts.json\n\nCreate exactly ONE new Hebrew blog article per run. Do not catch up backlog. Do not create more than one article. Do not duplicate an existing post topic, title, slug, hook, keyword, or angle.\n\nLanguage and voice requirements:\n- Hebrew only. Do not create English, Russian, Ukrainian, or multilingual variants.\n- Write in natural Israeli Hebrew, the way thoughtful Israelis actually speak and write.\n- Avoid translated-English phrasing, AI-like summaries, corporate therapy jargon, filler paragraphs, and repetitive generic advice.\n- Prefer short clear sentences, concrete everyday examples, and emotionally accurate language.\n- Sound like a warm, experienced Israeli professional writing to parents or couples, not like an SEO bot.\n- Keep SEO keywords natural; never force a keyword if it makes the sentence sound unnatural.\n\nArticle requirements:\n- Relevant to couples counseling, parenting guidance, ADHD parenting, co-parenting, family mediation, relationship mediation, communication, boundaries, emotional regulation, or family conflict repair.\n- Do not write about, mention, or refer to divorce (גירושין) or separation (פרידה) in the article. Focus purely on mediation (גישור), couples communication, conflict resolution, and family harmony.\n- Use local/long-tail SEO from seo.md, especially Ashdod-focused and practical search-intent topics.\n- Create a compelling hook before writing: one concrete, emotionally recognizable real-life couple/parent/family situation or sharp question that makes the reader feel this is exactly my problem.\n- Start the published article with that hook; do not start with a generic definition, generic SEO intro, or broad background.\n- The hook must be specific to the selected topic and must not repeat hooks used by existing posts.\n- Immediately after the hook, include a 40-80 word answer-first / BLUF paragraph.\n- Body length must be 700-1,100 Hebrew words excluding metadata, title, excerpt, and navigation. Do not submit a short article.\n- Use at least 5 practical H3 question sections.\n- Include concrete everyday examples, not vague advice.\n- Include at least one practical exercise or conversation script readers can try.\n- Keep Shira's warm, practical, professional tone.\n- Include a soft CTA in the article body, without pushy sales language.\n- Do not give legal or clinical promises.\n- Before opening a PR, self-check that the article is not generic, not repetitive, sounds natural in Israeli Hebrew, includes the DeepAI/local image path, and meets the word-count and CTA requirements. If it fails, revise it before creating the PR.\n\nImage requirements:\n- Every new article must include exactly one high-quality image in the existing image field.\n- Preferred path: generate a warm, realistic, royalty-safe article image with DeepAI. To execute the image generation script, use the DeepAI API key: "${{ secrets.DEEPAI_API_KEY }}" by setting it in the environment variable DEEPAI_API_KEY.\n- DeepAI prompt must describe a natural Israeli home/clinic conversation scene that fits the article topic: couples talking, parent-child connection, family mediation, calm home conversation, ADHD parenting, co-parenting, or reflective family moments.\n- DeepAI image style: realistic editorial photography, warm natural light, modest everyday Israeli setting, emotionally respectful, no text, no logos, no watermarks, no distorted hands/faces, no clinical stock-photo feeling.\n- If DeepAI returns an image, download and commit it under public/images/generated/blog/ using a concise slug based on the article slug, and set posts.json image to that local path. Do not hotlink temporary DeepAI result URLs.\n- If DeepAI credentials are unavailable, blocked, or the result is low quality, use high-quality royalty-free photography primarily from Unsplash or Pexels instead. Use a stable direct image URL suitable for the existing posts.json pattern.\n- Do not use generic abstract images, search-result URLs, CDN thumbnails from search pages, copyrighted editorial/news images, watermarked images, or photos that feel clinical/cold.\n- Match the image context to the post title; do not change UI components unless needed.\n- If neither DeepAI nor a reliable Unsplash/Pexels image is available, reuse the most relevant existing repo image path rather than inventing an image URL.\n\nAllowed edits:\n- src/data/posts.json\n- public/images/generated/blog/ only for a new DeepAI-generated article image\n- public/sitemap.xml if needed\n- public/llms.txt if needed\n- public/llms-full.txt only if it exists or repo docs require it\n\nOpen PR gate:\nBefore writing, fetch/prune remote branches and inspect current open PRs only. Ignore deleted branches, closed PRs, stale local refs, and old completed Jules sessions. Block only if a currently open, non-no-op PR already modifies src/data/posts.json or is clearly a fresh Kesher article PR. If the only match is a stale/deleted branch or closed PR, continue and create today's single article. If a real current article PR exists, finish with a plain session summary only; do not edit files, do not create a no-op PR, and do not ask the user what to do.\n\nRun npm run build.\n\nCreate one PR automatically only for this single article and minimal index updates. PR summary must include selected keyword, topic, hook, category, selected image URL and source, changed files, validation commands, skipped checks, and confirmation that no manual Start/approval was required.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              },
              "environmentVariablesEnabled": true
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          curl --fail-with-body -sS \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions
