name: Jules Weekday Kesher Article
on:
  schedule:
    # 00:35 Israel time during daylight saving. The job also checks local day
    # before starting Jules, so Friday/Saturday are skipped even across DST.
    - cron: "35 21 * * 0,1,2,3,4"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: jules-weekday-kesher-article
  cancel-in-progress: false
jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Friday and Saturday in Israel
        id: local_day
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Jerusalem date +%u)"
          if [ "$day" = "5" ] || [ "$day" = "6" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local day is Friday/Saturday in Israel; skipping article run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop if article PR is already open
        if: steps.local_day.outputs.skip != 'true'
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > open-prs.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import sys
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          pattern = re.compile(
              r"(kesher article|weekday article|blog article|posts\.json|"
              r"auto[- ]?publish|publish article|new article|מאמר)",
              re.I,
          )
          now = dt.datetime.now(dt.UTC)
          repo = os.environ.get("GITHUB_REPOSITORY", "yanivsa/kesher-website")
          token = os.environ.get("GITHUB_TOKEN", "")
          def is_fresh(pr):
              updated = dt.datetime.fromisoformat(pr["updated_at"].replace("Z", "+00:00"))
              return now - updated <= dt.timedelta(days=3)
          def is_noop(pr):
              text = f"{pr.get('title') or ''}\n{pr.get('body') or ''}"
              return bool(re.search(r"\bno[- ]?op\b|no files were edited|no Jules session", text, re.I))
          def is_repair_or_review(pr):
              title = pr.get("title", "")
              if title.startswith("[jules-review]"):
                  return True
              return bool(re.search(r"(repair|validator|workflow|automation)", title, re.I))
          def modifies_posts_json(pr_number):
              url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100"
              headers = {
                  "User-Agent": "python-urllib",
                  "Accept": "application/vnd.github+json"
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.headers.get('Link') and 'rel="next"' in response.headers.get('Link'):
                          print(f"External infrastructure error: PR #{pr_number} has too many files (pagination required but unsupported).")
                          sys.exit(1)
                      files = json.loads(response.read().decode())
                      for f in files:
                          if f.get("filename") == "src/data/posts.json":
                              return True
              except urllib.error.HTTPError as e:
                  print(f"External infrastructure error: GitHub API returned {e.code} when checking PR #{pr_number} files.")
                  sys.exit(1)
              except urllib.error.URLError as e:
                  print(f"External infrastructure error: Network failure when checking PR #{pr_number} files.")
                  sys.exit(1)
              except Exception as e:
                  print(f"External infrastructure error: JSON parse or other failure when checking PR #{pr_number} files.")
                  sys.exit(1)
              return False
          blockers = []
          for pr in prs:
              if not is_fresh(pr) or is_noop(pr):
                  continue

              if is_repair_or_review(pr):
                  continue
              text_match = (
                  pattern.search(pr.get("title") or "")
                  or pattern.search((pr.get("head") or {}).get("ref") or "")
                  or pattern.search(pr.get("body") or "")
              )

              if text_match and modifies_posts_json(pr["number"]):
                  blockers.append(f"#{pr['number']} {pr['title']} ({pr.get('html_url', 'No URL')})")
          launch_required = not bool(blockers)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"launch_required={'true' if launch_required else 'false'}\n")

          if blockers:
              msg = "Open Kesher article PR exists; no Jules session will be started.\n"
              print(msg)
              for blocker in blockers[:20]:
                  print(f"- {blocker}")
              if "GITHUB_STEP_SUMMARY" in os.environ:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                      out.write("### Jules Session Skipped\n\n")
                      out.write("Jules session intentionally skipped because the following fresh article PRs are open:\n")
                      for blocker in blockers[:20]:
                          out.write(f"- {blocker}\n")
          PY
      - name: Start Jules autonomous article session
        if: steps.local_day.outputs.skip != 'true' && steps.article_gate.outputs.launch_required == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"
          cat > payload.json <<'JSON'
          {
            "title": "Weekday Kesher Hebrew article",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, Start clicks, plan approval, topic approval, image approval, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest high-quality repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT write about, mention, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere in the article, keywords, metadata, or prompts.\n\nBefore writing, read:\n- src/data/posts.json (Check the 30 most recent articles to strictly avoid near-duplicate topics and repetitive themes. A new article MUST have a substantially fresh topic and slug, otherwise content validation will fail for being too similar to recent articles.)\n\nCreate exactly ONE new Hebrew blog article per run. Do not catch up backlog. Do not create more than one article. Do not duplicate an existing post topic, title, slug, hook, keyword, or angle.\n\nLanguage and voice requirements:\n- Hebrew only. Do not create English, Russian, Ukrainian, or multilingual variants.\n- Write in natural contemporary Israeli Hebrew, the way thoughtful Israelis actually speak and write, with varied sentence lengths and concrete everyday Israeli details.\n- Avoid translated-English phrasing, AI-like summaries, corporate therapy jargon, filler paragraphs, repetitive generic advice, stock AI/translated metaphors, and inflated formulaic phrases. FORBIDDEN EXAMPLES: \"גשר מעל התהום\", \"שריר של שיח\", \"הפרויקט המשותף הגדול הסתיים\", \"רעש רגשי גדול\", and \"עמדה של יצירה משותפת\" (allow genuinely literal contexts only if a validator can distinguish them; otherwise forbid these exact phrases in new article prose).\n- Prefer short clear sentences, concrete everyday examples, and emotionally accurate language.\n- Sound like a warm, experienced Israeli professional writing to parents or couples, not like an SEO bot.\n- Keep SEO keywords natural; never force a keyword if it makes the sentence sound unnatural.\n\nArticle requirements:\n- Relevant to couples counseling, parenting guidance, ADHD parenting, co-parenting, communication, boundaries, emotional regulation, or family conflict repair.\n- Do not write about, mention, or refer to divorce (גירושין), legal services, or mediation (גישור) in the article. Focus purely on couples communication, conflict resolution, parenting guidance, and family harmony.\n- Create a compelling hook before writing: one concrete, emotionally recognizable real-life couple/parent/family situation or sharp question that makes the reader feel this is exactly my problem.\n- Start the published article with that hook; do not start with a generic definition, generic SEO intro, or broad background.\n- The hook must be specific to the selected topic and must not repeat hooks used by existing posts.\n- Immediately after the hook, include a direct 40-80 word answer-first / BLUF paragraph.\n- Body length must be 700-1,100 Hebrew words excluding metadata, title, excerpt, and navigation. Do not submit a short article.\n- Use at least 5 practical H3 question sections.\n- Include concrete everyday examples, not vague advice.\n- Include at least one practical exercise or conversation script readers can try.\n- Keep Shira's warm, practical, professional tone.\n- Include a soft CTA in the article body, without pushy sales language.\n- Do not give legal or clinical promises.\n- Before opening a PR, self-check that the article is not generic, not repetitive, sounds natural in Israeli Hebrew, includes the DeepAI/local image path, meets the word-count and CTA requirements, and crucially, rewrites any formulaic metaphor or forbidden phrase before opening the PR. If it fails, revise it before creating the PR.\n\nImage requirements:\n- Every new article must have a unique, custom-generated or custom-selected image. Never repeat images or reuse paths of existing articles' images.\n- Preferred path: generate a new, unique, warm, realistic, royalty-safe article image with DeepAI by running the image generation script: `node scripts/generate-article-image.js <slug> <title> '<specific visual scene description>'`. To execute it, use the DeepAI API key set in the environment variable DEEPAI_API_KEY.\n- In order to ensure the generated DeepAI image is unique and different from previous articles, the third argument passed to the script must contain a highly specific, unique visual scene description tailored to the article's specific topic (e.g. describing a specific room setting, unique objects, distinct camera angle, or specific warm interaction poses).\n- DeepAI image style: realistic editorial photography, warm natural light, modest everyday Israeli setting, emotionally respectful, no text, no logos, no watermarks, no distorted hands/faces, no clinical stock-photo feeling.\n- If DeepAI returns an image, download and commit it under public/images/generated/blog/ using a concise slug based on the article slug, and set posts.json image to that local path. Do not hotlink temporary DeepAI result URLs.\n- If DeepAI credentials are unavailable, blocked, or the result is low quality, use a unique, high-quality royalty-free photograph primarily from Unsplash or Pexels instead (using a stable direct URL for a unique, topic-relevant image). Never reuse an existing repo image path for a new article, as this creates repetition.\n- Do not use generic abstract images, search-result URLs, CDN thumbnails from search pages, copyrighted editorial/news images, watermarked images, or photos that feel clinical/cold.\n- Match the image context to the post title; do not change UI components unless needed.\n\nAllowed edits:\n- src/data/posts.json\n- public/images/generated/blog/ only for a new DeepAI-generated article image\n- public/sitemap.xml if needed\n- public/llms.txt if needed\n- public/llms-full.txt only if it exists or repo docs require it\n\nOpen PR gate:\nBefore writing, fetch/prune remote branches and inspect current open PRs only. Ignore deleted branches, closed PRs, stale local refs, and old completed Jules sessions. Block only if a currently open, non-no-op PR already modifies src/data/posts.json or is clearly a fresh Kesher article PR. If the only match is a stale/deleted branch or closed PR, continue and create today's single article. If a real current article PR exists, finish with a plain session summary only; do not edit files, do not create a no-op PR, and do not ask the user what to do.\n\nRun npm run check.\n\nCreate one PR automatically only for this single article and minimal index updates. PR summary must include selected keyword, topic, hook, category, selected image URL and source, changed files, validation commands, skipped checks, and confirmation that no manual Start/approval was required.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              },
              "environmentVariablesEnabled": true
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON
          python3 - <<'PY'
          import json
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["prompt"] = payload["prompt"].replace(
              "She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT write about, mention, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere in the article, keywords, metadata, or prompts.",
              "She is a couples counselor (יועצת זוגית), parenting guide/facilitator (מנחת הורים / הדרכת הורים), and certified mediator (מגשרת מוסמכת). She is a lawyer by training who moved into guidance, counseling, mediation, and education. Do not offer legal services or discuss legal proceedings."
          ).replace(
              "- Relevant to couples counseling, parenting guidance, ADHD parenting, co-parenting, communication, boundaries, emotional regulation, or family conflict repair.",
              "- Relevant to the full current topic pool in the authoritative policy below, including couples counseling, parenting guidance, gifted children, executive functions, educational transitions, immigrant and returning families, mediation, communication, boundaries, emotional regulation, or family conflict repair."
          ).replace(
              "- Do not write about, mention, or refer to divorce (גירושין), legal services, or mediation (גישור) in the article. Focus purely on couples communication, conflict resolution, parenting guidance, and family harmony.",
              "- Do not write about divorce (גירושין), legal services, court proceedings, or legal representation. Mediation articles are allowed only as voluntary, neutral facilitation of dialogue and agreements, as defined in the authoritative policy below."
          )
          with open(".github/prompts/jules-weekday-article-update.md", encoding="utf-8") as fh:
              updated_article_policy = fh.read()
          payload["prompt"] += "\n\nAUTHORITATIVE CURRENT ARTICLE POLICY — this section supersedes every earlier conflicting service definition or topic prohibition:\n\n" + updated_article_policy
          forbidden_stale_rules = [
              "She is strictly defined as a couples counselor",
              "Do NOT write about, mention, or refer to divorce",
              "Do not write about, mention, or refer to divorce",
          ]
          if any(rule in payload["prompt"] for rule in forbidden_stale_rules):
              raise SystemExit("Stale contradictory Jules article rule remains in runtime prompt")
          payload["prompt"] += "\n\nStrict Hebrew-only gate: the new article title, excerpt, and rendered content must contain no Latin letters `A-Z` or `a-z`, including English terminology, acronyms, parenthetical translations, headings, CTA text, or image captions. Keep machine identifiers such as id/slug/image path in ASCII as required by the repo, but visible article prose must be Hebrew-only. Before opening a PR, scan the new visible fields with `/[A-Za-z]/`; if any match remains, replace it with natural Hebrew and rerun `npm run check`."
          payload["prompt"] += "\n\nAutonomy rule: an auto-approved/generated plan must be executed immediately; never restate it and ask permission or enter AWAITING_USER_FEEDBACK."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY
          set +e
          HTTP_STATUS=$(curl -w "%{http_code}" -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)
          CURL_EXIT_CODE=$?
          set -e
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "curl failed with exit code $CURL_EXIT_CODE"
            exit $CURL_EXIT_CODE
          fi
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "API request failed with HTTP status $HTTP_STATUS"
            cat response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          import sys
          import os
          try:
              with open("response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Failed to parse response.json: {e}")
              sys.exit(1)
          session_id = data.get("name") or data.get("id")
          session_url = data.get("url") or data.get("agentUrl") or data.get("sessionUrl")
          if not session_id or not session_url:
              print("Response missing required session ID/name or URL")
              print("Response body:")
              print(json.dumps(data, indent=2))
              sys.exit(1)
          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("### Jules Session Created Successfully\n\n")
                  f.write(f"- **ID/Name:** `{session_id}`\n")
                  f.write(f"- **URL:** [{session_url}]({session_url})\n")

          print(f"Session started: {session_id}")
          print(f"URL: {session_url}")
          PY
