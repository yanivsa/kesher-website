name: Kesher Targeted Media Recovery Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/kesher-media-recovery-request.json'
      - '.github/workflows/kesher-targeted-media-recovery-dispatch.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-targeted-media-recovery-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Refuse dispatcher after cutover exclusion begins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.kesher_runtime.bridge_admission --dispatcher

      - name: Resolve exact enabled recovery target
        id: target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          request = json.loads(Path('.github/kesher-media-recovery-request.json').read_text(encoding='utf-8'))
          if request.get('enabled') is not True:
              print('Targeted media recovery is disabled; nothing to dispatch.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('enabled=false\n')
              raise SystemExit(0)

          slug = str(request.get('target_slug') or '').strip()
          if not slug:
              raise SystemExit('Enabled targeted media recovery requires target_slug')

          video_operation = str(request.get('overview_operation') or 'full').strip()
          short_operation = str(request.get('short_operation') or 'full').strip()
          allowed_video = {'skip', 'full', 'preflight', 'generate', 'upload', 'rebuild'}
          allowed_short = {'skip', 'full', 'preflight', 'generate', 'upload', 'rebuild', 'derive', 'release', 'historical'}
          if video_operation not in allowed_video:
              raise SystemExit(f'Unsupported overview_operation: {video_operation!r}')
          if short_operation not in allowed_short:
              raise SystemExit(f'Unsupported short_operation: {short_operation!r}')
          if video_operation == 'skip' and short_operation == 'skip':
              raise SystemExit('Enabled targeted recovery cannot skip both media workers')

          posts = json.loads(Path('src/data/posts.json').read_text(encoding='utf-8'))
          matches = [p for p in posts if isinstance(p, dict) and str(p.get('slug') or p.get('id') or '').strip() == slug]
          if len(matches) != 1:
              raise SystemExit(f'Target slug {slug!r} matched {len(matches)} articles')

          article = matches[0]
          today = datetime.now(ZoneInfo('Asia/Jerusalem')).date().isoformat()
          if str(article.get('date') or '') != today:
              raise SystemExit(f'Recovery target {slug!r} is not today\'s article ({today})')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('enabled=true\n')
              out.write(f'slug={slug}\n')
              out.write(f'video_operation={video_operation}\n')
              out.write(f'short_operation={short_operation}\n')
          print(f'RECOVERY_TARGET_VERIFIED slug={slug} date={today} video={video_operation} short={short_operation}')
          PY

      - name: Dispatch exact Video Overview worker
        if: ${{ steps.target.outputs.enabled == 'true' && steps.target.outputs.video_operation != 'skip' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SLUG: ${{ steps.target.outputs.slug }}
          VIDEO_OPERATION: ${{ steps.target.outputs.video_operation }}
        run: |
          set -euo pipefail
          gh workflow run kesher-daily-video.yml \
            --ref main \
            -f operation="$VIDEO_OPERATION" \
            -f target_slug="$TARGET_SLUG"
          echo "VIDEO_OVERVIEW_DISPATCHED slug=$TARGET_SLUG operation=$VIDEO_OPERATION"

      - name: Dispatch exact Short worker
        if: ${{ steps.target.outputs.enabled == 'true' && steps.target.outputs.short_operation != 'skip' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SLUG: ${{ steps.target.outputs.slug }}
          SHORT_OPERATION: ${{ steps.target.outputs.short_operation }}
        run: |
          set -euo pipefail
          gh workflow run kesher-short-v4.yml \
            --ref main \
            -f operation="$SHORT_OPERATION" \
            -f derive_slug="$TARGET_SLUG"
          echo "SHORT_DISPATCHED slug=$TARGET_SLUG operation=$SHORT_OPERATION"
