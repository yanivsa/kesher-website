name: Diagnose OpenClaw Fresh VM Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            case "$code" in 400|403|429|500|502|503|504) sleep 5 ;; *) exit 1 ;; esac
          done
          [ "$code" = 200 ]
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem'])
          Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text(
              '[DEFAULT]\n'
              f'user={d["user"]}\n'
              f'fingerprint={d["fingerprint"]}\n'
              f'tenancy={d["tenancy"]}\n'
              f'region={d["region"]}\n'
              'key_file=/tmp/oci.pem\n'
          )
          Path('/tmp/oci.cfg').chmod(0o600)
          PY
      - name: Read-only diagnostic through OCI Run Command
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_agent_diagnostic.py \
            --config /tmp/oci.cfg \
            --instance-name openclaw-e2-tailscale \
            --script-file scripts/openclaw_readonly_diagnostic.sh \
            --timeout 180
      - if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg
