name: Kesher Stability PR Validation

on:
  pull_request:
  workflow_run:
    workflows: ["Kesher Article Normalizer"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kesher-stability-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install stability test dependencies
        run: python -m pip install requests==2.33.0 cryptography==50.0.1 PyYAML==6.0.2 CairoSVG==2.8.2 -r scripts/requirements-article.txt

      - name: Run controller and video stability regression suite
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_article_image_contract \
            tests.test_trusted_image_recovery_boundary \
            tests.test_kesher_article_public \
            tests.test_kesher_publication_manifest \
            tests.test_kesher_autonomous_controller \
            tests.test_kesher_public_delivery \
            tests.test_kesher_metadata_repair \
            tests.test_kesher_media_state \
            tests.test_kesher_media_worker \
            tests.test_kesher_provider_recovery \
            tests.test_media_provenance_contract \
            tests.test_notebooklm_native_media \
            tests.test_kesher_audio_preservation \
            tests.test_kesher_media_publication \
            tests.test_kesher_media_audit \
            tests.test_kesher_media_observer \
            tests.test_kesher_observe \
            tests.test_kesher_controller_entry \
            tests.test_kesher_jules_sessions \
            tests.test_kesher_article_worker \
            tests.test_kesher_article_normalize_worker \
            tests.test_kesher_article_image_worker \
            tests.test_kesher_article_validation \
            tests.test_kesher_article_merge \
            tests.test_kesher_deployment_artifact \
            tests.test_kesher_article_deploy \
            tests.test_kesher_deployment_observer \
            tests.test_kesher_runtime_migration \
            tests.test_kesher_cutover_host \
            tests.test_kesher_post_freeze_migration \
            tests.test_kesher_real_data_migration \
            tests.test_kesher_backlog_rotation \
            tests.test_kesher_state_write_safety \
            tests.test_kesher_canonical_state \
            tests.test_kesher_github_faults \
            tests.test_kesher_worker_commands \
            tests.test_kesher_command_dispatch \
            tests.test_kesher_worker_entry \
            tests.test_kesher_output_artifacts \
            tests.kesher_daily_pipeline_suite \
            tests.test_video_review_policy \
            tests.test_video_review_schema \
            tests.test_advisory_review_retry_identity \
            tests.test_video_reconcile \
            tests.test_kesher_content_controller \
            tests.test_kesher_controller_queue \
            tests.test_controller_artifact_download \
            tests.test_jules_article_runner \
            tests.test_single_scheduler_policy \
            tests.test_kesher_v5_backlog_priority \
            tests.test_kesher_e2e_readiness \
            tests.test_controller_liveness \
            tests.test_media_external_effect_crash_consistency \
            tests.test_daily_rollover_delivery_completeness \
            tests.test_deploy_sha_supersession_and_budget \
            tests.test_exact_public_article_identity \
            tests.test_article_pr_verify_check_ordering \
            tests.test_article_normalization_head_tracking \
            tests.test_article_image_fallback_pool_and_cascade \
            tests.test_controller_child_failure_recovery \
            tests.test_controller_repair \
            tests.test_kesher_recovery_e2e \
            tests.test_ci_regression_suite_coverage \
            -v

      - name: Check immutable Vantage Overview private safety and research contract
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'owner/vantage-full-private-overview-') }}
        run: python -m unittest tests.test_kesher_vantage_full_private_contract -v

  render-proof:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic render dependencies
        run: |
          set -euo pipefail
          python -m pip install requests==2.33.0
          npm ci --no-audit --no-fund
          node -e 'for (const name of ["@ffmpeg-installer/ffmpeg", "@ffprobe-installer/ffprobe"]) require("fs").appendFileSync(process.env.GITHUB_PATH, require("path").dirname(require(name).path) + "\n")'
      - name: Prove real rendering preserves source audio and in-content signature
        run: python tests/real_media_render.py --output "$RUNNER_TEMP/kesher-render-proof"
      # Same existing stability workflow. PR-only private artifact, zero YouTube calls.
      # No source narration, so this step cannot certify scientific/audio QA.
      - name: Render source-locked photographic Overview motion proof (private)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'owner/licensed-photo-story-overview-') }}
        run: |
          set -euo pipefail
          npm ci --prefix remotion-kesher --no-audit --no-fund
          python scripts/kesher_photo_story_private_preview.py --output "$RUNNER_TEMP/kesher-vantage-visual-proof"

      - name: Archive photographic Overview PRIVATE proof (not for publication)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'owner/licensed-photo-story-overview-') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-vantage-visual-only-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kesher-vantage-visual-proof/
          if-no-files-found: error
          retention-days: 14

      # Exact topic, private-only corrected full Overview. Never uses YouTube OAuth.
      # Reuses the already-reviewed MIT/Apache-2/CC-BY voice pipeline from owner Short.
      - name: Build corrected research-bound Hebrew full Overview PRIVATE (no upload)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'owner/vantage-full-private-overview-') }}
        run: |
          set -euo pipefail
          npm ci --prefix remotion-kesher --no-audit --no-fund
          python -m pip install 'git+https://github.com/maxmelichov/BlueTTS.git@712f7c9491ad7875fc985e24e166afe43ae649b0' Pillow==11.3.0
          python scripts/kesher_vantage_full_private.py --output "$RUNNER_TEMP/kesher-vantage-full-review"

      - name: Archive corrected Vantage full Overview PRIVATE review only
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'owner/vantage-full-private-overview-') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-vantage-research-corrected-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kesher-vantage-full-review/
          if-no-files-found: error
          retention-days: 14

      - name: Retain synthetic render evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-render-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kesher-render-proof/
          if-no-files-found: error
          retention-days: 14


  owner-asynchrony-private-preview:
    # Exact same-repo owner PR only. No GitHub provider credentials, no public upload.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'owner/asynchrony-media-20261109' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OWNER candidate with no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Source-bound nonpublishing preflight
        run: python -m scripts.kesher_owner_asynchrony_preview preflight --source-sha 7b6ae2e8dc3182d798edbf19c2d95e576b02ab093c5e2bf04bad91113a716a00
      - name: Set up Python for licensed local speech
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up pinned Node for repository FFmpeg bundles
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned owner-direct speech and media tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ffmpeg_dir="$(dirname "$(node -p "require('@ffmpeg-installer/ffmpeg').path")")"
          ffprobe_dir="$(dirname "$(node -p "require('@ffprobe-installer/ffprobe').path")")"
          printf '%s\n' "$ffmpeg_dir" "$ffprobe_dir" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_dir:$ffprobe_dir:$PATH"
          command -v ffmpeg
          command -v ffprobe
          python -m pip install Pillow==11.3.0 requests==2.32.5 soundfile==0.13.1 \
            'git+https://github.com/maxmelichov/BlueTTS.git@712f7c9491ad7875fc985e24e166afe43ae649b0'
      - name: Strict identity and no-publication tests
        run: python -m unittest tests.test_kesher_owner_asynchrony_preview -v
      - name: Render original private Hebrew Overview and native 9 by 16 Short
        env:
          HF_HOME: ${{ runner.temp }}/owner-asynchrony-hf
        run: |
          set -euo pipefail
          python -m scripts.kesher_owner_asynchrony_preview preview \
            --source-sha 7b6ae2e8dc3182d798edbf19c2d95e576b02ab093c5e2bf04bad91113a716a00 \
            --output owner-asynchrony-media-output
      - name: Archive reviewable PRIVATE owner outputs only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-asynchrony-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-asynchrony-media-output/overview.mp4
            owner-asynchrony-media-output/short.mp4
            owner-asynchrony-media-output/overview-review-voice.wav
            owner-asynchrony-media-output/short-review-voice.wav
            owner-asynchrony-media-output/*-manifest.json
            owner-asynchrony-media-output/*-visual-contact-sheet.jpg
            owner-asynchrony-media-output/*-frame-*.jpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 60

  owner-positivity-private-preview:
    # Exact same-repo owner PR only. No GitHub provider credentials, no public upload.
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'owner/positivity-media-20261110' || github.head_ref == 'owner/positivity-independent-asr-20261110') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OWNER candidate with no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Source-bound nonpublishing preflight
        run: python -m scripts.kesher_owner_positivity_preview preflight --source-sha 6bb5723bbadc7b78725e4cdb477857e7194cca47c1140f27d1c4f3921b6e2d5f
      - name: Set up Python for licensed local speech
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up pinned Node for repository FFmpeg bundles
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned owner-direct speech and media tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ffmpeg_dir="$(dirname "$(node -p "require('@ffmpeg-installer/ffmpeg').path")")"
          ffprobe_dir="$(dirname "$(node -p "require('@ffprobe-installer/ffprobe').path")")"
          printf '%s\n' "$ffmpeg_dir" "$ffprobe_dir" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_dir:$ffprobe_dir:$PATH"
          command -v ffmpeg
          command -v ffprobe
          python -m pip install Pillow==11.3.0 requests==2.32.5 soundfile==0.13.1 \
            'git+https://github.com/maxmelichov/BlueTTS.git@712f7c9491ad7875fc985e24e166afe43ae649b0'
      - name: Strict identity and no-publication tests
        run: python -m unittest tests.test_kesher_owner_positivity_preview -v
      - name: Render original private Hebrew Overview and native 9 by 16 Short
        env:
          HF_HOME: ${{ runner.temp }}/owner-positivity-hf
        run: |
          set -euo pipefail
          python -m scripts.kesher_owner_positivity_preview preview \
            --source-sha 6bb5723bbadc7b78725e4cdb477857e7194cca47c1140f27d1c4f3921b6e2d5f \
            --output owner-positivity-media-output
      - name: Independently transcribe original Hebrew voice OFFLINE for owner review
        env:
          HF_HOME: ${{ runner.temp }}/owner-positivity-asr-hf
        run: |
          set -euo pipefail
          python -m pip install 'faster-whisper==1.2.1' 'av<19'
          python -m unittest tests.test_kesher_owner_positivity_asr -v
          python -m scripts.kesher_owner_positivity_asr \
            --source-sha 6bb5723bbadc7b78725e4cdb477857e7194cca47c1140f27d1c4f3921b6e2d5f \
            --output owner-positivity-media-output
      - name: Archive reviewable PRIVATE owner outputs only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-positivity-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-positivity-media-output/overview.mp4
            owner-positivity-media-output/short.mp4
            owner-positivity-media-output/overview-review-voice.wav
            owner-positivity-media-output/short-review-voice.wav
            owner-positivity-media-output/*-manifest.json
            owner-positivity-media-output/*-visual-contact-sheet.jpg
            owner-positivity-media-output/*-frame-*.jpg
            owner-positivity-media-output/*-asr.txt
            owner-positivity-media-output/asr-review.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 60


  owner-productive-failure-private-preview:
    # Exact same-repo owner PR, private evidence only. Read-only prior artifact; no upload credentials.
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'owner/productive-failure-media-20261110' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OWNER candidate with no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python for licensed local speech
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up pinned Node for repository FFmpeg bundles
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned owner-direct speech and media tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ffmpeg_dir="$(dirname "$(node -p "require('@ffmpeg-installer/ffmpeg').path")")"
          ffprobe_dir="$(dirname "$(node -p "require('@ffprobe-installer/ffprobe').path")")"
          printf '%s\n' "$ffmpeg_dir" "$ffprobe_dir" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_dir:$ffprobe_dir:$PATH"
          command -v ffmpeg
          command -v ffprobe
          python -m pip install Pillow==11.3.0 requests==2.32.5 soundfile==0.13.1 'git+https://github.com/maxmelichov/BlueTTS.git@712f7c9491ad7875fc985e24e166afe43ae649b0' 'faster-whisper==1.2.1' 'av<19'
      - name: Exact source preflight and targeted private Short visual repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.kesher_owner_productive_failure_preview preflight --source-sha 37f9b2e3ef91fa1b77b923f35281df9a66014d243389bb08e7fa1954bc86ab50
          gh api repos/yanivsa/kesher-website/actions/artifacts/13757158570/zip > "$RUNNER_TEMP/productive-failure-reviewed-input.zip"
          python -m scripts.kesher_owner_productive_failure_preview repair --source-sha 37f9b2e3ef91fa1b77b923f35281df9a66014d243389bb08e7fa1954bc86ab50 --archive "$RUNNER_TEMP/productive-failure-reviewed-input.zip"
      - name: Archive reviewable PRIVATE outputs only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-productive-failure-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-productive-failure-media-output/overview.mp4
            owner-productive-failure-media-output/short.mp4
            owner-productive-failure-media-output/*-review-voice.wav
            owner-productive-failure-media-output/*-manifest.json
            owner-productive-failure-media-output/*-visual-contact-sheet.jpg
            owner-productive-failure-media-output/*-frame-*.jpg
            owner-productive-failure-media-output/*-asr.txt
            owner-productive-failure-media-output/asr-review.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 60

  owner-relationship-7500-private-preview:
    # Exact same-repo OWNER branch, read-only private evidence; no upload credentials.
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'owner/relationship-7500-media-20261110' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OWNER candidate with no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python for licensed local speech
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up pinned Node for repository FFmpeg bundles
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned owner-direct speech and media tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ffmpeg_dir="$(dirname "$(node -p "require('@ffmpeg-installer/ffmpeg').path")")"
          ffprobe_dir="$(dirname "$(node -p "require('@ffprobe-installer/ffprobe').path")")"
          printf '%s\n' "$ffmpeg_dir" "$ffprobe_dir" >> "$GITHUB_PATH"
          export PATH="$ffmpeg_dir:$ffprobe_dir:$PATH"
          command -v ffmpeg
          command -v ffprobe
          python -m pip install Pillow==11.3.0 requests==2.32.5 soundfile==0.13.1 'git+https://github.com/maxmelichov/BlueTTS.git@712f7c9491ad7875fc985e24e166afe43ae649b0' 'faster-whisper==1.2.1' 'av<19'
      - name: Exact source preflight and targeted private Short safety repair
        env:
          GH_TOKEN: ${{ github.token }}
          HF_HOME: ${{ runner.temp }}/owner-7500-hf
        run: |
          set -euo pipefail
          python -m scripts.kesher_owner_7500_preview preflight --source-sha 797750526c533f41e661123dc86339da3f0a5721d5eff820d70937ee7f6d5bdd
          gh api repos/yanivsa/kesher-website/actions/artifacts/13765047330/zip > "$RUNNER_TEMP/owner-7500-reviewed-input.zip"
          python -m scripts.kesher_owner_7500_preview repair --source-sha 797750526c533f41e661123dc86339da3f0a5721d5eff820d70937ee7f6d5bdd --archive "$RUNNER_TEMP/owner-7500-reviewed-input.zip"
      - name: Transcribe repaired final Short audio offline; preserve Overview evidence
        env:
          HF_HOME: ${{ runner.temp }}/owner-7500-asr-hf
        run: |
          set -euo pipefail
          python -m scripts.kesher_owner_7500_preview asr-short --source-sha 797750526c533f41e661123dc86339da3f0a5721d5eff820d70937ee7f6d5bdd
      - name: Archive reviewable PRIVATE outputs only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-7500-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-7500-media-output/overview.mp4
            owner-7500-media-output/short.mp4
            owner-7500-media-output/*-review-voice.wav
            owner-7500-media-output/*-manifest.json
            owner-7500-media-output/*-visual-contact-sheet.jpg
            owner-7500-media-output/*-frame-*.jpg
            owner-7500-media-output/*-asr.txt
            owner-7500-media-output/asr-review.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 60
      - name: Preserve failed private render evidence for targeted recovery (never publish)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-7500-failed-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-7500-media-output/overview.mp4
            owner-7500-media-output/short.mp4
            owner-7500-media-output/*-review-voice.wav
            owner-7500-media-output/*-manifest.json
            owner-7500-media-output/*-visual-contact-sheet.jpg
            owner-7500-media-output/*-frame-*.jpg
            owner-7500-media-output/*-asr.txt
            owner-7500-media-output/asr-review.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  owner-kindergarten-play-private-preview:
    # Exact same-repo OWNER branch; private evidence only, no publisher credentials.
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'owner/kindergarten-play-media-20261110' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact OWNER candidate with no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python for licensed local speech
