name: Owner inspect KESHER post schema 20261007

on:
  push:
    branches:
      - owner/kesher-assets-20261007
    paths:
      - '.github/workflows/owner-inspect-post-schema-20261007.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ github.repository == 'yanivsa/kesher-website' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: owner/kesher-assets-20261007
      - name: Snapshot non-secret current content schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('src/data/posts.json').read_text(encoding='utf-8'))
          if not isinstance(posts,list) or not posts:
              raise SystemExit('posts.json is not a nonempty list')
          def slim(p):
              keep=['id','slug','title','description','date','publishedDate','category','author','image','imageAlt','tags','content','videoTitle','videoTags','shortTitle','shortTags','shortHook','controllerManaged']
              return {k:p.get(k) for k in keep if k in p}
          payload={
              'count':len(posts),
              'keys':sorted(posts[-1].keys()),
              'latest_three':[slim(p) for p in posts[-3:]],
          }
          Path('.owner-post-schema.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'KESHER Owner Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add .owner-post-schema.json
          git commit -m 'chore(owner): snapshot current post schema'
          git push origin HEAD:owner/kesher-assets-20261007
