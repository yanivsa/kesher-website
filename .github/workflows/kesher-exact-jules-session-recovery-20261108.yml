name: KESHER Exact Jules Session Recovery 2026-11-07-08
run-name: Kesher resume existing Jules ${{ inputs.slot }} (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Existing owner publication slot only (no new session)
        required: true
        type: choice
        options:
          - '2026-11-07'
          - '2026-11-08'
      mode:
        description: Read-only status check or send one same-session completion message
        required: true
        type: choice
        default: check
        options:
          - check
          - nudge

permissions:
  contents: read

concurrency:
  group: kesher-existing-jules-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  existing-session-only:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited repository main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate exact-session recovery before touching credentials
        run: python -m unittest discover -s tests -p 'test_kesher_jules_exact_session_recovery.py' -v
      - name: Check or resume exact original Jules session (never create)
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          KESHER_SLOT: ${{ inputs.slot }}
          KESHER_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -m scripts.kesher_jules_exact_session_recovery \
            --slot "$KESHER_SLOT" --mode "$KESHER_MODE"
