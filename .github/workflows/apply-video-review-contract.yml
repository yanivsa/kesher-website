name: Apply strict Jules video review contract

on:
  push:
    branches: [automation/kesher-video-review-contract-20260819]
    paths: [.github/workflows/apply-video-review-contract.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/kesher-video-review-contract-20260819
      - name: Apply migration and verify
        run: |
          set -euo pipefail
          python3 scripts/_apply_video_review_contract_patch.py
          python3 -m unittest tests.test_video_review_policy tests.test_video_review_schema tests.test_kesher_daily_pipeline -q
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "Kesher Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/prompts/jules-remotion-video-upgrade.md scripts/jules_video_reviewer.py
          git diff --cached --check
          git commit -m "feat: version and validate Jules video review contract"
          git push origin HEAD:automation/kesher-video-review-contract-20260819
