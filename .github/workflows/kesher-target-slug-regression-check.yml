name: Kesher Target Slug Regression Check

on:
  push:
    paths:
      - '.github/workflows/kesher-target-slug-regression-check.yml'
      - 'tests/test_target_slug_mode_contract.py'
      - 'scripts/kesher_video_reconcile.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest tests.test_target_slug_mode_contract -v
