name: Temporary Hebrew Sleep Rewrite Retry

on:
  push:
    branches: [fix-israeli-hebrew-sleep-article]
    paths:
      - '.github/workflows/temp-hebrew-sleep-rewrite-retry.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-israeli-hebrew-sleep-article
      - name: Reuse rewrite script from first workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path(".github/workflows/temp-hebrew-sleep-rewrite.yml").read_text(encoding="utf-8").splitlines()
          start = next(i for i,l in enumerate(src) if "python3 - <<'PY'" in l) + 1
          end = next(i for i,l in enumerate(src[start:], start) if l.strip() == "PY")
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in src[start:end])
          exec(compile(code, "<hebrew-rewrite>", "exec"), {})
          PY
      - name: Commit rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/data/posts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: improve sleep article Hebrew"
          git push origin HEAD:fix-israeli-hebrew-sleep-article
