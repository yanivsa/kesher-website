name: Kesher Historical Recovery Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/kesher-historical-recovery-trigger.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-historical-recovery-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main for gh repository context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Resume independent direct Short for 2026-09-03
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kesher-short-v4.yml \
            -f operation=generate \
            -f derive_slug=smart-youth-focus-tasks-organization

      - name: Record scope
        run: echo "Direct-short generation recovery dispatched only for 2026-09-03. 2026-09-09 untouched." >> "$GITHUB_STEP_SUMMARY"
