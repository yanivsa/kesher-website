name: Kesher Historical Recovery Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/kesher-historical-recovery-trigger.json"

permissions:
  actions: write
  contents: read

concurrency:
  group: kesher-historical-recovery-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main for gh repository context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Re-dispatch only the 2026-09-03 Short cancelled by concurrency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kesher-short-v4.yml \
            -f operation=derive \
            -f derive_slug=smart-youth-focus-tasks-organization \
            -f derive_content_sha256=065fc982d04000cf570128933fd7a23623d50a58e61370f2bd9e6e98cc8d3a0c \
            -f derive_long_item_id=video-20260903-115113-065fc982d0

      - name: Record scope
        run: echo "Re-dispatched only 2026-09-03 Short after GitHub concurrency cancelled the original pending run. 2026-09-09 untouched." >> "$GITHUB_STEP_SUMMARY"
