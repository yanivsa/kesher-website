name: Kesher canonical media worker
run-name: kesher-command:${{ inputs.command_id }}

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: Persisted canonical command ID
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  actions: read

concurrency:
  group: kesher-media-command-${{ inputs.command_id }}
  cancel-in-progress: false

jobs:
  media:
    if: ${{ github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.command_id != '149ed4c8a86a3da1a8ceca9195d782039e3458cf8553cd1647add649a473fbf9' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMAND_ID: ${{ inputs.command_id }}
      KESHER_CUTOVER_GATEWAY_URL: ${{ vars.KESHER_CUTOVER_GATEWAY_URL }}
      GH_TOKEN: ${{ secrets.KESHER_CONTROLLER_TOKEN || github.token }}
      KESHER_NOTEBOOK_ID: e101e7d7-5305-45b3-a611-21a5475ceb63
      KESHER_WHISPER_MODEL: small
      NOTEBOOKLM_BIN: notebooklm
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize isolated media scratch
        run: |
          printf '%s\n' "KESHER_STATE_DIR=$RUNNER_TEMP/kesher-media-output" \
            "NOTEBOOKLM_HOME=$RUNNER_TEMP/kesher-notebooklm" \
            "HF_HOME=$RUNNER_TEMP/kesher-huggingface" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted authority admission dependencies
        run: python -m pip install PyYAML==6.0.2 -r scripts/requirements-article.txt

      - name: Claim exact canonical command before loading provider credentials
        id: claim
        run: python -m scripts.kesher_runtime.worker_entry claim "$COMMAND_ID"

      - name: Set up Node
        if: steps.claim.outputs.execute == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned media dependencies
        if: steps.claim.outputs.execute == 'true'
        run: |
          set -euo pipefail
          python -m pip install -r scripts/requirements-video-cloud.txt
          npm ci --no-audit --no-fund
          npm ci --prefix remotion-kesher --no-audit --no-fund
          test -x remotion-kesher/node_modules/.bin/remotion
          node -e 'for (const name of ["@ffmpeg-installer/ffmpeg", "@ffprobe-installer/ffprobe"]) require("fs").appendFileSync(process.env.GITHUB_PATH, require("path").dirname(require(name).path) + "\n")'

      - name: Restore only the exact persisted output artifact
        id: restore
        if: steps.claim.outputs.execute == 'true'
        run: python -m scripts.kesher_runtime.output_artifacts restore "$COMMAND_ID"

      - name: Prepare or reconcile exact provider output
        if: steps.claim.outputs.execute == 'true' && steps.restore.outputs.status != 'waiting'
        id: prepare
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON || secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
          NOTEBOOKLM_STATE_KEY: ${{ secrets.NOTEBOOKLM_STATE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m scripts.kesher_runtime.media_worker "$COMMAND_ID" --phase prepare

      - name: Persist immutable output artifact intent
        if: steps.prepare.outputs.status == 'output_ready'
        id: bundle
        run: python -m scripts.kesher_runtime.output_artifacts prepare "$COMMAND_ID" --bundle-dir "$RUNNER_TEMP/kesher-media-bundle"

      - name: Archive exact output bytes before any YouTube upload
        if: steps.bundle.outputs.status == 'upload'
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ runner.temp }}/kesher-media-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false

      - name: Read back and validate immutable archive before publication
        if: steps.bundle.outputs.status == 'upload'
        env:
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
        run: python -m scripts.kesher_runtime.output_artifacts complete "$COMMAND_ID" --artifact-id "$ARTIFACT_ID"

      - name: Publish or resume the exact archived bytes
        if: steps.prepare.outputs.status == 'output_ready' && (steps.bundle.outputs.status == 'upload' || steps.bundle.outputs.status == 'archived')
        env:
          NOTEBOOKLM_STATE_KEY: ${{ secrets.NOTEBOOKLM_STATE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m scripts.kesher_runtime.media_worker "$COMMAND_ID" --phase publish

      - name: Record execution result without asserting public completion
        if: success() && steps.claim.outputs.execute == 'true'
        run: python -m scripts.kesher_runtime.worker_entry finish "$COMMAND_ID"

      - name: Preserve failed command for classified controller recovery
        if: failure() && steps.claim.outputs.execute == 'true'
        run: python -m scripts.kesher_runtime.worker_entry finish "$COMMAND_ID" --failure-class WORKER_FAILED


  github_only_production:
    # Separate review-gated GitHub-only command. Canonical Schema6 worker job
    # and the single command_id input remain unchanged. No new workflow/cron.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.command_id == '149ed4c8a86a3da1a8ceca9195d782039e3458cf8553cd1647add649a473fbf9' }}
    environment: kesher-cutover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 90
    env:
      COMMAND_ID: ${{ inputs.command_id }}
      NOTEBOOKLM_HOME: /tmp/kesher-ghonly-notebooklm
      KESHER_STATE_DIR: /tmp/kesher-ghonly-new
      KESHER_GHONLY_OUTPUT: /tmp/kesher-ghonly-new
      HF_HOME: /tmp/kesher-ghonly-hf
      KESHER_WHISPER_MODEL: small
    steps:
      - name: Checkout immutable reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up pinned Node and FFmpeg
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install existing media SDK, authentication and QA clients
        run: |
          set -euo pipefail
          python -m pip install -r scripts/requirements-video-cloud.txt
          python -m pip install google-api-python-client==2.181.0 google-auth==2.40.3
          npm ci --no-audit --no-fund
          node -e 'for (const name of ["@ffmpeg-installer/ffmpeg", "@ffprobe-installer/ffprobe"]) require("fs").appendFileSync(process.env.GITHUB_PATH, require("path").dirname(require(name).path) + "\n")'
      - name: Materialize authenticated NotebookLM profile without logging credentials
        env:
          NOTEBOOKLM_STORAGE_STATE_SECRET: ${{ secrets.NOTEBOOKLM_AUTH_JSON || secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
          NOTEBOOKLM_MASTER_TOKEN_SECRET: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          profile=Path(os.environ["NOTEBOOKLM_HOME"])/"profiles"/"default"
          profile.mkdir(parents=True,exist_ok=True)
          raw=os.environ.get("NOTEBOOKLM_STORAGE_STATE_SECRET","").strip()
          if not raw: raise SystemExit("GHONLY_AUTH_MISSING")
          state=json.loads(raw)
          if not isinstance(state,dict) or not state.get("cookies"): raise SystemExit("GHONLY_AUTH_INVALID")
          path=profile/"storage_state.json"
          path.write_text(json.dumps(state,separators=(",",":")),encoding="utf-8")
          path.chmod(0o600)
          master=os.environ.get("NOTEBOOKLM_MASTER_TOKEN_SECRET","").strip()
          if master:
              value=json.loads(master)
              required={"version","email","android_id","master_token"}
              if not isinstance(value,dict) or not all(value.get(k) for k in required):
                  raise SystemExit("GHONLY_MASTER_AUTH_INVALID")
              path=profile/"master_token.json"
              path.write_text(json.dumps(value,separators=(",",":")),encoding="utf-8")
              path.chmod(0o600)
          PY

      - name: Protected single-command CAS source and NotebookLM generation
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m scripts.kesher_runtime.github_only_media_production "$COMMAND_ID"
      - name: Preserve only private quality evidence (no MP4, no tokens)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-ghonly-protected-production-qa-${{ github.run_id }}
          path: |
            /tmp/kesher-ghonly-new/qa.json
            /tmp/kesher-ghonly-new/ghonly-e5a57c64f85a2e-transcript-he.txt
            /tmp/kesher-ghonly-new/ghonly-e5a57c64f85a2e-visual-review.png
          if-no-files-found: warn
          retention-days: 2
