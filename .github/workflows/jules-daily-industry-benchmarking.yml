name: Jules Daily Kesher Industry Benchmarking

on:
  schedule:
    # 02:40 Israel time during daylight saving.
    - cron: "40 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-daily-kesher-industry-benchmarking
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Stop if benchmarking PR is already open
        id: backlog_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          title_pattern = re.compile(r"^\[jules-review\]\s+Kesher industry review:", re.I)
          branch_pattern = re.compile(
              r"(?:^|[/_-])(?:industry[-_ ]?(?:review|benchmark)|competitor[-_ ]?benchmark)(?:$|[/_-])",
              re.I,
          )
          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if title_pattern.search(pr.get("title") or "")
              or branch_pattern.search(((pr.get("head") or {}).get("ref") or ""))
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")
          if blockers:
              print("Open industry-benchmarking PR exists; no Jules session will be started.")
              print("\n".join(blockers[:20]))
          PY

      - name: Start Jules benchmarking session
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Daily Kesher industry competitor benchmarking",
            "prompt": "Run fully autonomously. Do not ask the user for confirmation, clarification, approval, review, or implementation choices. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue.\n\nRepository: yanivsa/kesher-website. Start from main.\n\nGoal: perform a recurring competitive benchmark analysis for the Kesher website against top-tier Israeli websites in parenting guidance and couples counseling. Try to learn from them and make Shira's website match or exceed the highest industry standards.\n\nSite context:\nThis is the Hebrew website for Shira Saharoni / שירה סהרוני. She is strictly defined as a couples counselor (יועצת זוגית) and parenting guide/facilitator (מנחת הורים / הדרכת הורים). Her primary services are couples counseling and parenting guidance. Do NOT optimize for, benchmark against, add, or refer to divorce (גירושין), legal services (עריכת דין / עו\"ד), or family mediation (גישור) anywhere on the site, metadata, or prompts. Preserve the canonical spelling already used in src/constants/siteConfig.ts and visible site copy.\n\nRead first:\n- src/constants/siteConfig.ts\n- src/pages/Home/Home.tsx\n- src/pages/About/*\n- src/pages/Services/**/*\n\nTask details:\n1. Search the web for top-tier Israeli marriage/couples counselors and parenting guides/facilitators in Hebrew (e.g., search terms: 'ייעוץ זוגי מומלץ באשדוד', 'הדרכת הורים מומלצת').\n2. Inspect the search results and look at websites of the highest levels in Israel. Analyze their content structure, call-to-actions, tone of voice, visual hierarchy, and layout details.\n3. Identify one specific layout, component, copywriting, or navigation element where Shira's site can be improved to match or surpass these top-tier competitor websites.\n4. Safely implement this single improvement in the repository (e.g., refactoring visible Hebrew copy, adding a trust-building section, optimizing CTA copy/alignment, or structuring service descriptions better).\n\nRequired checks before PR:\n- Hebrew copy must sound natural and Israeli, not translated-English or AI-like.\n- Run npm run check.\n\nCreate one ready-for-review PR automatically only if a focused improvement was made. Do not create a draft PR. PR title must start with `[jules-review] Kesher industry review:`. Industry-review PRs are not eligible for automatic merge and must never use a `[jules-automerge]` prefix. PR summary must include: search query used, competitor websites analyzed, specific best practice learned and implemented, changed files, and validation command.",
            "sourceContext": {
              "source": "sources/github/yanivsa/kesher-website",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          jq '.prompt += "\n\nHard evidence guardrail: Never invent, infer, strengthen, or generalize credentials, certifications, degrees, clinical experience, years of experience, client volume, locations served, testimonials, outcomes, or professional claims. Treat competitor claims only as layout/content-pattern inspiration, never as facts about Shira. If the chosen improvement would require unsupported facts, choose another focused improvement or finish as a no-op. Never replace a missing-fact TODO with generic authority copy. The PR body must name the exact search query and exact public competitor page URLs actually inspected, plus the specific observed pattern used. Search-result snippets, generic domain names, or unrecorded browsing are not evidence. If exact evidence is unavailable, make no edit and finish as a clean no-op.\n\nEvidence-before-edit gate: before changing any file, record in the Jules activity stream the exact search query, at least two exact public competitor page URLs that were successfully opened, and one concrete observed layout/navigation/CTA pattern. Do not create scratch search scripts in the repository. Until this evidence block exists, git status must remain clean. Clinical boundaries, treatment contraindications, diagnostic language, safety guidance, addiction/trauma claims, credentials, service scope, and generated files such as `public/llms-full.txt` are never eligible industry-benchmark edits. Prefer a reversible presentation or navigation improvement that does not assert new facts about Shira or her services. If the evidence block cannot be completed, finish as a true clean no-op before editing.\n\nTerminal invariant: never report COMPLETED with a changeSet but no pull request. A meaningful change must be current-main based, validated, committed, pushed, and represented by one non-draft PR with the required [jules-review] prefix and exact evidence. If submission or evidence fails, remove the changeSet and finish as a factual clean no-op or explicit failure without asking the user."' payload.json > payload.tmp
          mv payload.tmp payload.json

          status="$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)"
          cat response.json
          test "${status}" = "200" -o "${status}" = "201"

      - name: Enforce autonomous terminal Jules state
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 .github/scripts/watch-jules-session.py \
            --payload payload.json \
            --response response.json \
            --max-seconds 3600 \
            --poll-seconds 10 \
            --max-replacements 1
