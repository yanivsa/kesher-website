name: Deploy OpenClaw Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-cloudflare-tunnel.yml
      - scripts/openclaw_enable_cloudflare_tunnel.sh

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
      PUBLIC_HOSTNAME: openclaw.saharoni.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            case "$code" in
              400|403|429|500|502|503|504)
                echo "OCI bridge transient HTTP $code attempt=$i" >&2
                sleep 5
                continue
                ;;
              *)
                echo "OCI bridge returned HTTP $code" >&2
                exit 1
                ;;
            esac
          done
          [ "$code" = 200 ] || { echo "OCI bridge did not become ready in time (last HTTP $code)" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
          echo OCI_BRIDGE_OK=true
      - name: Build bounded live tunnel repair bootstrap
        run: |
          set -euo pipefail
          script_sha="$(sha256sum scripts/openclaw_enable_cloudflare_tunnel.sh | awk '{print $1}')"
          cat >/tmp/openclaw-cloudflare-bootstrap.sh <<EOF
          #!/bin/bash
          set -Eeuo pipefail
          url='https://raw.githubusercontent.com/yanivsa/kesher-website/${GITHUB_SHA}/scripts/openclaw_enable_cloudflare_tunnel.sh'
          expected='${script_sha}'
          tmp='/tmp/openclaw_enable_cloudflare_tunnel.sh'
          curl -fsSL --proto '=https' --tlsv1.2 "\$url" -o "\$tmp"
          printf '%s  %s\n' "\$expected" "\$tmp" | sha256sum -c -
          chmod 0700 "\$tmp"
          export PUBLIC_HOSTNAME='${PUBLIC_HOSTNAME}'
          exec "\$tmp"
          EOF
          chmod 0700 /tmp/openclaw-cloudflare-bootstrap.sh
          bytes="$(wc -c </tmp/openclaw-cloudflare-bootstrap.sh | tr -d '[:space:]')"
          echo "OPENCLAW_OCI_BOOTSTRAP_BYTES=${bytes}"
          [ "$bytes" -ge 1 ] && [ "$bytes" -le 4096 ] || { echo "OPENCLAW_CLOUDFLARE_FAILED=OCI_BOOTSTRAP_TOO_LARGE_${bytes}"; exit 1; }
          echo OPENCLAW_LIVE_TUNNEL_REUSE_READY=true
      - name: Deploy cloudflared through OCI Run Command
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_agent_command.py \
            --config /tmp/oci.cfg \
            --instance-name openclaw-e2-tailscale \
            --script-file /tmp/openclaw-cloudflare-bootstrap.sh \
            --timeout 420
      - name: Verify Access protects public hostname
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/public-body -D /tmp/public-headers -w '%{http_code}' --max-time 20 "https://${PUBLIC_HOSTNAME}/" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/public-headers)"
          if [ "$code" = 302 ] || [ "$code" = 303 ] || [ "$code" = 307 ] || [ "$code" = 308 ]; then
            printf '%s' "$location" | grep -qi 'cloudflareaccess.com' || { echo "Unexpected redirect: $location"; exit 1; }
            echo CLOUDFLARE_ACCESS_PROTECTED=true
          else
            grep -Eqi 'cloudflare access|access login' /tmp/public-body || { echo "Unexpected public HTTP status: $code"; exit 1; }
            echo CLOUDFLARE_ACCESS_PROTECTED=true
          fi
          echo "OPENCLAW_PUBLIC_URL=https://${PUBLIC_HOSTNAME}/"
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg /tmp/openclaw-cloudflare-bootstrap.sh /tmp/openclaw_enable_cloudflare_tunnel.sh /tmp/public-body /tmp/public-headers
