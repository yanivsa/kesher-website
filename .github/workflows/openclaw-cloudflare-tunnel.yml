name: Deploy OpenClaw Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-cloudflare-tunnel.yml
      - scripts/openclaw_enable_cloudflare_tunnel.sh

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
      TUNNEL_ID: 58988d44-b0c4-4ad0-ba9d-c25b9914e773
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041
        with:
          node-version: 22
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            [ "$code" = 403 ] && { sleep 5; continue; }
            echo "OCI bridge returned HTTP $code" >&2; exit 1
          done
          [ "$code" = 200 ] || { echo "OCI bridge token did not propagate" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
          echo OCI_BRIDGE_OK=true
      - name: Fetch tunnel token securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token" \
            -o /tmp/tunnel-token.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          d=json.load(open('/tmp/tunnel-token.json'))
          assert d.get('success') and d.get('result')
          b64=base64.b64encode(d['result'].encode()).decode()
          template=Path('scripts/openclaw_enable_cloudflare_tunnel.sh').read_text()
          Path('/tmp/openclaw-cloudflare.sh').write_text("export CLOUDFLARE_TUNNEL_TOKEN_B64='"+b64+"'\n"+template)
          Path('/tmp/openclaw-cloudflare.sh').chmod(0o700)
          PY
          rm -f /tmp/tunnel-token.json
          echo CLOUDFLARE_TUNNEL_TOKEN_READY=true
      - name: Deploy cloudflared through OCI Run Command
        run: |
          set -euo pipefail
          python -u scripts/oci_openclaw_agent_command.py \
            --config /tmp/oci.cfg \
            --instance-name openclaw-e2-tailscale \
            --script-file /tmp/openclaw-cloudflare.sh \
            --timeout 420
      - name: Verify Access protects public hostname
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/public-body -D /tmp/public-headers -w '%{http_code}' --max-time 20 https://openclaw.the-israeli-lawyer.com/ || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/public-headers)"
          if [ "$code" = 302 ] || [ "$code" = 303 ] || [ "$code" = 307 ] || [ "$code" = 308 ]; then
            printf '%s' "$location" | grep -qi 'cloudflareaccess.com' || { echo "Unexpected redirect: $location"; exit 1; }
            echo CLOUDFLARE_ACCESS_PROTECTED=true
          else
            grep -Eqi 'cloudflare access|access login' /tmp/public-body || { echo "Unexpected public HTTP status: $code"; exit 1; }
            echo CLOUDFLARE_ACCESS_PROTECTED=true
          fi
          echo OPENCLAW_PUBLIC_URL=https://openclaw.the-israeli-lawyer.com/
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg /tmp/openclaw-cloudflare.sh /tmp/tunnel-token.json /tmp/public-body /tmp/public-headers
