name: Kesher Content Controller V6 Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "config/kesher-production-contract.json"
      - "scripts/kesher_automation_policy.py"
      - "scripts/kesher_intervention_policy.py"
      - "scripts/kesher_jules_incident_repair.py"
      - "scripts/kesher_three_strike_runtime.py"
      - "scripts/kesher_e2e_delivery_guard.py"
      - "scripts/kesher_content_controller_stabilized.py"
      - "scripts/kesher_content_controller_v5_runtime.py"
      - "scripts/kesher_content_controller_v6_runtime.py"
      - "scripts/kesher_video_asset_resolver.py"
      - "scripts/kesher_video_enhancement.py"
      - "scripts/motion_plan_generator.py"
      - "scripts/kesher_short_motion_plan.py"
      - "src/remotion/**"
      - "tests/test_kesher_intervention_policy.py"
      - "tests/test_kesher_jules_incident_repair.py"
      - "tests/test_kesher_supervision_contract.py"
      - "tests/test_kesher_three_strike_runtime.py"
      - "tests/test_kesher_stabilized_supervision.py"
      - "tests/test_kesher_v6_intervention_isolation.py"
      - "tests/test_kesher_v6_shadow_learning.py"
      - "tests/test_kesher_optional_video_enrichment.py"
      - "tests/test_video_enhancement_contract.py"
      - ".github/workflows/kesher-content-controller-v6.yml"

permissions:
  contents: read

concurrency:
  group: kesher-content-controller-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shadow-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify shared supervision policy, enhancement contract and V5/V6 isolation
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_kesher_intervention_policy \
            tests.test_kesher_jules_incident_repair \
            tests.test_kesher_supervision_contract \
            tests.test_kesher_three_strike_runtime \
            tests.test_kesher_stabilized_supervision \
            tests.test_kesher_v6_intervention_isolation \
            tests.test_kesher_v6_shadow_learning \
            tests.test_kesher_optional_video_enrichment \
            tests.test_video_enhancement_contract

      - name: Compile V5/V6 intervention runtimes
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/kesher_automation_policy.py \
            scripts/kesher_intervention_policy.py \
            scripts/kesher_jules_incident_repair.py \
            scripts/kesher_three_strike_runtime.py \
            scripts/kesher_content_controller_stabilized.py \
            scripts/kesher_content_controller_v5_runtime.py \
            scripts/kesher_content_controller_v6_runtime.py

      - name: Run V6 shadow self-check
        env:
          KESHER_PIPELINE_ID: v6
          KESHER_CONTROLLER_STATE_REF: automation-state-v6
          KESHER_ARTIFACT_NAMESPACE: kesher-v6
        run: |
          set -euo pipefail
          python3 -u scripts/kesher_content_controller_v6_runtime.py --report-json | tee /tmp/kesher-v6.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/kesher-v6.json').read_text(encoding='utf-8'))
          assert payload['pipeline_id'] == 'v6'
          assert payload['state_ref'] == 'automation-state-v6'
          assert payload['artifact_namespace'] == 'kesher-v6'
          assert payload['concurrency_group'] == 'kesher-content-controller-v6'
          assert payload['production_dispatch_enabled'] is False
          PY

      - name: Analyze current V5 incident read-only
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch origin automation-state:refs/remotes/origin/automation-state --depth=1
          git show refs/remotes/origin/automation-state:.kesher-controller/state.json > /tmp/kesher-v5-state.json
          python3 -u scripts/kesher_content_controller_v6_runtime.py \
            --analyze-v5-state /tmp/kesher-v5-state.json | tee /tmp/kesher-v6-learning.json
          {
            echo '## Kesher V6 shadow incident learner'
            echo '```json'
            cat /tmp/kesher-v6-learning.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
