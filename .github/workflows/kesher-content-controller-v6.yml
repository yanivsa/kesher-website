name: Kesher Content Controller V6 Shadow

on:
  workflow_dispatch:
    inputs:
      target_slug:
        description: Exact article slug for read-only live reconciliation
        required: true
        type: string
      target_content_sha256:
        description: Exact authoritative content SHA-256
        required: true
        type: string
      pr_number:
        description: Optional exact article PR number
        required: false
        type: string
      short_artifact_id:
        description: Optional existing immutable Short archive artifact id for read-only QA
        required: false
        type: string
      short_item_id:
        description: Optional exact native Short item id for read-only QA
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "config/kesher-production-contract.json"
      - "scripts/kesher_intervention_policy.py"
      - "scripts/kesher_three_strike_runtime.py"
      - "scripts/kesher_e2e_delivery_guard.py"
      - "scripts/kesher_content_controller_v5_runtime.py"
      - "scripts/kesher_content_controller_v6_runtime.py"
      - "scripts/kesher_v6_production_shadow.py"
      - "tests/test_v6_production_shadow.py"
      - "scripts/kesher_daily_pipeline.py"
      - "scripts/kesher_short_pipeline_v4.py"
      - "scripts/kesher_video_reconcile.py"
      - "scripts/kesher_video_upload_guard.py"
      - "scripts/kesher_video_asset_resolver.py"
      - "scripts/kesher_video_enhancement.py"
      - "scripts/motion_plan_generator.py"
      - "scripts/kesher_short_motion_plan.py"
      - "src/remotion/**"
      - "tests/test_kesher_intervention_policy.py"
      - "tests/test_kesher_three_strike_runtime.py"
      - "tests/test_kesher_v6_intervention_isolation.py"
      - "tests/test_kesher_optional_video_enrichment.py"
      - "tests/test_video_enhancement_contract.py"
      - ".github/workflows/kesher-content-controller-v6.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

concurrency:
  group: kesher-content-controller-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shadow-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify shared intervention policy, enhancement contract and V5/V6 isolation
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_kesher_intervention_policy \
            tests.test_kesher_three_strike_runtime \
            tests.test_kesher_v6_intervention_isolation \
            tests.test_v6_production_shadow \
            tests.test_kesher_optional_video_enrichment \
            tests.test_video_enhancement_contract

      - name: Compile V5/V6 intervention runtimes
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/kesher_intervention_policy.py \
            scripts/kesher_three_strike_runtime.py \
            scripts/kesher_content_controller_v5_runtime.py \
            scripts/kesher_content_controller_v6_runtime.py

      - name: Run V6 shadow self-check
        env:
          KESHER_PIPELINE_ID: v6
          KESHER_CONTROLLER_STATE_REF: automation-state-v6
          KESHER_ARTIFACT_NAMESPACE: kesher-v6
        run: |
          set -euo pipefail
          python3 -u scripts/kesher_content_controller_v6_runtime.py --report-json | tee /tmp/kesher-v6.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/kesher-v6.json').read_text(encoding='utf-8'))
          assert payload['pipeline_id'] == 'v6'
          assert payload['state_ref'] == 'automation-state-v6'
          assert payload['artifact_namespace'] == 'kesher-v6'
          assert payload['concurrency_group'] == 'kesher-content-controller-v6'
          assert payload['production_dispatch_enabled'] is False
          PY

      - name: Observe exact production target without mutation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SLUG: ${{ inputs.target_slug }}
          TARGET_SHA: ${{ inputs.target_content_sha256 }}
          TARGET_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          args=(--production-shadow --slug "$TARGET_SLUG" --content-sha256 "$TARGET_SHA" --github-summary)
          if [[ -n "$TARGET_PR" ]]; then args+=(--pr-number "$TARGET_PR"); fi
          python3 -B -m scripts.kesher_content_controller_v6_runtime "${args[@]}" | tee /tmp/kesher-v6-production-shadow.json

      - name: Preserve read-only shadow diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kesher-v6-production-shadow
          path: /tmp/kesher-v6-production-shadow.json

  recover-original-for-qa:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yanivsa/kesher-website' && github.ref == 'refs/heads/main' && inputs.short_artifact_id != '' && inputs.short_item_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch only approved type of original immutable media artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_ARTIFACT_ID: ${{ inputs.short_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$EXPORT_ARTIFACT_ID" =~ ^[0-9]{6,15}$ ]] || exit 2
          artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPORT_ARTIFACT_ID}" --jq .name)"
          [ "$artifact_name" = "kesher-short-v4-state" ] || { echo 'Refusing unknown artifact class'; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPORT_ARTIFACT_ID}/zip" > /tmp/kesher-short-source.zip

      - name: Install ffprobe package for Short QA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe

      - name: Validate exact native 9:16 Short and export only approved review evidence
        env:
          EXPORT_ITEM: ${{ inputs.short_item_id }}
          EXPORT_SLUG: ${{ inputs.target_slug }}
          EXPORT_SHA: ${{ inputs.target_content_sha256 }}
          EXPORT_ARTIFACT_ID: ${{ inputs.short_artifact_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from zipfile import ZipFile
          item_id = os.environ['EXPORT_ITEM'].strip()
          slug = os.environ['EXPORT_SLUG'].strip()
          sha = os.environ['EXPORT_SHA'].strip()
          assert re.fullmatch(r'video-[0-9]{8}-[0-9]{6}-[0-9a-f]{10,64}', item_id)
          assert re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug)
          assert re.fullmatch(r'[0-9a-f]{64}', sha)
          output = Path('kesher-short-qa')
          output.mkdir(exist_ok=True)
          with ZipFile('/tmp/kesher-short-source.zip') as archive:
              state = json.loads(archive.read('state.json'))
              items = [x for x in state.get('items', []) if isinstance(x,dict) and x.get('id')==item_id]
              assert len(items)==1, 'Short item not unique'
              item = items[0]
              assert item.get('type')=='article_short'
              assert item.get('source_mode')=='direct-short', 'Not native vertical Short'
              assert item.get('source',{}).get('slug')==slug
              assert item.get('source',{}).get('content_sha256')==sha
              assert item.get('technical_verified') is True
              assert item.get('uploaded') is not True, 'Already uploaded; verify before proceeding'
              assert item.get('status') in ('pending_review','approved')
              targets=[
                (item['final_mp4'],item['final_sha256'],'short-final.mp4'),
                (item['visual_review_path'],item['visual_review_sha256'],'visual-review.png'),
                (item['transcript_path'],item['transcript_sha256'],'transcript-he.txt'),
                (item['source_path'],item['source_file_sha256'],'source-he.txt'),
                (item['manifest_path'],item['manifest_sha256'],'manifest.json'),
              ]
              frames=item.get('frame_paths') or []
              assert len(frames)==8
              for i,name in enumerate(frames,1):
                  assert name.startswith(item_id+'-frames/frame-') and name.endswith('.png')
                  targets.append((name,item['frame_sha256'][name],f'frame-{i}.png'))
              for member,expected,destination in targets:
                  assert member in archive.namelist()
                  assert sum(info.filename==member for info in archive.infolist())==1
                  digest=hashlib.sha256()
                  with archive.open(member) as src,(output/destination).open('wb') as dst:
                      while chunk:=src.read(1024*1024):
                          dst.write(chunk);digest.update(chunk)
                  assert digest.hexdigest()==expected, f'SHA256 mismatch: {destination}'
              (output/'identity.json').write_text(json.dumps({
                  'short_item_id':item_id, 'source_slug':slug, 'source_sha256':sha,
                  'artifact_id':os.environ['EXPORT_ARTIFACT_ID'],
                  'final_sha256':item['final_sha256'],
                  'native_portrait':True,'technical_verified':True,
                  'visual_review':'PENDING_INDEPENDENT_REVIEW',
                  'semantic_review':'PENDING_INDEPENDENT_REVIEW',
                  'youtube_upload':'NOT_ATTEMPTED',
              },indent=2),encoding='utf-8')
          print('SHORT_ORIGINAL_SOURCE_AND_MEDIA_HASHES_VERIFIED')
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of json kesher-short-qa/short-final.mp4 > /tmp/qa-probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/qa-probe.json'))
          streams=p['streams']
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in streams)
          assert any(s.get('codec_type')=='audio' for s in streams)
          assert 1 <= float(p['format']['duration']) <= 180
          print('SHORT_ORIGINAL_9_16_VIDEO_AUDIO_VERIFIED')
          PY

      - name: Upload only derived evidence for independent review (never to YouTube)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kesher-short-independent-qa-${{ github.run_id }}
          path: kesher-short-qa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
