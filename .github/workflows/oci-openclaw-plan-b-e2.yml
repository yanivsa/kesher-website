name: OCI Always Free OpenClaw Plan B E2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oci-openclaw-plan-b-e2.yml
      - scripts/oci_openclaw_rebuild_ssh.py
      - scripts/oci_openclaw_plan_b_e2.py

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            if [ "$code" = 403 ]; then sleep 5; continue; fi
            echo "OCI bridge returned HTTP $code" >&2
            exit 1
          done
          [ "$code" = 200 ] || { echo "OCI bridge token did not propagate in time" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
          echo OCI_BRIDGE_OK=true
      - name: Rebuild broken Tailscale VM with temporary SSH
        run: |
          set -euo pipefail
          ssh-keygen -q -t rsa -b 3072 -N '' -f /tmp/bootkey
          ip="$(curl -fsS https://api.ipify.org)"
          python -u scripts/oci_openclaw_rebuild_ssh.py \
            --config /tmp/oci.cfg \
            --ssh-public-key-file /tmp/bootkey.pub \
            --bootstrap-cidr "$ip/32" \
            --result-json /tmp/rebuild.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/rebuild.json'))
          print('REBUILD_STATUS='+str(d.get('status')))
          for k in ('shape','availability_domain','lifecycle_state','public_ip'):
              if d.get(k): print('REBUILD_'+k.upper()+'='+str(d[k]))
          PY
      - name: Install OpenClaw and Tailscale over one SSH session
        run: |
          set -euo pipefail
          status="$(python3 -c 'import json;print(json.load(open("/tmp/rebuild.json")).get("status",""))')"
          [ "$status" = created ] || { echo "SSH setup skipped: $status"; exit 0; }
          ip="$(python3 -c 'import json;print(json.load(open("/tmp/rebuild.json"))["public_ip"])')"
          for i in $(seq 1 90); do
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i /tmp/bootkey "ubuntu@$ip" 'echo ok' >/dev/null 2>&1 && break
            sleep 5
          done
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/bootkey "ubuntu@$ip" 'echo SSH_BOOTSTRAP_OK=true'

          gateway_token="$(openssl rand -hex 32)"
          set +e
          remote_output="$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes -o ConnectTimeout=10 -i /tmp/bootkey "ubuntu@$ip" "sudo bash -s -- '$gateway_token'" <<'REMOTE'
          set -Eeuo pipefail
          TOKEN="$1"
          export HOME=/root
          export OPENCLAW_NO_PROMPT=1

          if ! swapon --show | grep -q /swapfile; then
            (fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048) >/var/log/openclaw-bootstrap.log 2>&1
            chmod 600 /swapfile
            mkswap /swapfile >>/var/log/openclaw-bootstrap.log 2>&1
            swapon /swapfile
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          apt-get update >>/var/log/openclaw-bootstrap.log 2>&1
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates git >>/var/log/openclaw-bootstrap.log 2>&1
          if ! command -v openclaw >/dev/null 2>&1 && ! find /root -type f -name openclaw -perm -111 -print -quit 2>/dev/null | grep -q .; then
            curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install.sh | bash -s -- --no-prompt --no-onboard >>/var/log/openclaw-install.log 2>&1
          fi
          B="$(command -v openclaw || find /root -type f -name openclaw -perm -111 2>/dev/null | head -1)"
          test -n "$B"
          VERSION="$($B --version | head -1)"
          "$B" config set gateway.mode local >/dev/null
          "$B" config set gateway.bind tailnet >/dev/null
          "$B" config set gateway.auth.mode token >/dev/null
          "$B" config set gateway.auth.token "$TOKEN" >/dev/null
          "$B" config set gateway.tailscale.mode off >/dev/null
          "$B" config set agents.defaults.model.primary openai/gpt-5.6-sol >/dev/null
          "$B" config validate >/dev/null

          cat >/etc/systemd/system/openclaw-gateway.service <<EOF
          [Unit]
          Description=OpenClaw Gateway
          After=network-online.target tailscaled.service
          Wants=network-online.target tailscaled.service

          [Service]
          Type=simple
          Environment=HOME=/root
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/root/.local/bin
          ExecStart=$B gateway --port 18789
          Restart=always
          RestartSec=5
          RestartPreventExitStatus=78
          TimeoutStopSec=30
          SuccessExitStatus=0 143
          OOMPolicy=continue

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable openclaw-gateway.service >/dev/null

          curl -fsSL https://tailscale.com/install.sh | sh >>/var/log/tailscale-install.log 2>&1
          systemctl enable --now tailscaled >/dev/null
          timeout 25s tailscale up --ssh --hostname=openclaw > /var/log/tailscale-up.log 2>&1 || true

          cat >/usr/local/sbin/openclaw-wait-tailnet.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          for i in $(seq 1 17280); do
            state="$(tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState", ""))' 2>/dev/null || true)"
            if [ "$state" = Running ]; then
              systemctl restart openclaw-gateway.service
              exit 0
            fi
            sleep 5
          done
          exit 1
          EOF
          chmod 700 /usr/local/sbin/openclaw-wait-tailnet.sh
          cat >/etc/systemd/system/openclaw-wait-tailnet.service <<'EOF'
          [Unit]
          Description=Start OpenClaw after Tailscale authentication
          After=tailscaled.service
          Requires=tailscaled.service

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/openclaw-wait-tailnet.sh
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now openclaw-wait-tailnet.service >/dev/null

          TS_URL="$(grep -oE 'https://login\.tailscale\.com/[^[:space:]]+' /var/log/tailscale-up.log | tail -1 || true)"
          printf 'OPENCLAW_VERSION=%s\n' "$VERSION"
          printf 'OPENCLAW_TAILNET_BOOTSTRAP_INSTALLED=true\n'
          if [ -z "$TS_URL" ]; then
            printf 'TAILSCALE_AUTH_URL_MISSING=true\n'
            tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print("TAILSCALE_BACKEND_STATE="+json.load(sys.stdin).get("BackendState","unknown"))' || true
            exit 3
          fi
          printf 'TAILSCALE_AUTH_URL=%s\n' "$TS_URL"
          REMOTE
          )"
          ssh_rc=$?
          set -e

          printf '%s\n' "$remote_output" | grep -E '^(OPENCLAW_VERSION|OPENCLAW_TAILNET_BOOTSTRAP_INSTALLED|TAILSCALE_BACKEND_STATE|TAILSCALE_AUTH_URL_MISSING)=' || true
          if [ "$ssh_rc" -ne 0 ]; then
            echo "REMOTE_SETUP_FAILED_RC=$ssh_rc"
            exit "$ssh_rc"
          fi

          ts_url="$(printf '%s\n' "$remote_output" | sed -n 's/^TAILSCALE_AUTH_URL=//p' | tail -1)"
          if [ -z "$ts_url" ]; then
            echo "TAILSCALE_AUTH_URL_MISSING_AFTER_CAPTURE=true"
            exit 1
          fi
          cipher_url="$(printf '%s' "$ts_url" | python3 -c 'import sys; from scripts.oci_openclaw_plan_b_e2 import encrypt_for_chat; print(encrypt_for_chat(sys.stdin.read().strip()))')"
          cipher_token="$(printf '%s' "$gateway_token" | python3 -c 'import sys; from scripts.oci_openclaw_plan_b_e2 import encrypt_for_chat; print(encrypt_for_chat(sys.stdin.read().strip()))')"
          echo "TAILSCALE_AUTH_URL_ENCRYPTED=$cipher_url"
          echo "OPENCLAW_GATEWAY_TOKEN_ENCRYPTED=$cipher_token"
          echo OPENCLAW_TAILSCALE_LOGIN_READY=true
      - name: Close temporary SSH
        if: ${{ always() }}
        run: |
          if [ -s /tmp/rebuild.json ] && [ -s /tmp/oci.cfg ]; then
            sl="$(python3 -c 'import json;print(json.load(open("/tmp/rebuild.json")).get("security_list_id") or "")')"
            [ -z "$sl" ] || python -u scripts/oci_openclaw_bootstrap.py --config /tmp/oci.cfg --close-ssh --security-list-id "$sl"
          fi
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg /tmp/bootkey /tmp/bootkey.pub /tmp/rebuild.json
