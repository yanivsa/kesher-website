name: Recover OpenClaw Preserving Tailnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/openclaw-preserve-tailnet-recovery.yml
      - scripts/oci_openclaw_preserve_tailnet_rebuild.py
      - scripts/openclaw_finalize_tailscale_serve_ssh.sh

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRIDGE_NAME: yanivsa-oci-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.183.0'
      - name: Decrypt OCI bundle through Cloudflare bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" | npx --yes wrangler@4.100.0 secret put CONTROL_TOKEN --name "$BRIDGE_NAME" >/dev/null
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://${BRIDGE_NAME}.${subdomain}.workers.dev/decrypt"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oci.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @.github/oci-bootstrap/encrypted-oci-bundle.json "$url")"
            [ "$code" = 200 ] && break
            if [ "$code" = 403 ]; then sleep 5; continue; fi
            echo "OCI bridge returned HTTP $code" >&2
            exit 1
          done
          [ "$code" = 200 ] || { echo "OCI bridge token did not propagate in time" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/oci.json'))
          assert all(d.get(k) for k in ('user','fingerprint','tenancy','region','private_key_pem'))
          Path('/tmp/oci.pem').write_text(d['private_key_pem']); Path('/tmp/oci.pem').chmod(0o600)
          Path('/tmp/oci.cfg').write_text('[DEFAULT]\nuser='+d['user']+'\nfingerprint='+d['fingerprint']+'\ntenancy='+d['tenancy']+'\nregion='+d['region']+'\nkey_file=/tmp/oci.pem\n'); Path('/tmp/oci.cfg').chmod(0o600)
          PY
          echo OCI_BRIDGE_OK=true
      - name: Preserve authenticated disk and relaunch VM
        run: |
          set -euo pipefail
          ssh-keygen -q -t rsa -b 3072 -N '' -f /tmp/recoverykey
          runner_ip="$(curl -fsS https://api.ipify.org)"
          python -u scripts/oci_openclaw_preserve_tailnet_rebuild.py \
            --config /tmp/oci.cfg \
            --ssh-public-key-file /tmp/recoverykey.pub \
            --bootstrap-cidr "$runner_ip/32" \
            --result-json /tmp/recovery.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/recovery.json'))
          for k in ('status','shape','availability_domain','lifecycle_state','public_ip'):
              if d.get(k): print('RECOVERY_'+k.upper()+'='+str(d[k]))
          PY
      - name: Finalize and verify through temporary SSH
        run: |
          set -euo pipefail
          ip="$(python3 -c 'import json;print(json.load(open("/tmp/recovery.json"))["public_ip"])')"
          ready=0
          for i in $(seq 1 120); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i /tmp/recoverykey "ubuntu@$ip" 'echo ok' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo SSH_RECOVERY_KEY_NOT_READY=true; exit 1; }
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            -i /tmp/recoverykey "ubuntu@$ip" 'sudo bash -s' \
            < scripts/openclaw_finalize_tailscale_serve_ssh.sh
      - name: Close temporary SSH
        if: ${{ always() }}
        run: |
          set +e
          if [ -s /tmp/recovery.json ] && [ -s /tmp/oci.cfg ]; then
            sl="$(python3 -c 'import json;print(json.load(open("/tmp/recovery.json")).get("security_list_id") or "")')"
            [ -z "$sl" ] || python -u scripts/oci_openclaw_bootstrap.py --config /tmp/oci.cfg --close-ssh --security-list-id "$sl"
          fi
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f /tmp/oci.json /tmp/oci.pem /tmp/oci.cfg /tmp/recoverykey /tmp/recoverykey.pub /tmp/recovery.json
